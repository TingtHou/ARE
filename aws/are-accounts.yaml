          const jres = (code, obj, h) => res(code, obj, Object.assign({ 'content-type': 'application/json' }, h || {}));
          function bodyOf(ev) {
            const raw = ev.isBase64Encoded ? Buffer.from(ev.body || '', 'base64').toString('utf8') : (ev.body || '');
