AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ARE Study System accounts. Email + password sign-in (Amazon Cognito) and a
  small API that stores each person's study progress (API Gateway + Lambda +
  DynamoDB), plus an admin-only Publish action that moves the live branch to the
  preview branch on GitHub. After the stack is created, copy the Outputs into config.js.

Parameters:
  SiteOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: >-
      Web addresses allowed to call the API, comma-separated, no trailing slash, e.g.
      https://main.d27g401yt8k71l.amplifyapp.com,https://develop.d27g401yt8k71l.amplifyapp.com
      Use * to allow any site.
  GitHubRepo:
    Type: String
    Default: TingtHou/ARE
    Description: owner/name of the repository the site deploys from.
  LiveBranch:
    Type: String
    Default: main
  PreviewBranch:
    Type: String
    Default: develop
  GitHubTokenParameter:
    Type: String
    Default: /are-study-system/github-token
    Description: >-
      Name of the Systems Manager SecureString parameter holding a GitHub
      fine-grained token (this repository only, Contents read and write).
      Create it before using Publish; the stack only reads it.
  SiteUrl:
    Type: String
    Default: https://main.d27g401yt8k71l.amplifyapp.com
    Description: >-
      The live site, no trailing slash. The Claude connector reads the shared
      material (material/*.js and the notes) from here.
  ChatGPTKeyParameter:
    Type: String
    Default: /are-study-system/chatgpt-token-key
    Description: >-
      Systems Manager parameter holding the key that encrypts stored ChatGPT
      credentials. The ChatGPT function creates it on first use; nothing to set up.
  StudyTimeZone:
    Type: String
    Default: America/Chicago
    Description: Time zone the connector uses for "today" (plan weeks, study days).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: are-study-system-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your ARE Study System code
        EmailMessage: 'Your ARE Study System verification code is {####}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: are-study-system-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 90
      TokenValidityUnits:
        RefreshToken: days

  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: are-study-system-progress
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      TimeToLiveSpecification:        # the connector's sign-in codes and tokens expire on their own
        AttributeName: ttl
        Enabled: true

  ProgressFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: progress-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt ProgressTable.Arn

  ProgressFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: are-study-system-progress
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ProgressFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE: !Ref ProgressTable
      Code:
        ZipFile: |
          // GET /progress returns the signed-in person's saved progress; PUT /progress replaces it.
          // The person is identified only by the verified sign-in token (the "sub" claim).
          const { DynamoDBClient, GetItemCommand, PutItemCommand } = require('@aws-sdk/client-dynamodb');
          const db = new DynamoDBClient({});
          const TABLE = process.env.TABLE;
          const json = (code, body) => ({ statusCode: code, headers: { 'content-type': 'application/json' }, body });
          exports.handler = async (event) => {
            const claims = event.requestContext && event.requestContext.authorizer && event.requestContext.authorizer.jwt && event.requestContext.authorizer.jwt.claims;
            const sub = claims && claims.sub;
            if (!sub) return json(401, '{"error":"not signed in"}');
            const method = event.requestContext.http.method;
            if (method === 'GET') {
              const r = await db.send(new GetItemCommand({ TableName: TABLE, Key: { userId: { S: sub } } }));
              return json(200, r.Item && r.Item.data ? r.Item.data.S : 'null');
            }
            if (method === 'PUT') {
              const body = event.isBase64Encoded ? Buffer.from(event.body || '', 'base64').toString('utf8') : (event.body || '');
              if (!body || body.length > 350000) return json(400, '{"error":"progress is empty or too large"}');
              let parsed;
              try { parsed = JSON.parse(body); } catch (e) { return json(400, '{"error":"not JSON"}'); }
              if (!parsed || typeof parsed !== 'object') return json(400, '{"error":"not an object"}');
              await db.send(new PutItemCommand({ TableName: TABLE, Item: { userId: { S: sub }, data: { S: body }, updatedAt: { N: String(Date.now()) } } }));
              return { statusCode: 204 };
            }
            return json(405, '{"error":"method not allowed"}');
          };

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: People who may publish the preview site to the live site.
      UserPoolId: !Ref UserPool

  ReleaseFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-github-token
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GitHubTokenParameter}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'

  ReleaseFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: are-study-system-release
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ReleaseFunctionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          REPO: !Ref GitHubRepo
          LIVE: !Ref LiveBranch
          PREVIEW: !Ref PreviewBranch
          TOKEN_PARAM: !Ref GitHubTokenParameter
      Code:
        ZipFile: |
          // GET /release  -> commits on the preview branch that the live branch does not have yet
          // POST /release -> move the live branch to the preview branch's commit (fast-forward only)
          // Only members of the Cognito group "admin" may call either.
          const { SSMClient, GetParameterCommand } = require('@aws-sdk/client-ssm');
          const ssm = new SSMClient({});
          const { REPO, LIVE, PREVIEW, TOKEN_PARAM } = process.env;
          let token = null;
          const json = (code, obj) => ({ statusCode: code, headers: { 'content-type': 'application/json' }, body: JSON.stringify(obj) });
          const isAdmin = (claims) => {
            const g = claims && claims['cognito:groups'];
            const list = Array.isArray(g) ? g : String(g || '').replace(/[\[\]"]/g, '').split(/[\s,]+/);
            return list.includes('admin');
          };
          async function gh(path, init) {
            if (!token) {
              const p = await ssm.send(new GetParameterCommand({ Name: TOKEN_PARAM, WithDecryption: true }));
              token = p.Parameter.Value.trim();
            }
            const r = await fetch('https://api.github.com/repos/' + REPO + path, Object.assign({}, init, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'are-study-system-release', 'Content-Type': 'application/json' }
            }));
            const text = await r.text();
            let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { body = { message: text }; }
            return { status: r.status, body };
          }
          exports.handler = async (event) => {
            const claims = event.requestContext && event.requestContext.authorizer && event.requestContext.authorizer.jwt && event.requestContext.authorizer.jwt.claims;
            if (!claims || !claims.sub) return json(401, { error: 'Not signed in.' });
            if (!isAdmin(claims)) return json(403, { error: 'Only admins can publish.' });
            try {
              const method = event.requestContext.http.method;
              if (method === 'GET') {
                const c = await gh('/compare/' + encodeURIComponent(LIVE) + '...' + encodeURIComponent(PREVIEW));
                if (c.status !== 200) return json(502, { error: 'GitHub compare failed (' + c.status + '): ' + ((c.body && c.body.message) || '') });
                return json(200, {
                  live: LIVE, preview: PREVIEW, ahead: c.body.ahead_by, behind: c.body.behind_by,
                  commits: (c.body.commits || []).map(x => ({ sha: x.sha.slice(0, 7), message: x.commit.message.split('\n')[0], date: x.commit.author && x.commit.author.date }))
                });
              }
              if (method === 'POST') {
                const ref = await gh('/git/ref/heads/' + encodeURIComponent(PREVIEW));
                if (ref.status !== 200) return json(502, { error: 'Could not read ' + PREVIEW + ' (' + ref.status + ').' });
                const sha = ref.body.object.sha;
                const up = await gh('/git/refs/heads/' + encodeURIComponent(LIVE), { method: 'PATCH', body: JSON.stringify({ sha, force: false }) });
                if (up.status === 200) return json(200, { ok: true, sha: sha.slice(0, 7) });
                if (up.status === 422) return json(409, { error: LIVE + ' has changes that ' + PREVIEW + ' does not. Bring ' + PREVIEW + ' up to date first; nothing was published.' });
                return json(502, { error: 'GitHub update failed (' + up.status + '): ' + ((up.body && up.body.message) || '') });
              }
              return json(405, { error: 'Method not allowed.' });
            } catch (e) {
              return json(500, { error: String(e && e.message || e) });
            }
          };

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: are-study-system-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref SiteOrigins
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ProgressIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ProgressFunction.Arn
      PayloadFormatVersion: '2.0'

  GetProgressRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /progress
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ProgressIntegration}'

  PutProgressRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /progress
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ProgressIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProgressFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/progress'

  ReleaseIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReleaseFunction.Arn
      PayloadFormatVersion: '2.0'

  GetReleaseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /release
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ReleaseIntegration}'

  PostReleaseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /release
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ReleaseIntegration}'

  ReleaseInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReleaseFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/release'

  # The original files people upload to My library. Private: the website reaches it only with short-lived
  # signed links from the connector function, and each person's files sit under their own folder.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref SiteOrigins
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: tidy-unfinished-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ConnectorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: connector
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:BatchGetItem]
                Resource: !GetAtt ProgressTable.Arn
              - Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub '${FilesBucket.Arn}/u/*'

  ConnectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: are-study-system-connector
      Description: Claude connector (MCP) for the ARE Study System
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ConnectorFunctionRole.Arn
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref ProgressTable
          CLIENT_ID: !Ref UserPoolClient
          POOL_ID: !Ref UserPool
          SITE_URL: !Ref SiteUrl
          STUDY_TZ: !Ref StudyTimeZone
          CHATGPT_URL: !GetAtt ChatGPTUrl.FunctionUrl
          FILES_BUCKET: !Ref FilesBucket
      Code:
        ZipFile: |  # built from aws/connector.js by build.ps1; edit that file, not this block
          // ARE Study System connector for Claude (claude.ai → Settings → Connectors → Add custom connector).
          // People sign in with their site account; Claude then reads and updates the same progress the site uses.
          //   GET  /.well-known/oauth-protected-resource[/mcp]   where to sign in (RFC 9728)
          //   GET  /.well-known/oauth-authorization-server[/..]  sign-in endpoints (RFC 8414)
          //   POST /oauth/register                              Claude registers itself (RFC 7591)
          //   GET  /oauth/authorize, POST /oauth/authorize      the sign-in page
          //   POST /oauth/token                                 codes and refresh tokens → access tokens
          //   POST /mcp                                         the tools (MCP over Streamable HTTP, JSON replies)
          // Material is read from the live site (material/*.js and notes), so it never needs copying here.
          'use strict';
          const crypto = require('crypto');
          const vm = require('vm');

          const TABLE = process.env.TABLE, CLIENT_ID = process.env.CLIENT_ID, POOL_ID = process.env.POOL_ID;
          const SITE = String(process.env.SITE_URL || '').replace(/\/+$/, '');
          const TZ = process.env.STUDY_TZ || 'America/Chicago';
          const AT_LIFE = 3600, RT_LIFE = 90 * 86400, CODE_LIFE = 300;
          const REDIRECTS = [/^https:\/\/claude\.ai\/api\/mcp\/auth_callback$/, /^https:\/\/claude\.com\/api\/mcp\/auth_callback$/, /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/callback$/,
            /^https:\/\/chatgpt\.com\/connector_platform_oauth_redirect$/, /^https:\/\/chatgpt\.com\/connector\/oauth\/[A-Za-z0-9_-]{1,128}$/];   // Claude, Claude Code, ChatGPT
          const appOf = u => /^https:\/\/chatgpt\.com\//.test(String(u || '')) ? 'ChatGPT' : 'Claude';
          const VERSIONS = ['2025-11-25', '2025-06-18', '2025-03-26', '2024-11-05'];

          /* ---------- storage and sign-in (replaced by fakes in tests) ---------- */
          let deps = null;
          function D() {
            if (deps) return deps;
            const ddb = require('@aws-sdk/client-dynamodb'), cip = require('@aws-sdk/client-cognito-identity-provider');
            const db = new ddb.DynamoDBClient({}), cog = new cip.CognitoIdentityProviderClient({});
            const key = k => ({ userId: { S: k } });
            deps = {
              async get(k) { const r = await db.send(new ddb.GetItemCommand({ TableName: TABLE, Key: key(k), ConsistentRead: true })); return r.Item ? { data: r.Item.data && r.Item.data.S, updatedAt: r.Item.updatedAt ? Number(r.Item.updatedAt.N) : null, ttl: r.Item.ttl ? Number(r.Item.ttl.N) : null } : null; },
              async put(k, data, ttl) { await db.send(new ddb.PutItemCommand({ TableName: TABLE, Item: Object.assign(key(k), { data: { S: data } }, ttl ? { ttl: { N: String(ttl) } } : {}) })); },
              async del(k) { await db.send(new ddb.DeleteItemCommand({ TableName: TABLE, Key: key(k) })); },
              async getMany(keys) {
                const out = {};
                for (let i = 0; i < keys.length; i += 100) {
                  let req = { [TABLE]: { Keys: keys.slice(i, i + 100).map(key), ConsistentRead: true } };
                  for (let n = 0; n < 6 && req && Object.keys(req).length; n++) {
                    const r = await db.send(new ddb.BatchGetItemCommand({ RequestItems: req }));
                    ((r.Responses || {})[TABLE] || []).forEach(it => { out[it.userId.S] = it.data && it.data.S; });
                    req = r.UnprocessedKeys && r.UnprocessedKeys[TABLE] ? r.UnprocessedKeys : null;
                    if (req) await new Promise(res => setTimeout(res, 100 * (n + 1)));
                  }
                }
                return out;
              },
              async take(k) { const r = await db.send(new ddb.DeleteItemCommand({ TableName: TABLE, Key: key(k), ReturnValues: 'ALL_OLD' })); return r.Attributes && r.Attributes.data ? { data: r.Attributes.data.S, ttl: Number(r.Attributes.ttl && r.Attributes.ttl.N || 0) } : null; },
              async putProgress(sub, data, prevAt) {
                try {
                  await db.send(new ddb.PutItemCommand({ TableName: TABLE, Item: Object.assign(key(sub), { data: { S: data }, updatedAt: { N: String(Date.now()) } }),
                    ConditionExpression: prevAt == null ? 'attribute_not_exists(updatedAt)' : 'updatedAt = :u', ExpressionAttributeValues: prevAt == null ? undefined : { ':u': { N: String(prevAt) } } }));
                  return true;
                } catch (e) { if (e.name === 'ConditionalCheckFailedException') return false; throw e; }
              },
              async login(email, password) {
                const r = await cog.send(new cip.InitiateAuthCommand({ ClientId: CLIENT_ID, AuthFlow: 'USER_PASSWORD_AUTH', AuthParameters: { USERNAME: email, PASSWORD: password } }));
                if (!r.AuthenticationResult) throw Object.assign(new Error('challenge'), { name: r.ChallengeName || 'Challenge' });
                const p = JSON.parse(Buffer.from(r.AuthenticationResult.IdToken.split('.')[1], 'base64url').toString('utf8'));
                return { sub: p.sub, email: p.email, name: p.name || '' };
              },
              async userOk(sub) {
                try {
                  const r = await cog.send(new cip.ListUsersCommand({ UserPoolId: POOL_ID, Filter: 'sub = "' + sub.replace(/"/g, '') + '"', Limit: 1 }));
                  const u = r.Users && r.Users[0]; return !!(u && u.Enabled !== false);
                } catch (e) { return true; }   // never lock people out because the check itself failed
              }
            };
            return deps;
          }

          /* ---------- small helpers ---------- */
          const DAY = 864e5, MIN = 6e4, INT = [10 * MIN, DAY, 3 * DAY, 7 * DAY, 16 * DAY, 35 * DAY], MGAP = [DAY, 3 * DAY, 7 * DAY], DIVS = ['PA', 'PPD', 'PDD'];
          const rnd = () => crypto.randomBytes(32).toString('base64url');
          const sha = s => crypto.createHash('sha256').update(s).digest('base64url');
          const nowS = () => Math.floor(Date.now() / 1000);
          const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
          const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', ndash: '–', mdash: '—', hellip: '…', times: '×', deg: '°', plusmn: '±', le: '≤', ge: '≥', rsquo: '’', lsquo: '‘', rdquo: '”', ldquo: '“', middot: '·', frac12: '½', frac14: '¼', frac34: '¾', sup2: '²', sup3: '³', asymp: '≈', minus: '−', rarr: '→', larr: '←' };
          const decode = s => String(s).replace(/&(#x[0-9a-f]+|#\d+|[a-z0-9]+);/gi, (m, e) => e[0] === '#' ? String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : +e.slice(1)) : (ENT[e.toLowerCase()] != null ? ENT[e.toLowerCase()] : m));
          const strip = h => decode(String(h || '').replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
          const lines = h => decode(String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|li|tr|div|h[1-6]|ul|ol|table|pre|blockquote)>/gi, '\n').replace(/<t[dh]\b[^>]*>/gi, ' | ').replace(/<[^>]+>/g, ''))
            .split('\n').map(l => l.replace(/\s+/g, ' ').replace(/^\s*\|\s*/, '').trim()).filter(Boolean).join('\n');
          const pad = n => String(n).padStart(2, '0');
          const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
          const dsOf = t => dayFmt.format(new Date(t));
          const today = () => dsOf(Date.now());
          const normD = s => { const p = String(s || '').split('-').map(Number); return p.length === 3 && p.every(n => !isNaN(n)) ? p[0] + '-' + pad(p[1]) + '-' + pad(p[2]) : null; };
          const dayNo = s => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / DAY; };
          const daysFrom = (a, b) => Math.round(dayNo(b) - dayNo(a));
