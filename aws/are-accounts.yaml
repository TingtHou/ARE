          const OBJ = (props, req) => ({ type: 'object', properties: props || {}, required: req || [], additionalProperties: false });
          const RO = { readOnlyHint: true, openWorldHint: false }, RW = { readOnlyHint: false, destructiveHint: false, openWorldHint: false };

