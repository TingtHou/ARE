<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARE Study System</title>
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: left rail of study tools + notes; one working column. Same paper/ink/blueprint-blue identity as the Workbench and Card Deck. */
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --surface-2:#FBFAF7;
  --ink:#191A1E; --ink-2:#55575F; --ink-3:#7E808A;
  --rule:#DEDCD4; --rule-2:#EAE8E1;
  --accent:#2C4A6B; --accent-soft:#E7EDF4; --accent-ink:#22405F;
  --flag:#A3312A; --flag-soft:#F7E9E7;
  --ok:#2A6349; --ok-soft:#E4EFE9;
  --warn:#836011; --warn-soft:#F6EEDC;
  --shadow:0 1px 2px rgba(25,26,30,.05),0 6px 20px -12px rgba(25,26,30,.22);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#141519; --surface:#1B1D22; --surface-2:#202329;
  --ink:#E9E7E1; --ink-2:#A8AAB3; --ink-3:#80828B;
  --rule:#33363E; --rule-2:#282B32;
  --accent:#88AECF; --accent-soft:#1E2A38; --accent-ink:#A7C6E0;
  --flag:#E3897E; --flag-soft:#32211F;
  --ok:#74C2A0; --ok-soft:#1B2A24;
  --warn:#D6AC59; --warn-soft:#2B2417;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141519; --surface:#1B1D22; --surface-2:#202329;
  --ink:#E9E7E1; --ink-2:#A8AAB3; --ink-3:#80828B;
  --rule:#33363E; --rule-2:#282B32;
  --accent:#88AECF; --accent-soft:#1E2A38; --accent-ink:#A7C6E0;
  --flag:#E3897E; --flag-soft:#32211F;
  --ok:#74C2A0; --ok-soft:#1B2A24;
  --warn:#D6AC59; --warn-soft:#2B2417;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.ui{font-family:var(--sans)}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.011em}
a{color:var(--accent-ink)}
code,kbd,.mono{font-family:var(--mono);font-size:.88em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#rail{border-right:1px solid var(--rule);background:var(--surface-2);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;padding:22px 14px 40px}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand b{font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:-.02em;display:block}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.navgrp{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 5px}
nav button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-family:var(--sans);font-size:13.5px;font-weight:500;line-height:1.35}
nav button:hover{background:var(--rule-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav button i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);min-width:26px}
nav button[aria-current="true"] i{color:var(--accent-ink)}
#main{min-width:0;padding-block:28px 96px;padding-inline:clamp(16px,3.4vw,44px);max-width:1080px}
.page{display:none}.page.on{display:block}
@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--rule);padding:10px 0 8px;display:flex;gap:10px;align-items:center;overflow-x:auto;overflow-y:hidden}
  .brand{border-bottom:0;padding:0 0 0 16px;margin:0;flex:0 0 auto}
  .brand span{display:none}
  .navgrp{display:none}
  nav{display:flex;gap:4px;padding-right:16px}
  nav button{white-space:nowrap;padding:6px 11px}
  nav button i{display:none}
  #main{padding-block:20px 90px}
}

/* ---------- typography blocks ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
h1.t{font-size:clamp(25px,3.4vw,34px);line-height:1.15;margin-bottom:10px}
.lede{font-size:17px;color:var(--ink-2);max-width:66ch;margin-bottom:26px}
h2.s{font-size:20px;margin:40px 0 4px;padding-top:18px;border-top:1px solid var(--rule)}
h3.s{font-size:16.5px;margin:26px 0 6px}
h4.s{font-size:14px;margin:18px 0 4px;font-family:var(--sans);letter-spacing:0}
p{margin:0 0 12px;max-width:72ch}
ul,ol{margin:0 0 12px;padding-left:20px;max-width:72ch}
li{margin-bottom:5px}
li>ul,li>ol{margin-top:5px}
strong{font-weight:600}
.small{font-size:14px}
hr{border:0;border-top:1px solid var(--rule);margin:26px 0}

/* ---------- chips / tags ---------- */
.obj{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent-ink);vertical-align:2px;margin-right:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid transparent;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.c-rot{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.c-un{background:var(--flag-soft);color:var(--flag);border-color:var(--flag)}
.c-out{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--rule-2);color:var(--ink-2)}
.pa{background:#DCE7F0;color:#1F4A72}.ppd{background:#E5E2F2;color:#40397A}.pdd{background:#E2EEE7;color:#1F5740}
:root[data-theme="dark"] .pa,:root:not([data-theme="light"]) .pa{background:#1D2C3B;color:#9DC2E0}
:root[data-theme="dark"] .ppd,:root:not([data-theme="light"]) .ppd{background:#26243C;color:#B3ADE0}
:root[data-theme="dark"] .pdd,:root:not([data-theme="light"]) .pdd{background:#1B2E26;color:#8ECFB0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pa{background:#1D2C3B;color:#9DC2E0}:root:not([data-theme="light"]) .ppd{background:#26243C;color:#B3ADE0}:root:not([data-theme="light"]) .pdd{background:#1B2E26;color:#8ECFB0}}

/* ---------- redline / callout ---------- */
.rl{border-left:3px solid var(--flag);background:var(--flag-soft);padding:12px 14px;margin:14px 0;border-radius:0 5px 5px 0;max-width:74ch}
.rl .hd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--flag);font-weight:600;margin-bottom:5px}
.rl p:last-child,.rl ul:last-child{margin-bottom:0}
.out{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;margin:14px 0;border-radius:0 5px 5px 0;max-width:74ch}
.out .hd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:5px}
.out p:last-child,.out ul:last-child{margin-bottom:0}
.trap{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 14px;margin:14px 0;border-radius:0 5px 5px 0;max-width:74ch}
.trap .hd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:600;margin-bottom:5px}
.trap p:last-child,.trap ul:last-child{margin-bottom:0}
.hook{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:11px 14px;margin:14px 0;max-width:74ch;font-family:var(--sans);font-size:14px}
.hook b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px;font-weight:600}
.wx{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:16px 0;box-shadow:var(--shadow)}
.wx .hd{font-family:var(--sans);font-size:13px;font-weight:700;margin-bottom:8px}
.wx .step{font-family:var(--mono);font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-x:auto;color:var(--ink)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{font-family:var(--mono);white-space:nowrap}
caption{caption-side:top;text-align:left;padding:9px 11px;font-family:var(--sans);font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule)}

/* ---------- cards / weights ---------- */
.grid{display:grid;gap:12px;margin:16px 0}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:14px 16px}
.card h4{font-family:var(--sans);font-size:13px;font-weight:700;margin:0 0 7px}
.card .big{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.card .sub{font-size:12.5px;color:var(--ink-2);font-family:var(--sans)}
.wt{margin:6px 0 2px}
.wt .row{display:grid;grid-template-columns:minmax(130px,1.5fr) 1fr 62px;gap:10px;align-items:center;padding:5px 0;font-family:var(--sans);font-size:13px}
.wt .bar{height:9px;border-radius:2px;background:var(--rule-2);overflow:hidden}
.wt .bar span{display:block;height:100%;background:var(--accent);border-radius:2px}
.wt .bar.hi span{background:var(--flag)}
.wt .num{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right}
@media (max-width:520px){.wt .row{grid-template-columns:1fr 54px;grid-template-areas:"l n" "b b"}.wt .row>:nth-child(1){grid-area:l}.wt .row>:nth-child(2){grid-area:b}.wt .row>:nth-child(3){grid-area:n}}

/* ---------- drill ---------- */
.deckbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.deckbar button{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer}
.deckbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
:root[data-theme="dark"] .deckbar button[aria-pressed="true"],:root:not([data-theme="light"]) .deckbar button[aria-pressed="true"]{color:#141519}
.fc{background:var(--surface);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);padding:26px 22px;min-height:210px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;margin-bottom:12px}
.fc .q{font-size:19px;font-family:var(--sans);font-weight:600;line-height:1.35;text-wrap:balance}
.fc .a{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:15.5px}
.fc .a ul{font-size:15px}
.fc .meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px;display:flex;gap:10px;flex-wrap:wrap}
.rate{display:flex;gap:7px;flex-wrap:wrap}
.rate button{flex:1 1 auto;min-width:88px;font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;color:var(--ink)}
.rate button[data-r="1"]:hover{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.rate button[data-r="2"]:hover{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rate button[data-r="3"]:hover{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qz{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:20px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.qz .stem{font-family:var(--sans);font-size:15.5px;font-weight:600;line-height:1.45;margin-bottom:12px}
.qz .opt{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:14px;padding:9px 12px;margin-bottom:6px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);cursor:pointer;color:var(--ink);line-height:1.4}
.qz .opt:hover{border-color:var(--accent)}
.qz .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.qz .opt.wrong{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.qz .exp{margin-top:10px;padding-top:11px;border-top:1px solid var(--rule);font-size:14.5px}
.progress{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-bottom:10px}

/* ---------- plan ---------- */
.wk{background:var(--surface);border:1px solid var(--rule);border-radius:7px;margin-bottom:12px;overflow:hidden}
.wk>.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.wk>.hd b{font-family:var(--sans);font-size:14px;font-weight:700}
.wk>.hd .d{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.wk>.hd .g{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);flex:1 1 100%}
.tasks{padding:8px 15px 12px}
.tk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-family:var(--sans);font-size:13.5px;line-height:1.45}
.tk input{margin:3px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:0 0 auto}
.tk label{cursor:pointer}
.tk.done label{color:var(--ink-3);text-decoration:line-through}
.tk.exam label{font-weight:700;color:var(--flag)}
.sticky-note{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding:9px 0;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
details{border:1px solid var(--rule);border-radius:6px;padding:10px 14px;margin:12px 0;background:var(--surface)}
details summary{cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600}
details[open] summary{margin-bottom:8px}
.savebar{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding:6px 0}

/* ---------- study-system additions ---------- */
html,body{min-height:100%}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;gap:10px;align-items:center;padding:10px 0;margin:-28px 0 18px;background:var(--paper);border-bottom:1px solid var(--rule)}
.srch{flex:1 1 auto;min-width:0;position:relative}
.srch input{width:100%;font-family:var(--sans);font-size:14px;padding:9px 12px 9px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.srch input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.sync{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sync b{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--ink-3);margin-right:6px;vertical-align:1px}
.sync.on b{background:var(--ok)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:min(70vh,560px);overflow-y:auto;padding:6px;z-index:30}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--accent-soft)}
.res .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.res .t{font-family:var(--sans);font-size:13.5px;font-weight:600;display:block}
.res .x{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.resnone{padding:12px;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
@media (max-width:860px){.topbar{position:static;margin-top:-20px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.sm{font-size:12.5px;padding:6px 10px;min-height:32px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
select.sel{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* today */
.exams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:18px 0 8px}
.exam{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.exam.next{border-color:var(--accent);box-shadow:var(--shadow)}
.exam .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exd{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.exdate{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:-3px -6px -3px 0;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.exdate:hover,.exdate:focus-visible{border-color:var(--rule);background:var(--surface-2);color:var(--ink)}
.exdate em{font-style:normal;color:var(--accent-ink);font-weight:600}
.exdate svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.exdate:hover svg{opacity:1}
.exin{font-family:var(--sans);font-size:14px;padding:5px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:600px){.exin{font-size:16px}}
.exam .days{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.exam .days small{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:0;margin-left:4px}
.exam .dt{font-family:var(--sans);font-size:12.5px;color:var(--ink-2)}
.meter2{height:6px;border-radius:99px;background:var(--rule-2);overflow:hidden;display:flex}
.meter2 i{display:block;height:100%}
.meter2 .g{background:var(--ok)}.meter2 .s{background:var(--warn)}.meter2 .a{background:var(--flag)}
.exam .rd{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.exam .pass{font-family:var(--sans);font-size:12px;display:flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer}
.exam .pass input{accent-color:var(--ok)}
.exam.done .days{color:var(--ok)}
.panels{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:16px 18px;min-width:0}
.panel h3{font-size:15px;margin:0 0 4px}
.panel .sub{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--rule-2);border-radius:7px;padding:8px 10px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--sans);font-size:11.5px;color:var(--ink-2)}
.divbars{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.divbar{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;font-family:var(--sans);font-size:12.5px}
.divbar .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.weak{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;max-width:none}
.weak li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule-2);margin:0;font-family:var(--sans);font-size:13px}
.weak li:last-child{border-bottom:0}
.weak .why{flex:1 1 auto;min-width:0;color:var(--ink-2);font-size:12px}
.weak .why b{color:var(--ink);font-weight:600;display:block;font-size:13px}
.weak li .obj{flex:0 0 auto;white-space:nowrap;margin-right:0;min-width:64px;text-align:center}
.weak li .lnk{flex:0 0 auto;white-space:nowrap}
.weak li .why{overflow-wrap:normal;word-break:normal}
.panel .weak li{overflow-wrap:normal}
.lnk{background:none;border:0;padding:0;color:var(--accent-ink);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.heat{display:flex;gap:4px;margin-top:6px}
.heat i{flex:1 1 0;height:22px;border-radius:3px;background:var(--rule-2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--rule-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--rule-2))}
.heat i.l3{background:var(--accent)}
.heat i.t{outline:2px solid var(--ink-3);outline-offset:1px}
.heatlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:4px}
.empty{font-family:var(--sans);font-size:13px;color:var(--ink-2);padding:6px 0}

/* flashcards */
.fcwrap{max-width:760px}
.fcbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.fcbar .sel{flex:1 1 240px}
.flash{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:24px 24px 18px;min-height:280px;display:flex;flex-direction:column;cursor:pointer}
.flash .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.flash .tags .st{margin-left:auto;padding:2px 8px;border-radius:99px;border:1px solid var(--rule);font-weight:600}
.st.b0{color:var(--flag);border-color:var(--flag)}.st.b1{color:var(--warn);border-color:var(--warn)}.st.b2{color:var(--accent-ink);border-color:var(--accent)}.st.b3{color:var(--ok);border-color:var(--ok)}
.flash .q{font-family:var(--sans);font-weight:600;font-size:clamp(19px,2.4vw,24px);line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.flash .a{margin-top:16px;padding-top:15px;border-top:1px solid var(--rule);font-size:16px}
.flash .a p{margin:0 0 10px}.flash .a p:last-child{margin-bottom:0}
.flash .hint{margin-top:auto;padding-top:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.rate3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate3 button{min-height:58px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rate3 button small{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.rate3 .r1{color:var(--flag)}.rate3 .r1:hover{background:var(--flag-soft);border-color:var(--flag)}
.rate3 .r2{color:var(--warn)}.rate3 .r2:hover{background:var(--warn-soft);border-color:var(--warn)}
.rate3 .r3{color:var(--ok)}.rate3 .r3:hover{background:var(--ok-soft);border-color:var(--ok)}
.revealbtn{width:100%;min-height:56px;margin-top:12px;border-radius:12px;border:0;background:var(--accent);color:var(--paper);font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer}
.fcstat{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.donebox{text-align:center;padding:30px 20px;background:var(--surface);border:1px solid var(--rule);border-radius:14px}
.donebox .big{font-family:var(--mono);font-size:40px;font-weight:600}
.donebox p{margin:6px auto 16px;color:var(--ink-2);max-width:44ch}
.donebox .row{justify-content:center}

/* practice */
.qzctl{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:9px}
.qz .meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qz .opt.on{border-color:var(--accent);background:var(--accent-soft)}
.qz .opt:disabled{cursor:default}
.qz .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.qz.flashme{outline:2px solid var(--accent);outline-offset:3px}
.timer{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--flag)}
.runbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);font-family:var(--mono);font-size:11px;cursor:pointer;padding:0}
.dots button.ans{background:var(--accent-soft);border-color:var(--accent)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.no{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.score b{font-family:var(--mono);font-size:36px}

/* plan */
.wk.now{border-color:var(--accent);box-shadow:var(--shadow)}
.wk.now>.hd{background:var(--accent-soft)}
.wk.past{opacity:.82}
.nowtag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--paper);padding:2px 7px;border-radius:3px}

/* notes */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 8px}
.toc button{font-family:var(--sans);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer}
.toc button:hover{border-color:var(--accent);color:var(--accent-ink)}
.hl{animation:hl 2.2s ease-out}
@keyframes hl{0%{background:var(--warn-soft);box-shadow:0 0 0 6px var(--warn-soft)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.obj.go{cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* mistakes */
.mkgrp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;display:flex;gap:8px;align-items:center}
.mk{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--flag);border-radius:8px;padding:14px 16px;margin-bottom:10px;min-width:0}
.mk.later{border-left-color:var(--warn)}
.mk.fixed{border-left-color:var(--ok);opacity:.85}
.mk .meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.mk .stem{font-family:var(--sans);font-size:14.5px;font-weight:600;line-height:1.4;margin-bottom:8px}
.mk .pick{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-family:var(--sans);font-size:13px;margin-bottom:8px}
.mk .pick dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.mk .pick dd{margin:0}
.mk .pick .no{color:var(--flag)}.mk .pick .yes{color:var(--ok)}
.mk .steps{display:inline-flex;gap:3px;vertical-align:middle}
.mk .steps i{width:18px;height:6px;border-radius:2px;background:var(--rule)}
.mk .steps i.on{background:var(--ok)}
.mk textarea{width:100%;min-height:52px;font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--surface-2);color:var(--ink);resize:vertical}
.mk details{margin:8px 0;padding:8px 12px}
.mk .foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.learned{margin-top:8px;padding:9px 12px;border-radius:7px;background:var(--warn-soft);border:1px solid var(--warn);font-family:var(--sans);font-size:12.5px;color:var(--ink)}
.learned.good{background:var(--ok-soft);border-color:var(--ok)}
.leech{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule-2);font-family:var(--sans);font-size:13.5px}
.leech .c{font-family:var(--mono);font-size:12px;color:var(--flag);min-width:34px}
.leech .t{flex:1 1 auto;min-width:0}

/* ---------- profiles ---------- */
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:99px;background:var(--accent);color:var(--paper);font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;flex:0 0 auto}
.profbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--rule);border-radius:99px;background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);max-width:180px}
.profbtn:hover{border-color:var(--accent)}
.profbtn .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.prow{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--surface-2)}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.prow .pick{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;cursor:pointer;text-align:left;font-family:var(--sans)}
.prow .pick b{display:block;font-size:14px}
.prow .pick small{display:block;font-size:11.5px;color:var(--ink-2)}
.prow .av{width:34px;height:34px;font-size:13px}
.padd{display:flex;gap:8px;margin-bottom:6px}
.padd input{flex:1 1 auto;min-width:0;font-family:var(--sans);font-size:14px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.pio{margin-top:8px}
.pio textarea{width:100%;font-family:var(--mono);font-size:11px;padding:8px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink);margin:8px 0}
@media (max-width:600px){.profbtn{padding:3px}.profbtn .pn{display:none}.padd input,.pio textarea{font-size:16px}}

/* ---------- sign-in ---------- */
#authView{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--paper)}
.authbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:26px 26px 22px}
.abrand{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.abrand b{font-family:var(--sans);font-size:15px;font-weight:700}
.abrand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
#authBody h1{font-family:var(--sans);font-size:22px;margin:0 0 4px}
.asub{font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.af{display:block;margin-bottom:12px}
.af span{display:block;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.af input{width:100%;font-family:var(--sans);font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.af input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);background:var(--surface)}
.ahint{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin:-4px 0 12px}
.abtn{width:100%;min-height:46px;margin-top:4px;font-size:15px}
.aerr{margin:0 0 12px;padding:9px 12px;border-radius:7px;background:var(--flag-soft);border:1px solid var(--flag);color:var(--flag);font-family:var(--sans);font-size:13px}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
#authBody .learned{margin:0 0 12px}

/* ---------- sidebar: hide/show and the activity calendar ---------- */

#rail .brand{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.railbtn{flex:0 0 auto;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;padding:0}
.railbtn:hover{border-color:var(--accent);color:var(--ink)}
.railbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#railShow{display:none}
.railheat{margin:18px 8px 0;padding-top:14px;border-top:1px solid var(--rule)}
.railheat h4{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.rhgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rhgrid i{aspect-ratio:1;border-radius:3px;background:var(--rule-2);display:block;max-width:100%}
.rhgrid i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--rule-2))}
.rhgrid i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--rule-2))}
.rhgrid i.l3{background:var(--accent)}
.rhgrid i.t{outline:2px solid var(--ink-3);outline-offset:1px}
.rhdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:center;margin-bottom:4px}
.rhsum{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-top:9px;line-height:1.45}
.rhsum b{color:var(--ink);font-weight:600}
@media (min-width:861px){
  #rail{display:flex;flex-direction:column}
  body.railoff #shell{grid-template-columns:minmax(0,1fr)!important}
  body.railoff #rail{display:none}
  body.railoff #railShow{display:inline-grid}
  body:not(.railoff) #view .heatpanel{display:none}   /* shown in the sidebar instead */
}
@media (max-width:860px){
  #railHide,.railheat{display:none}
}
/* ---------- preview banner (develop site) ---------- */
.previewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:9px 12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:9px;font-family:var(--sans);font-size:13px}
.previewbar .pvtag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px}
.previewbar .pvtxt{flex:1 1 280px;min-width:0;color:var(--ink)}
.pvlist{list-style:none;padding:0;margin:10px 0 14px;max-height:260px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px}
.pvlist li{padding:7px 10px;border-bottom:1px solid var(--rule-2);font-family:var(--sans);font-size:13px;margin:0}
.pvlist li:last-child{border-bottom:0}
.pvlist code{font-family:var(--mono);font-size:11px;color:var(--accent-ink);margin-right:6px}
.pvlist span{color:var(--ink-3);font-size:11.5px;margin-left:6px}

/* ---------- personal material ---------- */
.edf{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.edrow{display:flex;gap:10px;flex-wrap:wrap}
.edf textarea,.edf select.sel{width:100%;font-family:var(--sans);font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}
.edf textarea:focus,.edf select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);background:var(--surface)}
.edf .ahint code{font-family:var(--mono);font-size:11px;background:var(--rule-2);padding:0 4px;border-radius:3px}
.edf #edActs{margin-top:10px}
#modal:has(.edf){width:min(720px,calc(100vw - 32px))}
.mypt{margin:10px 0 14px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--rule));border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;max-width:74ch;font-size:15px}
.mypt p:last-child,.mypt ul:last-child,.mypt ol:last-child{margin-bottom:0}
.myhd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.myk{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.myhd .lnk{margin-left:auto;font-size:12px}
.mybox{margin:4px 0 22px;padding:12px 14px;border:1px dashed var(--rule);border-radius:9px;max-width:80ch;font-family:var(--sans);font-size:14px}
.mybox .mypt{font-family:var(--serif)}
.addpt{margin-left:8px;vertical-align:2px;font-family:var(--sans);font-size:11px;font-weight:600;padding:1px 7px;border:1px dashed var(--rule);border-radius:99px;background:none;color:var(--ink-3);cursor:pointer;opacity:0;transition:opacity .15s}
h3:hover .addpt,.addpt:focus-visible{opacity:1}
@media (hover:none){.addpt{opacity:1}}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-family:var(--sans);font-size:13.5px;max-width:980px}
.mrow .obj{flex:0 0 auto;min-width:64px;text-align:center}
.mrow .mt{flex:1 1 auto;min-width:0}
.mrow .mb{flex:0 0 auto;display:flex;gap:12px}
.fcedit{margin-left:8px;font-size:11px;letter-spacing:0;text-transform:none}

.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.mtools .small{color:var(--ink-2);flex:1 1 240px}
.imsrc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
#modal textarea#imText,#modal textarea#apText,#modal textarea#exText{width:100%;font-family:var(--mono);font-size:12px;line-height:1.45;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const view=$('#view'), nav=$('#nav');
const DAY=864e5, MIN=6e4;

const PAGES=[
 {id:'today',g:'Study',n:'Today',i:'NOW'},
 {id:'cards',g:'Study',n:'Flashcards',i:'SRS'},
 {id:'practice',g:'Study',n:'Practice',i:'Q'},
 {id:'mistakes',g:'Study',n:'Mistakes',i:'ERR'},
 {id:'plan',g:'Study',n:'Study plan',i:'14w'},
 {id:'overview',g:'Notes',n:'Overview',i:'00'},
 {id:'objectives',g:'Notes',n:'Objective map',i:'01'},
 {id:'pa',g:'Notes',n:'Programming & Analysis',i:'PA'},
 {id:'ppd',g:'Notes',n:'Planning & Design',i:'PPD'},
 {id:'pdd',g:'Notes',n:'Development & Docs',i:'PDD'},
 {id:'numbers',g:'Notes',n:'Numbers',i:'#'},
 {id:'mine',g:'Notes',n:'My material',i:'+'}
];
const NOTE_PAGES=['overview','objectives','pa','ppd','pdd','numbers'];
const DIVS=['PA','PPD','PDD'];

/* ---------- material, loaded from material/*.js ---------- */
const A=window.ARE||{};
const pdate=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);};
const fmtDate=(d,o)=>d.toLocaleDateString(undefined,o||{weekday:'short',day:'numeric',month:'short'});
const BASE_CARDS=(A.cards||[]).filter(c=>c&&c.id!=null&&c.q&&c.a).map(c=>Object.assign({},c,{id:String(c.id),d:c.d||'Other',o:c.o||'—'}));
const BASE_ITEMS=(A.questions||[]).filter(q=>q&&q.id!=null&&q.s&&Array.isArray(q.opts)&&Array.isArray(q.c)).map(q=>Object.assign({},q,{id:String(q.id),t:q.t==='cata'?'cata':'mc',e:q.e||''}));
const BASE_PLAN=(A.plan||[]).slice().sort((a,b)=>a.w-b.w);
let PLAN=BASE_PLAN;   // replaced by the person's own plan (S.customPlan) when they have one
const WEIGHTS=A.weights||{};
const EXAMS=(A.exams||[]).map(e=>{const dt=pdate(e.date);return {d:e.d,n:e.name||e.d,date:dt,items:e.items||'',label:fmtDate(dt)};});
let CARDS=BASE_CARDS, ITEMS=BASE_ITEMS, ITEM_MAP={}, DECKS=[];
const ITEM=id=>ITEM_MAP[id];
const PW=w=>PLAN.find(x=>x.w===w);
/* problems in the material files, shown on Today so edits are easy to check */
const MATERR=(()=>{
  const out=[], seen=(list,file)=>{const s={};list.forEach(x=>{if(s[x.id])out.push(file+': id \''+x.id+'\' is used twice');s[x.id]=1;});};
  if(!A.cards)out.push('material/cards.js did not load — flashcards are missing');
  if(!A.questions)out.push('material/questions.js did not load — practice questions are missing');
  if(!A.plan)out.push('material/plan.js did not load — plan and exam dates are missing');
  seen(BASE_CARDS,'cards.js'); seen(BASE_ITEMS,'questions.js');
  (A.cards||[]).forEach((c,i)=>{if(!c||c.id==null||!c.q||!c.a)out.push('cards.js: card #'+(i+1)+' is missing id, q or a and was skipped');});
  (A.questions||[]).forEach((q,i)=>{if(!q||q.id==null||!q.s||!Array.isArray(q.opts)||!Array.isArray(q.c))out.push('questions.js: question #'+(i+1)+' is missing id, s, opts or c and was skipped');});
  BASE_ITEMS.forEach(q=>{if(q.c.some(k=>k<0||k>=q.opts.length))out.push('questions.js: '+q.id+' has a correct answer number outside its options (count from 0)');
    if(q.t==='mc'&&q.c.length!==1)out.push('questions.js: '+q.id+' is multiple choice but lists '+q.c.length+' correct answers — use t:\'cata\' or one answer');
    if(!DIVS.includes(q.d))out.push('questions.js: '+q.id+' has division \''+q.d+'\' — use PA, PPD or PDD');});
  EXAMS.forEach(e=>{if(isNaN(e.date))out.push('plan.js: exam '+e.d+' has an unreadable date — use YYYY-MM-DD');});
  BASE_PLAN.forEach(w=>{if(isNaN(pdate(w.from))||isNaN(pdate(w.to)))out.push('plan.js: week '+w.w+' needs from/to dates as YYYY-MM-DD');});
  return out;
})();
const INT=[10*MIN,1*DAY,3*DAY,7*DAY,16*DAY,35*DAY]; // box → next interval
const BOXNAME=['learning','shaky','review','strong','strong','mastered'];

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const ckey=c=>c.id;
const odiv=o=>{const p=(o||'').split(' ')[0];return DIVS.includes(p)?p:null;};
const cdiv=c=>odiv(c.o)||(c.d.split(' ')[0]);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* DECKS is rebuilt with the material in rebuildMaterial() */
/* ---------- personal material: each person's own edits layered over the shared base ----------
   S.custom = { cards:{id:{d,o,q,a,qraw,araw}|{hidden:true}}, items:{id:{d,o,t,s,opts,c,e,sraw,eraw}|{hidden:true}}, points:{id:{div,obj,text,at}} }
   An entry with a base id overrides or hides that item; new entries use "u…" ids. */
let CUSTERR=[];
const newUid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function rebuildMaterial(){
  const C=(S&&S.custom)||{}, cc=C.cards||{}, ci=C.items||{};
  const CK=['d','o','q','a','qraw','araw'], IK=['d','o','t','s','opts','c','e','sraw','eraw'];
  const pickk=(o,ks)=>{const r={};ks.forEach(k=>{if(o[k]!=null)r[k]=o[k];});return r;};
  CARDS=[]; BASE_CARDS.forEach(c=>{const o=cc[c.id];if(o&&o.hidden)return;CARDS.push(o?Object.assign({},c,pickk(o,CK),{edited:true}):c);});
  Object.keys(cc).filter(k=>!BASE_CARDS.some(b=>b.id===k)&&!cc[k].hidden&&cc[k].q&&cc[k].a).forEach(k=>CARDS.push(Object.assign({o:'—',d:'My cards'},pickk(cc[k],CK),{id:k,mine:true})));
  ITEMS=[]; BASE_ITEMS.forEach(q=>{const o=ci[q.id];if(o&&o.hidden)return;ITEMS.push(o?Object.assign({},q,pickk(o,IK),{edited:true}):q);});

/* Last 28 days in the sidebar: a 4-week calendar, Monday first, today outlined */
function paintRailHeat(){
  const el=$('#railHeat'); if(!el)return;
  const t=midnight(new Date()), key=d=>ds(d), n=d=>S.log[key(d)]||0;
  // grid ends on this week's Sunday so columns are weekdays; days after today stay blank
  const endSun=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(6-(t.getDay()+6)%7));
  const first=new Date(endSun.getFullYear(),endSun.getMonth(),endSun.getDate()-27);

/* ================= ACCOUNTS (Amazon Cognito + progress API) =================
   On when config.js holds all four values and the page is not inside claude.ai
   (claude.ai has its own sign-in and sync). */
const AC=window.ARE_AUTH||{};
const AUTH_ON=!!(AC.region&&AC.userPoolId&&AC.clientId&&AC.apiUrl)&&!(window.claude&&window.claude.use);
const LSA='are_auth_v1';
let SESSION=null;
function jwtClaims(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return {};}}
const COGMSG={NotAuthorizedException:'Email or password is wrong.',UserNotFoundException:'Email or password is wrong.',UserNotConfirmedException:'Confirm your email first. Enter the code we sent you.',UsernameExistsException:'An account with this email already exists. Sign in instead.',CodeMismatchException:'That code is not right. Check the most recent email.',ExpiredCodeException:'That code has expired. Send a new one.',InvalidPasswordException:'Use at least 8 characters, including a lowercase letter and a number.',LimitExceededException:'Too many attempts. Wait a few minutes, then try again.',TooManyRequestsException:'Too many attempts. Wait a few minutes, then try again.',CodeDeliveryFailureException:'The email could not be sent. Check the address and try again.'};
async function cog(action,body){
  let r;
  try{r=await fetch('https://cognito-idp.'+AC.region+'.amazonaws.com/',{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+action},body:JSON.stringify(body)});}
  catch(e){const x=new Error('No connection. Check your internet and try again.');x.code='Network';throw x;}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const t=(j.__type||'').split('#').pop();const x=new Error(COGMSG[t]||(t==='InvalidParameterException'&&j.message)||'Something went wrong. Try again.');x.code=t;throw x;}
  return j;
}
function setSession(res,email){
  const c=jwtClaims(res.IdToken);
  SESSION={id:res.IdToken,refresh:res.RefreshToken||(SESSION&&SESSION.refresh),exp:Date.now()+(res.ExpiresIn||3600)*1000-120000,sub:c.sub,email:c.email||email||'',name:c.name||'',groups:[].concat(c['cognito:groups']||[])};
  try{localStorage.setItem(LSA,JSON.stringify({refresh:SESSION.refresh,email:SESSION.email,sub:SESSION.sub,name:SESSION.name}));}catch(e){}
}
function storedAuth(){try{return JSON.parse(localStorage.getItem(LSA)||'null');}catch(e){return null;}}
/* returns true, false (must sign in again) or 'offline' */
async function refreshSession(){
  const st=storedAuth(), rt=(SESSION&&SESSION.refresh)||(st&&st.refresh);
  if(!rt)return false;
  try{const j=await cog('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:AC.clientId,AuthParameters:{REFRESH_TOKEN:rt}});
    j.AuthenticationResult.RefreshToken=rt; setSession(j.AuthenticationResult,st&&st.email); return true;}
  catch(e){return e.code==='Network'?'offline':false;}
}
async function resumeSession(){
  const st=storedAuth(); if(!st||!st.refresh)return false;
  const r=await refreshSession();
  if(r===true)return true;
  if(r==='offline'&&st.sub){SESSION={refresh:st.refresh,sub:st.sub,email:st.email,name:st.name,exp:0,offline:true};return true;}
  try{localStorage.removeItem(LSA);}catch(e){}
  return false;
}
async function idToken(){
  if(!SESSION)return null;
  if(SESSION.offline||Date.now()>SESSION.exp){const r=await refreshSession();if(r!==true)return null;}
  return SESSION.id;
}
async function api(method,body){
  const t=await idToken(); if(!t)throw noteSyncErr(method,-1,'could not refresh the sign-in');
  let r;try{r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/progress',{method,headers:Object.assign({Authorization:'Bearer '+t},body?{'Content-Type':'application/json'}:{}),body});}catch(e){throw noteSyncErr(method,0,String(e&&e.message||e));}
  if(!r.ok){const txt=await r.text().catch(()=>'');throw noteSyncErr(method,r.status,txt);}
  return r.status===204?null:r.json();
}

/* sign-in screens: signin · signup · confirm · forgot · reset */
let authMem={};
function showAuth(mode,o){
  o=o||{}; $('#shell').hidden=true; $('#authView').hidden=false;
  const f=(id,label,type,extra)=>'<label class="af" for="'+id+'"><span>'+label+'</span><input id="'+id+'" type="'+type+'" '+(extra||'')+'></label>';
  const E=esc(authMem.email||'');
  const V={
    signin:['Sign in','Pick up where you left off, on any device.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"')+f('aPass','Password','password','autocomplete="current-password" required'),'Sign in','<button type="button" class="lnk" data-m="signup">Create an account</button><button type="button" class="lnk" data-m="forgot">Forgot password?</button>'],
    signup:['Create your account','Your flashcards, answers, mistakes and plan follow you to every device.',f('aName','Your name','text','autocomplete="name" maxlength="40" required')+f('aEmail','Email','email','autocomplete="email" required value="'+E+'"')+f('aPass','Password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Create account','<button type="button" class="lnk" data-m="signin">I already have an account</button>'],
    confirm:['Check your email','We sent a 6-digit code to '+E+'. Enter it to confirm your account.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required'),'Confirm','<button type="button" class="lnk" data-m="resend">Send a new code</button><button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    forgot:['Reset your password','Enter your email and we will send you a code.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"'),'Send code','<button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    reset:['Choose a new password','Enter the code we emailed to '+E+' and your new password.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required')+f('aPass','New password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Set password','<button type="button" class="lnk" data-m="signin">Back to sign in</button>']
  }[mode];
  $('#authBody').innerHTML='<h1>'+V[0]+'</h1><p class="asub">'+V[1]+'</p>'+(o.msg?'<div class="learned good">'+esc(o.msg)+'</div>':'')+'<div class="aerr" id="aErr" role="alert" hidden></div>'+
    '<form id="aForm" novalidate>'+V[2]+'<button type="submit" class="btn pri abtn" id="aGo">'+V[3]+'</button></form><div class="alinks">'+V[4]+'</div>';
  const first=$('#authBody input:not([value]),#authBody input[value=""]')||$('#authBody input'); if(first)first.focus();
  $('#authBody').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;
    if(b.dataset.m==='resend'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});showAuth('confirm',{msg:'A new code is on its way.'});}catch(x){authErr(x.message);}return;}
    showAuth(b.dataset.m);};
  $('#aForm').onsubmit=async e=>{
    e.preventDefault();
    const v=id=>{const el=$('#'+id);return el?el.value.trim():'';}, go1=$('#aGo');
    const need=$$('#aForm input').find(i=>!i.value.trim()); if(need){authErr('Fill in '+need.closest('label').querySelector('span').textContent.toLowerCase()+'.');need.focus();return;}
    go1.disabled=true; const label=go1.textContent; go1.textContent='Please wait…';
    try{
      if(mode==='signin'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;await doSignIn();return;}
      if(mode==='signup'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;
        await cog('SignUp',{ClientId:AC.clientId,Username:authMem.email,Password:authMem.pass,UserAttributes:[{Name:'email',Value:authMem.email},{Name:'name',Value:v('aName')}]});
        showAuth('confirm');return;}
      if(mode==='confirm'){await cog('ConfirmSignUp',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode')});
        if(authMem.pass){await doSignIn();}else showAuth('signin',{msg:'Email confirmed. Sign in to continue.'});return;}
      if(mode==='forgot'){authMem.email=v('aEmail');await cog('ForgotPassword',{ClientId:AC.clientId,Username:authMem.email});showAuth('reset');return;}
      if(mode==='reset'){authMem.pass=$('#aPass').value;await cog('ConfirmForgotPassword',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode'),Password:authMem.pass});await doSignIn();return;}
    }catch(x){
      if(x.code==='UserNotConfirmedException'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});}catch(_){}showAuth('confirm',{msg:'Your email is not confirmed yet. We sent a new code.'});return;}
      authErr(x.message); go1.disabled=false; go1.textContent=label;
    }
  };
}
function authErr(t){const el=$('#aErr');if(!el)return;el.textContent=t;el.hidden=false;}
async function doSignIn(){
  const j=await cog('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:AC.clientId,AuthParameters:{USERNAME:authMem.email,PASSWORD:authMem.pass}});
  if(!j.AuthenticationResult){const x=new Error('This account needs a step the site does not support yet ('+(j.ChallengeName||'unknown')+').');throw x;}
  setSession(j.AuthenticationResult,authMem.email); authMem.pass=''; enterApp();
}

/* ================= STUDY PACKS: import / export many points, cards and questions at once =================
   One JSON object (the format AI tools write most reliably):
   { "format":"are-study-pack", "version":1, "title":"…",
     "points":[{"division":"PA","objective":"4.3","text":"…"}],
     "cards":[{"deck":"…","division":"PPD","objective":"2.2","question":"…","answer":"…"}],
     "questions":[{"division":"PDD","objective":"3.2","type":"mc","question":"…","options":["…","…"],"correct":["…"],"explanation":"…"}] } */
const PACK_EXAMPLE={format:'are-study-pack',version:1,title:'PPD egress — my notes',
  points:[{division:'PPD',objective:'2.2',text:'Occupant load: **business = 150 SF gross** in the 2021 IBC (it was 100 in 2018).\n\n- round occupant load UP\n- check both the capacity and the 44 in minimum'}],
  cards:[{deck:'PPD · My egress cards',division:'PPD',objective:'2.2',question:'Minimum number of exits for 620 occupants on one storey',answer:'**3 exits.** 1–500 → 2 · 501–1,000 → 3 · over 1,000 → 4.'}],
  questions:[{division:'PPD',objective:'2.2',type:'mc',question:'A sprinklered Group B floor has an occupant load of 180. Which governs the stair width?',
    options:['180 × 0.2 in = 36 in','180 × 0.3 in = 54 in','The 44 in minimum stair width','The 36 in minimum for fewer than 50 occupants'],
    correct:['The 44 in minimum stair width'],explanation:'180 × 0.2 = 36 in is below the 44 in minimum for 50 or more occupants, so the minimum governs. 0.3 in applies only without sprinklers plus voice/alarm.'}]};
function aiPackPrompt(){
  return 'Turn my study notes into an ARE study pack for the ARE Study System.\n\n'+
  'Reply with ONE JSON object and nothing else, in exactly this shape:\n\n'+JSON.stringify(PACK_EXAMPLE,null,2)+'\n\n'+
  'Rules:\n'+
  '- "division" is "PA", "PPD" or "PDD" ("General" is allowed for points).\n'+
  '- "objective" is the NCARB objective number such as "2.2", or "" if none fits.\n'+
  '- "points": short study notes worth rereading. "text" may use "- " bullets, "1. " steps, **bold**, and blank lines between paragraphs.\n'+
  '- "cards": flashcards. "question" is a prompt; "answer" is what to recall, complete lists where the exam tests lists.\n'+
  '- "questions": exam-style items. "type" is "mc" (exactly one correct option) or "cata" (check all that apply, 2+ correct). Give 4 options for mc and 5–6 for cata. "correct" lists the exact text of each correct option. "explanation" says why the answer is right and why each trap is wrong.\n'+
  '- Only use facts that are in my notes or that you are confident are current (2021 IBC, 2010 ADA Standards, ARE 5.0). Do not invent code section numbers.\n'+
  '- Leave out any list you have nothing for.\n\n'+
  'My notes:\n\n[paste your notes here]';
}
/* read a pack from text: tolerant of code fences and text around the JSON */
function parsePack(text){
  let t=String(text||'').replace(/^﻿/,'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence)t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('No study pack found. The file should contain one JSON object that starts with { and ends with }.');
  let j; try{j=JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('This is not valid JSON ('+e.message+'). If an AI wrote it, ask it to "reply with only the JSON object".');}
  const P={title:String(j.title||'').trim().slice(0,80)||'Study pack',points:[],cards:[],questions:[],problems:[]};
  const arr=v=>Array.isArray(v)?v:[];
  const divOf=(d,o)=>{const u=String(d||'').toUpperCase().trim();if(DIVS.includes(u))return u;const m=String(o||'').toUpperCase().match(/^(PA|PPD|PDD)\b/);return m?m[1]:(u==='GENERAL'||u==='GEN'?'GEN':'');};
  const objOf=o=>{const m=String(o||'').match(/(\d+\.\d+)/);return m?m[1]:'';};
  const str=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
  arr(j.points||j.notes).forEach((p,i)=>{
    const text=str(typeof p==='string'?p:(p.text||p.note||p.content||p.point));
    if(!text){P.problems.push('Point '+(i+1)+' has no text and was skipped.');return;}
    const div=divOf(p.division||p.div,p.objective)||'GEN';
    P.points.push({div,obj:div==='GEN'?'':objOf(p.objective||p.obj),text:text.slice(0,4000)});
  });
  arr(j.cards||j.flashcards).forEach((c,i)=>{
    const q=str(c.question||c.front||c.q), an=str(c.answer||c.back||c.a);
    if(!q||!an){P.problems.push('Card '+(i+1)+' needs both a question and an answer and was skipped.');return;}
    const div=divOf(c.division||c.div,c.objective), obj=objOf(c.objective||c.obj);
    P.cards.push({d:(str(c.deck)||P.title).slice(0,60),o:div&&div!=='GEN'?(obj?div+' '+obj:div):'—',q,a:an});
  });
  arr(j.questions||j.items).forEach((q,i)=>{
    const s=str(q.question||q.stem||q.s), opts=arr(q.options||q.opts||q.choices).map(str).filter(Boolean);
    const div=divOf(q.division||q.div,q.objective), obj=objOf(q.objective||q.obj), e=str(q.explanation||q.why||q.e);
    const label='Question '+(i+1)+(s?' (“'+s.slice(0,40)+'…”)':'');
    if(!s){P.problems.push(label+' has no question text and was skipped.');return;}
    if(opts.length<2){P.problems.push(label+' needs at least two options and was skipped.');return;}
    if(!DIVS.includes(div)){P.problems.push(label+' needs a division (PA, PPD or PDD) and was skipped.');return;}
    const want=arr(q.correct!=null?(Array.isArray(q.correct)?q.correct:[q.correct]):(q.answer!=null?[q.answer]:[])), c=[];
    want.forEach(w=>{let k=-1;
      if(typeof w==='number')k=w;
      else{const t=str(w);k=opts.findIndex(o=>o.toLowerCase()===t.toLowerCase());
        if(k<0&&/^[A-Za-z]$/.test(t))k=t.toUpperCase().charCodeAt(0)-65;
        if(k<0&&/^\d+$/.test(t))k=+t;
        if(k<0)k=opts.findIndex(o=>o.toLowerCase().startsWith(t.toLowerCase().slice(0,25)));}
      if(k>=0&&k<opts.length&&!c.includes(k))c.push(k);});
    if(!c.length){P.problems.push(label+' has no correct option that matches one of its options and was skipped.');return;}
    let t=String(q.type||'').toLowerCase(); t=/cata|all|multi/.test(t)?'cata':(t==='mc'?'mc':(c.length>1?'cata':'mc'));
    if(t==='mc'&&c.length>1){t='cata';P.problems.push(label+' is marked multiple choice but has '+c.length+' correct options, so it was imported as check-all-that-apply.');}
    P.questions.push({d:div,o:obj?div+' '+obj:div,t,s,opts,c,e});
  });
  if(!P.points.length&&!P.cards.length&&!P.questions.length&&!P.problems.length)throw new Error('The pack has no "points", "cards" or "questions" lists.');
  return P;
}
/* compare against what this person already has, so re-importing doesn't duplicate */
function packDupes(P){
  const norm=s=>strip(String(s||'')).toLowerCase().replace(/\s+/g,' ').trim();
  const havePts=new Set(myPoints().map(p=>norm(md2html(p.text)))), haveQ=new Set(CARDS.map(c=>norm(c.q))), haveS=new Set(ITEMS.map(i=>norm(i.s)));
  P.points.forEach(p=>{p.dup=havePts.has(norm(md2html(p.text)));});
  P.cards.forEach(c=>{c.dup=haveQ.has(norm(inlineMd(c.q)));});
  P.questions.forEach(q=>{q.dup=haveS.has(norm(inlineMd(q.s)));});
}
function importPack(P){
  S.custom=S.custom||{}; ['cards','items','points','packs'].forEach(k=>{S.custom[k]=S.custom[k]||{};});
  const pid='k'+Date.now().toString(36), now=Date.now(); let n={points:0,cards:0,questions:0};
  P.points.filter(x=>!x.dup).forEach(p=>{S.custom.points[newUid()]={div:p.div,obj:p.obj,text:p.text,at:now+n.points,pack:pid};n.points++;});
  P.cards.filter(x=>!x.dup).forEach(c=>{S.custom.cards[newUid()]={d:c.d,o:c.o,q:oneLine(c.q),a:md2html(c.a),qraw:c.q,araw:c.a,at:now,pack:pid};n.cards++;});
  P.questions.filter(x=>!x.dup).forEach(q=>{S.custom.items[newUid()]={d:q.d,o:q.o,t:q.t,s:oneLine(q.s),opts:q.opts,c:q.c,e:q.e?md2html(q.e).replace(/^<p>([\s\S]*)<\/p>$/,'$1'):'',sraw:q.s,eraw:q.e,at:now,pack:pid};n.questions++;});
  S.custom.packs[pid]={title:P.title,at:now,counts:n};
  rebuildMaterial(); save();
  return n;
}
function removePack(pid){
  const C=S.custom||{};
  ['cards','items','points'].forEach(k=>{const o=C[k]||{};Object.keys(o).forEach(id=>{if(o[id].pack===pid)delete o[id];});});
  if(C.packs)delete C.packs[pid];
  rebuildMaterial(); save();
}
function exportPack(){
  const C=S.custom||{}, pts=myPoints(), mc=CARDS.filter(c=>c.mine), mq=ITEMS.filter(q=>q.mine);
  const so=o=>{const x=splitObj(o);return {division:x.div==='—'?'':x.div,objective:x.obj};};
  return {format:'are-study-pack',version:1,title:(curProf().name||'My')+' — study material '+ds(new Date()),
    points:pts.map(p=>({division:p.div==='GEN'?'General':p.div,objective:p.obj||'',text:p.text})),
    cards:mc.map(c=>Object.assign({deck:c.d},so(c.o),{question:c.qraw!=null?c.qraw:html2md(c.q),answer:c.araw!=null?c.araw:html2md(c.a)})),
    questions:mq.map(q=>Object.assign(so(q.o),{type:q.t,question:q.sraw!=null?q.sraw:html2md(q.s),options:q.opts,correct:q.c.map(k=>q.opts[k]),explanation:q.eraw!=null?q.eraw:html2md(q.e)}))};
}

function downloadText(name,text){
  try{const u=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);return true;}catch(e){return false;}

        (size>330000?'<div class="aerr" style="margin:8px 0 0">This pack is too large to sync with your account. Split it into smaller packs.</div>':'')+'</div>';

}

/* ================= PREVIEW SITE + ADMIN PUBLISH =================
   The develop branch deploys to a develop.* address. There a banner marks the preview,
   and members of the Cognito group "admin" get a button that publishes develop to main. */
const IS_PREVIEW=/^develop\./i.test(location.hostname)||/[?&]preview\b/.test(location.search);
const isAdmin=()=>!!(SESSION&&SESSION.groups&&SESSION.groups.includes('admin'));
function paintPreview(){
  if(!IS_PREVIEW)return;
  let bar=$('#previewBar');
  if(!bar){bar=document.createElement('div');bar.id='previewBar';bar.className='previewbar';bar.setAttribute('role','status');$('#main').insertBefore(bar,$('#view'));}
  bar.innerHTML='<span class="pvtag">Preview</span><span class="pvtxt">This is the preview version: changes here are not on the live site yet. Your progress is shared with the live site.</span>'+
    (AUTH_ON&&isAdmin()?'<button type="button" class="btn sm pri" id="pvPublish">Publish to live site…</button>':'');
  const b=$('#pvPublish'); if(b)b.onclick=openPublish;
}
async function releaseApi(method){
  const t=await idToken(); if(!t)throw new Error('Sign in again to publish.');
  let r;
  try{r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/release',{method,headers:{Authorization:'Bearer '+t}});}
  catch(e){throw new Error('Could not reach the publish service. If this keeps happening, check that this address is in the stack’s SiteOrigins.');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('The publish service answered '+r.status+'.'));
  return j;
}
function openPublish(){
  const body=inner=>'<div class="lbl">Admin</div><div class="q">Publish to the live site</div>'+inner;
  modalForm(body('<p class="small">Checking what is waiting on the preview…</p>'),(a,m,close)=>{if(a==='close')close();});
  releaseApi('GET').then(rel=>{
    if(!rel.ahead){modalForm(body('<p>Nothing to publish. The live site already has everything on the preview.</p><div class="row"><button type="button" class="btn" data-a="close">Close</button></div>'),(a,m,close)=>close());return;}

/* a dialog that stays open: onAct(action, modalEl, close) for [data-a] clicks, onSubmit(form, modalEl, close) for forms */
function modalForm(html,onAct,onSubmit){
  const m=$('#modal'),s=$('#scrim');m.innerHTML=html;m.hidden=false;s.hidden=false;
  const close=()=>{m.hidden=true;s.hidden=true;m.onclick=null;m.onsubmit=null;document.removeEventListener('keydown',kd);};

function fpool(){return fkeys?CARDS.filter(c=>fkeys.includes(ckey(c))):fobj?CARDS.filter(c=>c.o===fobj):cardPool();}

/* touch: once the answer shows, swipe left = Again, right = Good; vertical drags scroll the page */
let swiped=false;
function attachSwipe(el){
  let sx=0,sy=0,dx=0,on=false,decided=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;sx=e.clientX;sy=e.clientY;dx=0;on=true;decided=false;swiped=false;});
  el.addEventListener('pointermove',e=>{
    if(!on)return;const mx=e.clientX-sx,my=e.clientY-sy;
    if(!decided){if(Math.abs(mx)<8&&Math.abs(my)<8)return;decided=true;if(Math.abs(my)>Math.abs(mx)){on=false;return;}el.classList.add('drag');try{el.setPointerCapture(e.pointerId);}catch(_){}}
    dx=fshown?mx:mx*0.15;
    el.style.transform='translateX('+dx+'px) rotate('+(dx/30)+'deg)';
  });
  const end=()=>{
    if(!on)return;on=false;el.classList.remove('drag');
    const th=Math.min(110,(window.innerWidth||400)*0.26);
    if(fshown&&Math.abs(dx)>th){swiped=true;el.style.transform='translateX('+(dx<0?-1:1)*window.innerWidth+'px)';el.style.opacity='0';setTimeout(()=>rate(dx<0?1:3),160);return;}
    if(Math.abs(dx)>8)swiped=true;
    el.style.transform='';setTimeout(()=>{swiped=false;},50);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function goodLabel(s){const nb=s?Math.min(5,s.b+1):2;const d=Math.round(INT[nb]/DAY);return d+' day'+(d===1?'':'s');}

function rate(r){

/* one item card. mode.live: answers record immediately; mode.run: selection only, no reveal; mode.review: show result for given sel */
function itemEl(it,idx,mode){

/* record an answer and learn from it; returns {cls,msg} describing what the system did */
function record(idx,sel){
  const it=ITEM(idx), ok=itemOk(it,sel), now=Date.now();
  S.ans[idx]={sel:sel.slice(),ok:ok,at:now};
  let out=null;
  const m=S.mist[idx];
  if(!ok){
    const e=m||{n:0,note:''};
    e.n++; e.sel=sel.slice(); e.at=now; e.stage=0; e.due=now+MGAP[0]; e.fixed=false;
    S.mist[idx]=e;
    const q=queueObjCards(it.o);
    out={cls:'',msg:'<strong>Logged in your mistakes.</strong> This question comes back tomorrow'+(q?', and '+q+' '+esc(it.o)+' flashcard'+(q===1?' is':'s are')+' now in today\'s review':'')+'.'+(e.n>1?' You have missed it '+e.n+' times — add a note on the Mistakes page about what keeps tripping you.':'')};
  } else if(m&&!m.fixed){
    if(now>=m.due-6*36e5){ // on schedule (within 6 h of due): advance
      m.stage++;
      if(m.stage>=MGAP.length){m.fixed=true;m.fixedAt=now;out={cls:'good',msg:'<strong>Fixed.</strong> Right three times on schedule — this one has stuck.'};}
      else{m.due=now+MGAP[m.stage];out={cls:'good',msg:'<strong>Right on schedule</strong> ('+m.stage+' of 3). It comes back in '+Math.round(MGAP[m.stage]/DAY)+' days to make sure.'};}
    } else out={cls:'good',msg:'Right — but this was an early retry, so the schedule stays the same. It is due '+whenStr(m.due)+'.'};
  }
  logAct(); save();
  return out;
}
/* pull this objective's cards into today's review */
function queueObjCards(o){
  if(!o||o==='—')return 0;
  const now=Date.now(); let n=0;
  CARDS.filter(c=>c.o===o).forEach(c=>{const k=ckey(c),s=S.cards[k];
    if(!s){S.cards[k]={b:0,n:0,due:now,q:1};n++;}
    else if(s.due>now){s.due=now;s.b=Math.min(s.b,1);n++;}});
  return n;
}
function whenStr(t){const d=Math.round((midnight(new Date(t))-midnight(new Date()))/DAY);return d<=0?'today':d===1?'tomorrow':'in '+d+' days';}
function mistDue(){const now=Date.now();return Object.keys(S.mist).filter(i=>{const m=S.mist[i];return !m.fixed&&m.due<=now&&ITEM(i);});}

/* timed run */
function startRun(div,n){
  let pool=ITEMS.map(it=>it.id).filter(i=>!div||ITEM(i).d===div);
  // prefer unanswered and missed items first
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  if(n)pool=pool.slice(0,n);
  startRunIdx(pool,div?'Timed set · '+div:'Timed set',div);
}
function startRunIdx(ids,label,div){
  const pool=shuffle(ids.slice());
  run={div:div||'',label:label,idx:pool,sel:{},cur:0,secs:Math.round(pool.length*2.4*60),start:Date.now(),done:false};
  paintRun();
  stopTimer();
  tmr=setInterval(()=>{const left=runLeft();const t=$('#runT');if(t){t.textContent=fmt(left);t.classList.toggle('low',left<120);}if(left<=0)finishRun();},1000);
}
function rank(i){const m=S.mist[i];if(m&&!m.fixed&&m.due<=Date.now())return 0;const a=S.ans[i];return !a?1:(a.ok?3:2);}
function runLeft(){return Math.max(0,run.secs-Math.floor((Date.now()-run.start)/1000));}
function fmt(s){return Math.floor(s/60)+':'+pad(s%60);}
function paintRun(){
  const area=$('#qzArea'); if(!area)return;
  const i=run.idx[run.cur], it=ITEM(i);
  area.innerHTML='<div class="qzctl"><div class="runbar"><div><span class="lbl">'+esc(run.label)+'</span><div class="timer" id="runT">'+fmt(runLeft())+'</div></div>'+
    '<div class="row"><button type="button" class="btn sm" id="runPrev"'+(run.cur?'':' disabled')+'>Previous</button><button type="button" class="btn sm" id="runNext">'+(run.cur<run.idx.length-1?'Next':'Review answers')+'</button><button type="button" class="btn sm pri" id="runEnd">Finish and score</button></div></div>'+
    '<div class="dots" id="runDots">'+run.idx.map((x,k)=>'<button type="button" data-k="'+k+'" class="'+(run.sel[x]&&run.sel[x].length?'ans':'')+(k===run.cur?' cur':'')+'" aria-label="Item '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div></div><div id="runItem"></div>';
  $('#runItem').appendChild(itemEl(it,i,{sel:run.sel[i]||[],onSel:s=>{run.sel[i]=s;const d=$$('#runDots button')[run.cur];if(d)d.classList.toggle('ans',s.length>0);}}));
  $('#runPrev').onclick=()=>{run.cur--;paintRun();};
  $('#runNext').onclick=()=>{if(run.cur<run.idx.length-1){run.cur++;paintRun();}else finishRun();};
  $('#runEnd').onclick=()=>{
    const un=run.idx.filter(x=>!(run.sel[x]&&run.sel[x].length)).length;
    if(un&&runLeft()>0){modal('<div class="q">Finish with '+un+' unanswered?</div><p class="small">Unanswered items score zero. On the exam there is no penalty for guessing, so answer everything.</p><div class="row"><button type="button" class="btn pri" data-a="y">Finish and score</button><button type="button" class="btn" data-a="n">Keep going</button></div>',a=>{if(a==='y')finishRun();});}
    else finishRun();
  };
  $('#runDots').onclick=e=>{const b=e.target.closest('button[data-k]');if(b){run.cur=+b.dataset.k;paintRun();}};
}
function finishRun(){
  if(!run||run.done)return; run.done=true; stopTimer();
  const used=Math.min(run.secs,Math.floor((Date.now()-run.start)/1000));
  let ok=0, logged=0, fixedN=0; const byObj={};
  run.idx.forEach(i=>{const s=run.sel[i]||[];const good=itemOk(ITEM(i),s);if(good)ok++;
    if(s.length){const r=record(i,s);if(!good)logged++;else if(r&&S.mist[i]&&S.mist[i].fixed&&r.msg.indexOf('Fixed')>=0)fixedN++;}else{S.ans[i]={sel:[],ok:false,at:Date.now()};}
    if(!good)byObj[ITEM(i).o]=(byObj[ITEM(i).o]||0)+1;});
  save();
  const pct=Math.round(ok/run.idx.length*100);
  const area=$('#qzArea');
  area.innerHTML='<div class="qzctl"><div class="score"><b>'+ok+'/'+run.idx.length+'</b><span class="lbl">'+pct+'% correct · '+fmt(used)+' used of '+fmt(run.secs)+'</span></div>'+
    ((logged||fixedN)?'<div class="learned'+(logged?'':' good')+'" style="margin:0">'+(logged?logged+' wrong answer'+(logged===1?'':'s')+' logged on the Mistakes page; each comes back tomorrow and its objective\'s cards are in today\'s review. ':'')+(fixedN?fixedN+' earlier mistake'+(fixedN===1?'':'s')+' now fixed.':'')+'</div>':'')+
    (Object.keys(byObj).length?'<div class="row"><span class="lbl">Reread</span>'+Object.keys(byObj).map(o=>'<button type="button" class="btn sm" data-obj="'+esc(o)+'">'+esc(o)+(byObj[o]>1?' ×'+byObj[o]:'')+'</button>').join('')+'</div>':'<p class="small" style="margin:0">Clean sweep. Try a larger set or a different division.</p>')+
    '<div class="row"><button type="button" class="btn pri" id="runAgain">New timed set</button><button type="button" class="btn" id="runList">Back to the question bank</button></div></div><div id="runRev"></div>';
  run.idx.forEach(i=>$('#runRev').appendChild(itemEl(ITEM(i),i,{review:true,sel:run.sel[i]||[]})));
  const r=run; run=null;
  area.querySelector('.qzctl').addEventListener('click',e=>{const b=e.target.closest('[data-obj]');if(b)gotoObj(b.dataset.obj);});
  $('#runAgain').onclick=()=>startRun(r.div,r.idx.length);
  $('#runList').onclick=()=>practiceList();
  window.scrollTo(0,0);
}

  }

let IDX=null;
function buildIndex(){
  IDX=[];
  CARDS.forEach((c,i)=>IDX.push({k:'Card · '+c.d,t:strip(c.q),x:strip(c.a),type:'card',ref:i}));
  ITEMS.forEach(it=>IDX.push({k:'Question · '+it.o,t:strip(it.s),x:it.opts.join(' · '),type:'item',ref:it.id}));
  myPoints().forEach(p=>{const t=strip(md2html(p.text));IDX.push({k:'My point · '+ptLabel(p),t:t.slice(0,140),x:t,type:'point',ref:p.id});});
  NOTE_PAGES.forEach(pid=>{
    const tpl=$('#tpl-'+pid); if(!tpl)return;
    const frag=tpl.content, pname=PAGES.find(p=>p.id===pid).n;
    const heads=$$('h1,h2,h3,h4',frag);
    heads.forEach((h,hi)=>{
      let txt='',n=h.nextElementSibling;
      while(n&&!/^H[1-4]$/.test(n.tagName)){txt+=' '+n.textContent;n=n.nextElementSibling;}
      IDX.push({k:'Notes · '+pname,t:h.textContent.replace(/\s+/g,' ').trim(),x:txt.replace(/\s+/g,' ').trim(),type:'head',page:pid,ref:hi});
    });
    $$('tr',frag).forEach((tr,ri)=>{const td=$$('td',tr);if(td.length<2)return;const cap=tr.closest('table');
      IDX.push({k:(pid==='numbers'?'Number':'Table')+' · '+pname,t:td[0].textContent.trim(),x:td.slice(1).map(x=>x.textContent.trim()).join(' · '),type:'row',page:pid,ref:ri});});
  });
  IDX.forEach(r=>{r.lt=r.t.toLowerCase();r.lx=r.x.toLowerCase();});
}
function hi(s,terms){let h=esc(s);terms.forEach(t=>{if(t.length<2)return;h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');});return h;}
function snippet(x,terms){const lx=x.toLowerCase();let p=-1;terms.some(t=>{p=lx.indexOf(t);return p>=0;});if(p<0)return x.slice(0,140);const s=Math.max(0,p-50);return (s?'…':'')+x.slice(s,s+160);}
function search(q){
  if(!IDX)buildIndex();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length)return [];
  const out=[];
  IDX.forEach(r=>{let sc=0;for(const t of terms){const inT=r.lt.includes(t),inX=r.lx.includes(t);if(!inT&&!inX)return;sc+=inT?3:1;}
    if(r.lt.includes(q.toLowerCase()))sc+=4; if(r.type==='row')sc+=1; out.push([sc,r]);});
  return out.sort((a,b)=>b[0]-a[0]).slice(0,30).map(x=>x[1]);
}
const qIn=$('#q'), res=$('#results'); let resList=[];
const fitSearch=()=>{qIn.placeholder=window.innerWidth<600?'Search notes, cards, questions…':'Search notes, numbers, cards and questions — try “occupant load” or “LOD 350”';};
fitSearch(); window.addEventListener('resize',fitSearch);

  res.hidden=false;
});
qIn.addEventListener('keydown',e=>{if(e.key==='Escape'){qIn.value='';res.hidden=true;qIn.blur();}if(e.key==='ArrowDown'){const f=$('.res',res);if(f){e.preventDefault();f.focus();}}if(e.key==='Enter'){const f=$('.res',res);if(f)f.click();}});
