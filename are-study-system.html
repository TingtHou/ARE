/* sign-in screens: signin · signup · confirm · forgot · reset */
let authMem={};
function showAuth(mode,o){
  o=o||{}; $('#shell').hidden=true; $('#authView').hidden=false;
  const f=(id,label,type,extra)=>'<label class="af" for="'+id+'"><span>'+label+'</span><input id="'+id+'" type="'+type+'" '+(extra||'')+'></label>';
  const E=esc(authMem.email||'');
  const V={
    signin:['Sign in','Pick up where you left off, on any device.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"')+f('aPass','Password','password','autocomplete="current-password" required'),'Sign in','<button type="button" class="lnk" data-m="signup">Create an account</button><button type="button" class="lnk" data-m="forgot">Forgot password?</button>'],
    signup:['Create your account','Your flashcards, answers, mistakes and plan follow you to every device.',f('aName','Your name','text','autocomplete="name" maxlength="40" required')+f('aEmail','Email','email','autocomplete="email" required value="'+E+'"')+f('aPass','Password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Create account','<button type="button" class="lnk" data-m="signin">I already have an account</button>'],
    confirm:['Check your email','We sent a 6-digit code to '+E+'. Enter it to confirm your account.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required'),'Confirm','<button type="button" class="lnk" data-m="resend">Send a new code</button><button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    forgot:['Reset your password','Enter your email and we will send you a code.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"'),'Send code','<button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    reset:['Choose a new password','Enter the code we emailed to '+E+' and your new password.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required')+f('aPass','New password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Set password','<button type="button" class="lnk" data-m="signin">Back to sign in</button>']
  }[mode];
  $('#authBody').innerHTML='<h1>'+V[0]+'</h1><p class="asub">'+V[1]+'</p>'+(o.msg?'<div class="learned good">'+esc(o.msg)+'</div>':'')+'<div class="aerr" id="aErr" role="alert" hidden></div>'+
    '<form id="aForm" novalidate>'+V[2]+'<button type="submit" class="btn pri abtn" id="aGo">'+V[3]+'</button></form><div class="alinks">'+V[4]+'</div>';
  const first=$('#authBody input:not([value]),#authBody input[value=""]')||$('#authBody input'); if(first)first.focus();
  $('#authBody').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;
    if(b.dataset.m==='resend'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});showAuth('confirm',{msg:'A new code is on its way.'});}catch(x){authErr(x.message);}return;}
    showAuth(b.dataset.m);};
  $('#aForm').onsubmit=async e=>{
    e.preventDefault();
    const v=id=>{const el=$('#'+id);return el?el.value.trim():'';}, go1=$('#aGo');
    const need=$$('#aForm input').find(i=>!i.value.trim()); if(need){authErr('Fill in '+need.closest('label').querySelector('span').textContent.toLowerCase()+'.');need.focus();return;}
    go1.disabled=true; const label=go1.textContent; go1.textContent='Please wait…';
    try{
      if(mode==='signin'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;await doSignIn();return;}
      if(mode==='signup'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;
        await cog('SignUp',{ClientId:AC.clientId,Username:authMem.email,Password:authMem.pass,UserAttributes:[{Name:'email',Value:authMem.email},{Name:'name',Value:v('aName')}]});
        showAuth('confirm');return;}
      if(mode==='confirm'){await cog('ConfirmSignUp',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode')});
        if(authMem.pass){await doSignIn();}else showAuth('signin',{msg:'Email confirmed. Sign in to continue.'});return;}
      if(mode==='forgot'){authMem.email=v('aEmail');await cog('ForgotPassword',{ClientId:AC.clientId,Username:authMem.email});showAuth('reset');return;}
      if(mode==='reset'){authMem.pass=$('#aPass').value;await cog('ConfirmForgotPassword',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode'),Password:authMem.pass});await doSignIn();return;}
    }catch(x){
      if(x.code==='UserNotConfirmedException'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});}catch(_){}showAuth('confirm',{msg:'Your email is not confirmed yet. We sent a new code.'});return;}
      authErr(x.message); go1.disabled=false; go1.textContent=label;
    }
  };
}
function authErr(t){const el=$('#aErr');if(!el)return;el.textContent=t;el.hidden=false;}
async function doSignIn(){
  const j=await cog('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:AC.clientId,AuthParameters:{USERNAME:authMem.email,PASSWORD:authMem.pass}});
  if(!j.AuthenticationResult){const x=new Error('This account needs a step the site does not support yet ('+(j.ChallengeName||'unknown')+').');throw x;}
  setSession(j.AuthenticationResult,authMem.email); authMem.pass=''; enterApp();
}

/* ================= STUDY PACKS: import / export many points, cards and questions at once =================
   One JSON object (the format AI tools write most reliably):
   { "format":"are-study-pack", "version":1, "title":"…",
     "points":[{"division":"PA","objective":"4.3","text":"…"}],
     "cards":[{"deck":"…","division":"PPD","objective":"2.2","question":"…","answer":"…"}],
     "questions":[{"division":"PDD","objective":"3.2","type":"mc","question":"…","options":["…","…"],"correct":["…"],"explanation":"…"}] } */
const PACK_EXAMPLE={format:'are-study-pack',version:1,title:'PPD egress — my notes',
  points:[{division:'PPD',objective:'2.2',text:'Occupant load: **business = 150 SF gross** in the 2021 IBC (it was 100 in 2018).\n\n- round occupant load UP\n- check both the capacity and the 44 in minimum'}],
  cards:[{deck:'PPD · My egress cards',division:'PPD',objective:'2.2',question:'Minimum number of exits for 620 occupants on one storey',answer:'**3 exits.** 1–500 → 2 · 501–1,000 → 3 · over 1,000 → 4.'}],
  questions:[{division:'PPD',objective:'2.2',type:'mc',question:'A sprinklered Group B floor has an occupant load of 180. Which governs the stair width?',
    options:['180 × 0.2 in = 36 in','180 × 0.3 in = 54 in','The 44 in minimum stair width','The 36 in minimum for fewer than 50 occupants'],
    correct:['The 44 in minimum stair width'],explanation:'180 × 0.2 = 36 in is below the 44 in minimum for 50 or more occupants, so the minimum governs. 0.3 in applies only without sprinklers plus voice/alarm.'},
    {division:'PPD',objective:'2.2',type:'num',title:'Stair width from occupant load',question:'A sprinklered Group A floor has an occupant load of 300. Using 0.2 in. per occupant, what total stair width is required, in inches?',answer:60,tolerance:0,unit:'in.',explanation:'300 × 0.2 = 60 in. That is above the 44 in. minimum, so 60 in. governs.'},
    {division:'PPD',objective:'2.1',type:'match',title:'Occupancy groups',question:'Match each use to its IBC occupancy group.',statements:['A dentist office','A K–8 school','A retail store'],choices:['Group B','Group E','Group M'],matches:['Group B','Group E','Group M'],explanation:'Outpatient clinics and offices are B; schools through grade 12 are E; retail sales are M.'}]};
function aiPackPrompt(){
  return 'Turn my study notes into an ARE study pack for the ARE Study System.\n\n'+
  'Reply with ONE JSON object and nothing else, in exactly this shape:\n\n'+JSON.stringify(PACK_EXAMPLE,null,2)+'\n\n'+
  'Rules:\n'+
  '- "division" is "PA", "PPD" or "PDD" ("General" is allowed for points).\n'+
  '- "objective" is the NCARB objective number such as "2.2", or "" if none fits.\n'+
  '- "points": short study notes worth rereading. "text" may use "- " bullets, "1. " steps, **bold**, and blank lines between paragraphs.\n'+
  '- "cards": flashcards. "question" is a prompt; "answer" is what to recall, complete lists where the exam tests lists.\n'+
  '- "questions": exam-style items in four formats: "mc", "cata", "num" and "match" (see the examples above). Write the same concept in more than one format where it fits.\n'+FORMAT_RULES+'\n'+
  '- Only use facts that are in my notes or that you are confident are current (2021 IBC, 2010 ADA Standards, ARE 5.0). Do not invent code section numbers.\n'+
  '- Leave out any list you have nothing for.\n\n'+

/* read a pack from text: tolerant of code fences and text around the JSON */
/* one question in study-pack form → a question item, any of the four types:
   mc / cata: options[], correct[] (option text, letter or number)
   num:       answer (number), tolerance (optional), unit (optional)
   match:     statements[], choices[], matches[] (the right choice for each statement: text, letter or number)
   plus division, objective, title (optional), question and explanation. Problems are reported in words. */
/* a question item as stored in My material (from a pack, a generator or a similar-question loop) */
function itemFromPack(q){
  const it={d:q.d,o:q.o,t:q.t,s:(q.title?'<p class="qtitle">'+esc(q.title)+'</p>':'')+(/\n/.test(q.s)?md2html(q.s):oneLine(q.s)),e:q.e?md2html(q.e).replace(/^<p>([\s\S]*)<\/p>$/,'$1'):'',sraw:q.s,eraw:q.e};
  if(q.title)it.title=q.title;
  if(q.t==='num')Object.assign(it,{ans:q.ans,tol:q.tol,unit:q.unit||''});
  else Object.assign(it,{opts:q.opts,c:q.c});
  if(q.t==='match')it.items=q.items;
  return it;
}
/* and back to study-pack form (export, and the examples the AI follows) */
function packOf(q){
  const out={type:q.t};
  const tt=q.title||((String(q.s).match(/<p class="qtitle">([\s\S]*?)<\/p>/)||[])[1]);
  if(tt)out.title=strip(tt);
  out.question=q.sraw!=null?q.sraw:html2md(String(q.s).replace(/<p class="qtitle">[\s\S]*?<\/p>/,''));
  if(q.t==='num')Object.assign(out,{answer:+q.ans,tolerance:+q.tol||0,unit:q.unit||''});
  else if(q.t==='match')Object.assign(out,{statements:q.items.map(strip),choices:q.opts.map(strip),matches:q.c.map(k=>strip(q.opts[k]))});
  else Object.assign(out,{options:q.opts.map(strip),correct:q.c.map(k=>strip(q.opts[k]))});
  out.explanation=q.eraw!=null?q.eraw:html2md(q.e);
  return out;
}
function packQuestion(q,label,problems){
  const arr=v=>Array.isArray(v)?v:[], str=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
  const divOf=(d,o)=>{const u=String(d||'').toUpperCase().trim();if(DIVS.includes(u))return u;const m=String(o||'').toUpperCase().match(/^(PA|PPD|PDD)\b/);return m?m[1]:'';};
  const objOf=o=>{const m=String(o||'').match(/(\d+\.\d+)/);return m?m[1]:'';};
  const s=str(q.question||q.stem||q.s), div=divOf(q.division||q.div,q.objective), obj=objOf(q.objective||q.obj), e=str(q.explanation||q.why||q.e), title=str(q.title);
  label=label+(s?' (“'+s.slice(0,40)+'…”)':'');
  const bad=m=>{problems.push(label+' '+m+' and was skipped.');return null;};
  if(!s)return bad('has no question text');
  if(!DIVS.includes(div))return bad('needs a division (PA, PPD or PDD)');
  const pick=(list,w)=>{if(typeof w==='number')return w;const x=str(w);let k=list.findIndex(o=>o.toLowerCase()===x.toLowerCase());
    if(k<0&&/^[A-Za-z]$/.test(x))k=x.toUpperCase().charCodeAt(0)-65; if(k<0&&/^\d+$/.test(x))k=+x;
    if(k<0&&x.length>3)k=list.findIndex(o=>o.toLowerCase().startsWith(x.toLowerCase().slice(0,25))||x.toLowerCase().startsWith(o.toLowerCase().slice(0,25)));
    return k>=0&&k<list.length?k:-1;};
  let ty=String(q.type||'').toLowerCase();
  const base={d:div,o:obj?div+' '+obj:div,title,s,e};
  if(/num|fill|calc/.test(ty)||(q.answer!=null&&!arr(q.options||q.opts||q.choices).length&&!arr(q.statements).length)){
    const v=numIn(q.answer!=null?q.answer:q.correct); if(v==null)return bad('is a fill-in question without a numeric answer');
    const dec=(String(q.answer).replace(/[$,]/g,'').split('.')[1]||'').length, tol=numIn(q.tolerance);
    return Object.assign(base,{t:'num',ans:v,tol:tol!=null&&tol>=0?tol:+(0.5*Math.pow(10,-dec)).toPrecision(3),unit:str(q.unit).slice(0,30)});
  }
  if(/match|drag/.test(ty)||arr(q.statements||q.items).length){
    const items=arr(q.statements||q.items).map(str).filter(Boolean), opts=arr(q.choices||q.options||q.opts).map(str).filter(Boolean);
    const c=arr(q.matches||q.correct).map(w=>pick(opts,w));
    if(items.length<2||opts.length<2)return bad('is a matching question that needs at least two statements and two choices');
    if(c.length!==items.length||c.some(k=>k<0))return bad('needs one right choice (from its choices) for every statement');
    return Object.assign(base,{t:'match',items,opts,c});
  }
  const opts=arr(q.options||q.opts||q.choices).map(str).filter(Boolean);
  if(opts.length<2)return bad('needs at least two options');
  const want=arr(q.correct!=null?(Array.isArray(q.correct)?q.correct:[q.correct]):(q.answer!=null?[q.answer]:[])), c=[];
  want.forEach(w=>{const k=pick(opts,w);if(k>=0&&!c.includes(k))c.push(k);});
  if(!c.length)return bad('has no correct option that matches one of its options');
  ty=/cata|all|multi/.test(ty)?'cata':(ty==='mc'?'mc':(c.length>1?'cata':'mc'));
  if(ty==='mc'&&c.length>1){ty='cata';problems.push(label+' is marked multiple choice but has '+c.length+' correct options, so it was imported as check-all-that-apply.');}
  return Object.assign(base,{t:ty,opts,c});
}
function parsePack(text){
  let t=String(text||'').replace(/^﻿/,'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence)t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('No study pack found. The file should contain one JSON object that starts with { and ends with }.');
  let j; try{j=JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('This is not valid JSON ('+e.message+'). If an AI wrote it, ask it to "reply with only the JSON object".');}
  const P={title:String(j.title||'').trim().slice(0,80)||'Study pack',points:[],cards:[],questions:[],problems:[]};
  const arr=v=>Array.isArray(v)?v:[];
  const divOf=(d,o)=>{const u=String(d||'').toUpperCase().trim();if(DIVS.includes(u))return u;const m=String(o||'').toUpperCase().match(/^(PA|PPD|PDD)\b/);return m?m[1]:(u==='GENERAL'||u==='GEN'?'GEN':'');};
  const objOf=o=>{const m=String(o||'').match(/(\d+\.\d+)/);return m?m[1]:'';};
  const str=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
  arr(j.points||j.notes).forEach((p,i)=>{
    const text=str(typeof p==='string'?p:(p.text||p.note||p.content||p.point));
    if(!text){P.problems.push('Point '+(i+1)+' has no text and was skipped.');return;}
    const div=divOf(p.division||p.div,p.objective)||'GEN';
    P.points.push({div,obj:div==='GEN'?'':objOf(p.objective||p.obj),text:text.slice(0,4000)});
  });
  arr(j.cards||j.flashcards).forEach((c,i)=>{
    const q=str(c.question||c.front||c.q), an=str(c.answer||c.back||c.a);
    if(!q||!an){P.problems.push('Card '+(i+1)+' needs both a question and an answer and was skipped.');return;}
    const div=divOf(c.division||c.div,c.objective), obj=objOf(c.objective||c.obj);
    P.cards.push({d:(str(c.deck)||P.title).slice(0,60),o:div&&div!=='GEN'?(obj?div+' '+obj:div):'—',q,a:an});
  });
  arr(j.questions||j.items).forEach((q,i)=>{const it=packQuestion(q,'Question '+(i+1),P.problems);if(it)P.questions.push(it);});
  if(!P.points.length&&!P.cards.length&&!P.questions.length&&!P.problems.length)throw new Error('The pack has no "points", "cards" or "questions" lists.');
  return P;
}
/* compare against what this person already has, so re-importing doesn't duplicate */
function packDupes(P){
  const norm=s=>strip(String(s||'')).toLowerCase().replace(/\s+/g,' ').trim();
  const havePts=new Set(myPoints().map(p=>norm(md2html(p.text)))), haveQ=new Set(CARDS.map(c=>norm(c.q))), haveS=new Set(ITEMS.map(i=>norm(i.s)));
  P.points.forEach(p=>{p.dup=havePts.has(norm(md2html(p.text)));});
  P.cards.forEach(c=>{c.dup=haveQ.has(norm(inlineMd(c.q)));});
  P.questions.forEach(q=>{q.dup=haveS.has(norm(inlineMd(q.s)));});
}
function importPack(P){
  S.custom=S.custom||{}; ['cards','items','points','packs'].forEach(k=>{S.custom[k]=S.custom[k]||{};});
  const pid='k'+Date.now().toString(36), now=Date.now(); let n={points:0,cards:0,questions:0};
  P.points.filter(x=>!x.dup).forEach(p=>{S.custom.points[newUid()]={div:p.div,obj:p.obj,text:p.text,at:now+n.points,pack:pid};n.points++;});
  P.cards.filter(x=>!x.dup).forEach(c=>{S.custom.cards[newUid()]={d:c.d,o:c.o,q:oneLine(c.q),a:md2html(c.a),qraw:c.q,araw:c.a,at:now,pack:pid};n.cards++;});
  P.questions.filter(x=>!x.dup).forEach(q=>{S.custom.items[newUid()]=Object.assign(itemFromPack(q),{at:now,pack:pid});n.questions++;});
  S.custom.packs[pid]={title:P.title,at:now,counts:n};
  rebuildMaterial(); save();
  return n;
}
function removePack(pid){
  const C=S.custom||{};
  ['cards','items','points'].forEach(k=>{const o=C[k]||{};Object.keys(o).forEach(id=>{if(o[id].pack===pid)delete o[id];});});
  if(C.packs)delete C.packs[pid];
  rebuildMaterial(); save();
}
function exportPack(){
  const C=S.custom||{}, pts=myPoints(), mc=CARDS.filter(c=>c.mine), mq=ITEMS.filter(q=>q.mine);

async function releaseApi(method){
  const t=await idToken(); if(!t)throw new Error('Sign in again to publish.');

  try{r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/release',{method,headers:{Authorization:'Bearer '+t}});}
  catch(e){throw new Error('Could not reach the publish service. If this keeps happening, check that this address is in the stack’s SiteOrigins.');}

        catch(e){$('#pvActs',m).innerHTML='<div class="aerr" style="margin:0">'+esc(e.message)+'</div><div class="row" style="margin-top:10px"><button type="button" class="btn" data-a="close">Close</button></div>';}}
    });

/* a dialog that stays open: onAct(action, modalEl, close) for [data-a] clicks, onSubmit(form, modalEl, close) for forms */
function modalForm(html,onAct,onSubmit){
  const m=$('#modal'),s=$('#scrim');m.innerHTML=html;m.hidden=false;s.hidden=false;
  const close=()=>{m.hidden=true;s.hidden=true;m.onclick=null;m.onsubmit=null;document.removeEventListener('keydown',kd);};
  const kd=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',kd);
  s.onclick=close;
  m.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&onAct)onAct(b.dataset.a,m,close);};
  m.onsubmit=e=>{e.preventDefault();if(onSubmit)onSubmit(e.target,m,close);};
}

let fq=[], fcur=null, fshown=false, fsess=0, fobj=null, fkeys=null;
function initCards(opts){

  $$('#fcMode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===S.fcMode)));
  $('#fcMode').onclick=e=>{const b=e.target.closest('button[data-m]');if(!b)return;S.fcMode=b.dataset.m;save();$$('#fcMode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));startSession();};
  startSession();
}
function fpool(){return fkeys?CARDS.filter(c=>fkeys.includes(ckey(c))):fobj?CARDS.filter(c=>c.o===fobj):cardPool();}
function startSession(){
  const p=fpool(), now=Date.now();
  fsess=0;
  if(S.fcMode==='all'||fobj||fkeys){
    fq=shuffle(p.slice()).sort((a,b)=>{const x=cstate(a),y=cstate(b);return (x?x.b:-1)-(y?y.b:-1);});
  } else {
    const due=p.filter(c=>{const s=cstate(c);return s&&s.due<=now;}).sort((a,b)=>cstate(a).b-cstate(b).b||cstate(a).due-cstate(b).due);
    const nw=shuffle(p.filter(c=>!cstate(c))).slice(0,20);
    fq=due.concat(nw);
  }
  nextCard();
}
function nextCard(){
  fcur=fq.shift()||null; fshown=false;
  if(!fcur){cardsDone();return;}
  paintCard();
}
function paintCard(){
  const s=cstate(fcur), b=s?Math.min(3,s.b):null;
  const tag=s?'<span class="st b'+b+'">'+BOXNAME[s.b]+'</span>':'<span class="st">new</span>';
  $('#fcStage').innerHTML='<div class="flash" id="flash" tabindex="0" role="button" aria-label="'+(fshown?'Answer shown':'Reveal answer')+'">'+
    '<div class="tags"><span class="obj">'+esc(fcur.o)+'</span><span>'+esc(fcur.d)+'</span>'+(fcur.mine?'<span class="chip c-out">Yours</span>':fcur.edited?'<span class="chip c-rot">Edited</span>':'')+tag+'<button type="button" class="lnk fcedit" id="fcEdit">Edit</button></div>'+
    '<div class="q">'+fcur.q+'</div>'+(fshown?'<div class="a">'+fcur.a+'</div>':'<div class="hint">Tap or press Space to reveal</div>')+'</div>'+
    (fshown?'<div class="rate3"><button type="button" class="r1" data-r="1">Again<small>1 · minutes</small></button><button type="button" class="r2" data-r="2">Shaky<small>2 · tomorrow</small></button><button type="button" class="r3" data-r="3">Good<small>3 · '+goodLabel(s)+'</small></button></div>':'<button type="button" class="revealbtn" id="reveal">Reveal answer</button>');
  $('#flash').onclick=()=>{if(!fshown&&!swiped)reveal();};
  $('#fcEdit').onclick=e=>{e.stopPropagation();const was=fcur,sh=fshown;cardEditor(was,()=>{const nw=CARDS.find(x=>x.id===was.id);if(nw&&fcur===was){fcur=nw;fshown=sh;paintCard();}else if(!nw&&fcur===was)nextCard();});};
  if(fshown)$('#fcStage').insertAdjacentHTML('beforeend','<div class="fcstat swipehint">Swipe the card left for Again, right for Good</div>');
  attachSwipe($('#flash'));
  const rv=$('#reveal'); if(rv)rv.onclick=reveal;
  $$('.rate3 button').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
  if(fshown&&AI_POSSIBLE){$('#fcStage').insertAdjacentHTML('beforeend','<div class="fcai"><button type="button" class="lnk" id="fcAi">Explain this card with '+AI_NAME()+'</button></div>');$('#fcAi').onclick=()=>aiExplainCard(fcur,$('#fcStage'));}
  const c=cardCounts(fpool());
  $('#fcStat').innerHTML='<span>'+(fq.length+1)+' left this session</span><span>'+fsess+' rated</span><span>'+c.strong+' strong · '+c.learn+' learning · '+c.nw+' new</span>';
}
/* touch: once the answer shows, swipe left = Again, right = Good; vertical drags scroll the page */
let swiped=false;
function attachSwipe(el){
  let sx=0,sy=0,dx=0,on=false,decided=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;sx=e.clientX;sy=e.clientY;dx=0;on=true;decided=false;swiped=false;});
  el.addEventListener('pointermove',e=>{
    if(!on)return;const mx=e.clientX-sx,my=e.clientY-sy;
    if(!decided){if(Math.abs(mx)<8&&Math.abs(my)<8)return;decided=true;if(Math.abs(my)>Math.abs(mx)){on=false;return;}el.classList.add('drag');try{el.setPointerCapture(e.pointerId);}catch(_){}}
    dx=fshown?mx:mx*0.15;
    el.style.transform='translateX('+dx+'px) rotate('+(dx/30)+'deg)';
  });
  const end=()=>{
    if(!on)return;on=false;el.classList.remove('drag');
    const th=Math.min(110,(window.innerWidth||400)*0.26);
    if(fshown&&Math.abs(dx)>th){swiped=true;el.style.transform='translateX('+(dx<0?-1:1)*window.innerWidth+'px)';el.style.opacity='0';setTimeout(()=>rate(dx<0?1:3),160);return;}
    if(Math.abs(dx)>8)swiped=true;
    el.style.transform='';setTimeout(()=>{swiped=false;},50);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function goodLabel(s){const nb=s?Math.min(5,s.b+1):2;const d=Math.round(INT[nb]/DAY);return d+' day'+(d===1?'':'s');}
function reveal(){if(!fcur||fshown)return;fshown=true;paintCard();const r=$('.rate3 .r3');if(r)r.focus({preventScroll:true});}
function rate(r){
  if(!fcur||!fshown)return;
  const k=ckey(fcur), s=S.cards[k]||{b:0,n:0,due:0}, now=Date.now();
  if(r===1){S.cardMiss[k]=(S.cardMiss[k]||0)+1;s.b=0;s.due=now+INT[0];fq.splice(Math.min(3,fq.length),0,fcur);}
  else if(r===2){s.b=Math.max(1,Math.min(s.b,2));s.due=now+DAY;}
  else{s.b=Math.min(5,(S.cards[k]?s.b:1)+1);s.due=now+INT[s.b];}
  s.n=(s.n||0)+1; s.r=r; S.cards[k]=s;
  fsess++; logAct(); save(); nextCard();
}
function cardsDone(){
  const p=fpool(), c=cardCounts(p), now=Date.now();
  const nextDue=p.map(cstate).filter(Boolean).map(s=>s.due).filter(d=>d>now).sort((a,b)=>a-b)[0];
  const when=nextDue?(nextDue-now<DAY?'later today':'on '+new Date(nextDue).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})):null;
  $('#fcStage').innerHTML='<div class="donebox"><div class="big">'+fsess+'</div><h2>'+(fsess?'Session complete':'Nothing due right now')+'</h2><p>'+c.strong+' of '+c.n+' cards in this set are strong.'+(when?' The next card comes due '+when+'.':'')+(c.nw?' '+c.nw+' new cards remain.':'')+'</p><div class="row">'+
    (c.nw&&S.fcMode==='due'?'<button type="button" class="btn pri" id="fcMore">Learn 20 more new cards</button>':'')+
    '<button type="button" class="btn" id="fcAll">Study the whole set anyway</button><button type="button" class="btn" id="fcHome">Back to Today</button></div></div>';

}

    else if(it.t==='match')it.items.forEach((x,i)=>{const sl=$('.qmsel[data-mi="'+i+'"]',el),row=sl.closest('.qmrow'),v=s[i]!=null?+s[i]:-1,good=v===it.c[i];
      sl.value=String(v);sl.disabled=true;row.classList.add(good?'right':'wrong');if(!good){const ans=$('.qmans',row);ans.hidden=false;ans.textContent='Answer: '+it.opts[it.c[i]];}});
    else $$('.opt',el).forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove('on');if(it.c.includes(i))b.classList.add('right');else if(s.includes(i))b.classList.add('wrong');});
    const ok=itemOk(it,s), exp=$('.exp',el);exp.hidden=false;
    exp.innerHTML='<strong style="color:'+(ok?'var(--ok)':'var(--flag)')+'">'+(ok?'Correct.':'Not quite.')+'</strong> '+it.e+(info?'<div class="learned '+info.cls+'">'+info.msg+'</div>':'');
    foot.innerHTML='<button type="button" class="lnk" data-act="reread">Reread '+esc(it.o)+'</button>'+(mode.live&&!mode.drill?'<button type="button" class="lnk" data-act="retry">Try again</button>':'')+(!ok&&AI_POSSIBLE?'<button type="button" class="lnk" data-act="aiexp">Explain with '+AI_NAME()+'</button>':'')+(!ok&&CG_DISCUSS?'<button type="button" class="lnk" data-act="cgdisc">Discuss in ChatGPT</button>':'')+(!ok&&!mode.loop&&mode.live?'<button type="button" class="lnk" data-act="loop">Learn it with similar questions</button>':'');
  };
  const afterMiss=(q,s)=>{if(mode.live&&!mode.loop&&!mode.drill&&!itemOk(q,s))learnLoop(el,q,{auto:true});};
  const submit=()=>{const s=readSel();if(!complete(s)){toast(it.t==='num'?'Type a number first':it.t==='match'?'Choose a match for every statement':'Pick at least one option');return;}
    const r=record(idx,s,mode.loop?{practice:true}:null);showResult(s,r);refreshProg();if(mode.onResult)mode.onResult(itemOk(it,s));else afterMiss(it,s);};
  if(mode.live&&S.ans[idx]&&!mode.fresh){showResult(S.ans[idx].sel);}
  else if(mode.review){showResult(mode.sel||[]);}
  else{
    mark(); fill(sel);
    if(it.t!=='mc'&&mode.live)foot.innerHTML='<button type="button" class="btn sm pri" data-act="submit">'+(it.t==='cata'?'Submit selection':'Submit answer')+'</button>';
    if(typed&&mode.onSel){const tell=e=>{if(e.target.closest('.qz')===el)mode.onSel(readSel());};el.addEventListener('input',tell);el.addEventListener('change',tell);}
    if(it.t==='num'&&mode.live)$('.qnumin',el).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  }
  el.addEventListener('click',e=>{
    if(e.target.closest('.qz')!==el)return;   // a similar question shown inside this card handles its own clicks
    const a=e.target.closest('[data-act]');
    if(a){
      if(a.dataset.act==='reread')gotoObj(it.o);
      if(a.dataset.act==='cgdisc'){discussInChatGPT(it.id);return;}
      if(a.dataset.act==='loop'){learnLoop(el,it);return;}
      if(a.dataset.act==='aiexp'){aiExplainItem(it,(S.ans[idx]&&S.ans[idx].sel)||mode.sel||[],el,S.mist[idx]&&!S.mist[idx].fixed?idx:null);return;}
      if(a.dataset.act==='edit'){itemEditor(it,()=>{const nw=ITEM(it.id);if(nw)el.replaceWith(itemEl(nw,nw.id,mode));else el.remove();});return;}
      if(a.dataset.act==='retry'){el.replaceWith(itemEl(it,idx,Object.assign({},mode,{fresh:true})));}
      if(a.dataset.act==='submit')submit();
      return;
    }
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const i=+b.dataset.i;
    if(it.t==='mc'){sel=[i];}else{sel=sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i);}
    if(mode.live&&it.t==='mc'){const r=record(idx,sel,mode.loop?{practice:true}:null);showResult(sel,r);refreshProg();if(mode.onResult)mode.onResult(itemOk(it,sel));else afterMiss(it,sel);return;}
    mark();
    if(mode.onSel)mode.onSel(sel.slice());
  });
  return el;
}
/* record an answer and learn from it; returns {cls,msg} describing what the system did */
function record(idx,sel,o){
  const it=ITEM(idx), ok=itemOk(it,sel), now=Date.now();
  S.ans[idx]={sel:sel.slice(),ok:ok,at:now};
  let out=null;
  const m=S.mist[idx];
  if(o&&o.practice){logAct();save();return null;}   // a similar question in a learning loop: scored, not logged as a mistake
  if(!ok){
    const e=m||{n:0,note:''};
    e.n++; e.sel=sel.slice(); e.at=now; e.stage=0; e.due=now+MGAP[0]; e.fixed=false;
    S.mist[idx]=e;
    const q=queueObjCards(it.o);
    out={cls:'',msg:'<strong>Logged in your mistakes.</strong> This question comes back tomorrow'+(q?', and '+q+' '+esc(it.o)+' flashcard'+(q===1?' is':'s are')+' now in today\'s review':'')+'.'+(e.n>1?' You have missed it '+e.n+' times — add a note on the Mistakes page about what keeps tripping you.':'')};
  } else if(m&&!m.fixed){
    if(now>=m.due-6*36e5){ // on schedule (within 6 h of due): advance
      m.stage++;
      if(m.stage>=MGAP.length){m.fixed=true;m.fixedAt=now;out={cls:'good',msg:'<strong>Fixed.</strong> Right three times on schedule — this one has stuck.'};}
      else{m.due=now+MGAP[m.stage];out={cls:'good',msg:'<strong>Right on schedule</strong> ('+m.stage+' of 3). It comes back in '+Math.round(MGAP[m.stage]/DAY)+' days to make sure.'};}
    } else out={cls:'good',msg:'Right — but this was an early retry, so the schedule stays the same. It is due '+whenStr(m.due)+'.'};
  }
  logAct(); save();
  return out;
}
/* pull this objective's cards into today's review */
function queueObjCards(o){
  if(!o||o==='—')return 0;
  const now=Date.now(); let n=0;
  CARDS.filter(c=>c.o===o).forEach(c=>{const k=ckey(c),s=S.cards[k];
    if(!s){S.cards[k]={b:0,n:0,due:now,q:1};n++;}
    else if(s.due>now){s.due=now;s.b=Math.min(s.b,1);n++;}});
  return n;
}
function whenStr(t){const d=Math.round((midnight(new Date(t))-midnight(new Date()))/DAY);return d<=0?'today':d===1?'tomorrow':'in '+d+' days';}
function mistDue(){const now=Date.now();return Object.keys(S.mist).filter(i=>{const m=S.mist[i];return !m.fixed&&m.due<=now&&ITEM(i);});}
let shownList=[];
function refreshProg(){if($('#qzprog'))listProg(shownList);}

/* timed run */
function startRun(div,n){
  let pool=ITEMS.map(it=>it.id).filter(i=>!div||ITEM(i).d===div);
  // prefer unanswered and missed items first
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  if(n)pool=pool.slice(0,n);
  startRunIdx(pool,div?'Timed set · '+div:'Timed set',div);
}
function startRunIdx(ids,label,div){
  const pool=shuffle(ids.slice());
  run={div:div||'',label:label,idx:pool,sel:{},cur:0,secs:Math.round(pool.length*2.4*60),start:Date.now(),done:false};
  paintRun();
  stopTimer();
  tmr=setInterval(()=>{const left=runLeft();const t=$('#runT');if(t){t.textContent=fmt(left);t.classList.toggle('low',left<120);}if(left<=0)finishRun();},1000);
}
function rank(i){const m=S.mist[i];if(m&&!m.fixed&&m.due<=Date.now())return 0;const a=S.ans[i];return !a?1:(a.ok?3:2);}
function runLeft(){return Math.max(0,run.secs-Math.floor((Date.now()-run.start)/1000));}
function fmt(s){return Math.floor(s/60)+':'+pad(s%60);}
function paintRun(){
  const area=$('#qzArea'); if(!area)return;
  const i=run.idx[run.cur], it=ITEM(i);
  area.innerHTML='<div class="qzctl"><div class="runbar"><div><span class="lbl">'+esc(run.label)+'</span><div class="timer" id="runT">'+fmt(runLeft())+'</div></div>'+
    '<div class="row"><button type="button" class="btn sm" id="runPrev"'+(run.cur?'':' disabled')+'>Previous</button><button type="button" class="btn sm" id="runNext">'+(run.cur<run.idx.length-1?'Next':'Review answers')+'</button><button type="button" class="btn sm pri" id="runEnd">Finish and score</button></div></div>'+
    '<div class="dots" id="runDots">'+run.idx.map((x,k)=>'<button type="button" data-k="'+k+'" class="'+(answered(ITEM(x),run.sel[x])?'ans':'')+(k===run.cur?' cur':'')+'" aria-label="Item '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div></div><div id="runItem"></div>';
  $('#runItem').appendChild(itemEl(it,i,{sel:run.sel[i]||[],onSel:s=>{run.sel[i]=s;const d=$$('#runDots button')[run.cur];if(d)d.classList.toggle('ans',answered(it,s));}}));
  $('#runPrev').onclick=()=>{run.cur--;paintRun();};
  $('#runNext').onclick=()=>{if(run.cur<run.idx.length-1){run.cur++;paintRun();}else finishRun();};
  $('#runEnd').onclick=()=>{
    const un=run.idx.filter(x=>!answered(ITEM(x),run.sel[x])).length;
    if(un&&runLeft()>0){modal('<div class="q">Finish with '+un+' unanswered?</div><p class="small">Unanswered items score zero. On the exam there is no penalty for guessing, so answer everything.</p><div class="row"><button type="button" class="btn pri" data-a="y">Finish and score</button><button type="button" class="btn" data-a="n">Keep going</button></div>',a=>{if(a==='y')finishRun();});}
    else finishRun();
  };
  $('#runDots').onclick=e=>{const b=e.target.closest('button[data-k]');if(b){run.cur=+b.dataset.k;paintRun();}};
}
function finishRun(){
  if(!run||run.done)return; run.done=true; stopTimer();
  const used=Math.min(run.secs,Math.floor((Date.now()-run.start)/1000));
  let ok=0, logged=0, fixedN=0; const byObj={};
  run.idx.forEach(i=>{const s=run.sel[i]||[];const good=itemOk(ITEM(i),s);if(good)ok++;
    if(answered(ITEM(i),s)){const r=record(i,s);if(!good)logged++;else if(r&&S.mist[i]&&S.mist[i].fixed&&r.msg.indexOf('Fixed')>=0)fixedN++;}else{S.ans[i]={sel:[],ok:false,at:Date.now()};}
    if(!good)byObj[ITEM(i).o]=(byObj[ITEM(i).o]||0)+1;});
  save();
  const pct=Math.round(ok/run.idx.length*100);
  const area=$('#qzArea');
  area.innerHTML='<div class="qzctl"><div class="score"><b>'+ok+'/'+run.idx.length+'</b><span class="lbl">'+pct+'% correct · '+fmt(used)+' used of '+fmt(run.secs)+'</span></div>'+
    ((logged||fixedN)?'<div class="learned'+(logged?'':' good')+'" style="margin:0">'+(logged?logged+' wrong answer'+(logged===1?'':'s')+' logged on the Mistakes page; each comes back tomorrow and its objective\'s cards are in today\'s review. ':'')+(fixedN?fixedN+' earlier mistake'+(fixedN===1?'':'s')+' now fixed.':'')+'</div>':'')+
    (Object.keys(byObj).length?'<div class="row"><span class="lbl">Reread</span>'+Object.keys(byObj).map(o=>'<button type="button" class="btn sm" data-obj="'+esc(o)+'">'+esc(o)+(byObj[o]>1?' ×'+byObj[o]:'')+'</button>').join('')+'</div>':'<p class="small" style="margin:0">Clean sweep. Try a larger set or a different division.</p>')+
    '<div class="row"><button type="button" class="btn pri" id="runAgain">New timed set</button><button type="button" class="btn" id="runList">Back to the question bank</button></div></div><div id="runRev"></div>';
  run.idx.forEach(i=>$('#runRev').appendChild(itemEl(ITEM(i),i,{review:true,sel:run.sel[i]||[]})));
  const r=run; run=null;
  area.querySelector('.qzctl').addEventListener('click',e=>{const b=e.target.closest('[data-obj]');if(b)gotoObj(b.dataset.obj);});
  $('#runAgain').onclick=()=>startRun(r.div,r.idx.length);
  $('#runList').onclick=()=>practiceList();
  window.scrollTo(0,0);
}

  const lb=$('#mkLee'); if(lb)lb.onclick=()=>go('cards',{keys:lee.map(ckey)});

let IDX=null;
function buildIndex(){
  IDX=[];
  CARDS.forEach((c,i)=>IDX.push({k:'Card · '+c.d,t:strip(c.q),x:strip(c.a),type:'card',ref:i}));
  ITEMS.forEach(it=>IDX.push({k:'Question · '+it.o,t:strip(it.s),x:qPlain(it),type:'item',ref:it.id}));
  myPoints().forEach(p=>{const t=strip(md2html(p.text));IDX.push({k:'My point · '+ptLabel(p),t:t.slice(0,140),x:t,type:'point',ref:p.id});});
  NOTE_PAGES.forEach(pid=>{
    const tpl=$('#tpl-'+pid); if(!tpl)return;
    const frag=tpl.content, pname=PAGES.find(p=>p.id===pid).n;
    const heads=$$('h1,h2,h3,h4',frag);
    heads.forEach((h,hi)=>{
      let txt='',n=h.nextElementSibling;
      while(n&&!/^H[1-4]$/.test(n.tagName)){txt+=' '+n.textContent;n=n.nextElementSibling;}
      IDX.push({k:'Notes · '+pname,t:h.textContent.replace(/\s+/g,' ').trim(),x:txt.replace(/\s+/g,' ').trim(),type:'head',page:pid,ref:hi});
    });
    $$('tr',frag).forEach((tr,ri)=>{const td=$$('td',tr);if(td.length<2)return;const cap=tr.closest('table');
      IDX.push({k:(pid==='numbers'?'Number':'Table')+' · '+pname,t:td[0].textContent.trim(),x:td.slice(1).map(x=>x.textContent.trim()).join(' · '),type:'row',page:pid,ref:ri});});
  });
  IDX.forEach(r=>{r.lt=r.t.toLowerCase();r.lx=r.x.toLowerCase();});
}
function hi(s,terms){let h=esc(s);terms.forEach(t=>{if(t.length<2)return;h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');});return h;}
function snippet(x,terms){const lx=x.toLowerCase();let p=-1;terms.some(t=>{p=lx.indexOf(t);return p>=0;});if(p<0)return x.slice(0,140);const s=Math.max(0,p-50);return (s?'…':'')+x.slice(s,s+160);}
function search(q){
  if(!IDX)buildIndex();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length)return [];
  const out=[];
  IDX.forEach(r=>{let sc=0;for(const t of terms){const inT=r.lt.includes(t),inX=r.lx.includes(t);if(!inT&&!inX)return;sc+=inT?3:1;}
    if(r.lt.includes(q.toLowerCase()))sc+=4; if(r.type==='row')sc+=1; out.push([sc,r]);});
  return out.sort((a,b)=>b[0]-a[0]).slice(0,30).map(x=>x[1]);
}

     tools/chatgpt-signin.mjs); answers then stream into the page through aws/chatgpt.js.
   Website, Claude: the ARE Study System connector, added in Claude (Settings → Connectors); the "with Claude"
     buttons open claude.ai with a ready-made prompt. The connector reads and saves the same progress as this site. */

const SAMPLE_MSG={not_granted:'This page is not allowed to use your Claude. Reload the page and choose Allow when claude.ai asks.',sampling_disabled:'Claude is not available for your claude.ai account here.',
  not_declared:'Claude features are switched off on this page.',capability_disabled:'Claude is not available in this view.',capability_removed:'This Claude app is too old for this feature. Update the app or open claude.ai in a browser.',
  rate_limited:'You have reached your Claude usage limit, or sent too many requests. Try again later.',session_expired:'Sign in to claude.ai again, then try once more.',
  refused:'Claude declined this request. Try rewording it.',empty_completion:'Claude returned an empty answer. Try asking for less.',invalid_json:'Claude’s answer was not in the expected format. Try again.',
  prompt_too_large:'That is too much text for one request. Shorten the notes and try again.'};
function sampleErr(e){if(e&&e.code==='cancelled')return Object.assign(new Error('Stopped.'),{ai:true,aborted:true});const x=new Error(SAMPLE_MSG[e&&e.code]||'Claude had a problem answering. Try again in a moment.');x.ai=true;x.code=e&&e.code;return x;}
function sampleInput(system,messages){
  const turns=messages.map(m=>({role:m.role,content:String(m.content)}));
  turns[0]={role:'user',content:(system?'Instructions for this conversation: '+system+'\n\n':'')+turns[0].content};
  return turns.length===1?turns[0].content:turns;
}
function noSample(){return Object.assign(new Error(SAMPLE===undefined?'Claude is still starting. Try again in a moment.':'Claude is not available in this view.'),{ai:true});}

/* ---------- ChatGPT: status, and answers streamed from aws/chatgpt.js (one JSON object per line) ---------- */
async function cgFetch(path,opts){
  const t=await idToken(); if(!t)throw Object.assign(new Error('Sign in to the study website again.'),{ai:true});
  return fetch(CG.url+path,Object.assign({},opts,{headers:{authorization:'Bearer '+t,'content-type':'application/json'}}));
}
async function cgLoad(models){
  if(!AUTH_ON||!SESSION)return CG.st;
  if(!CG.url){try{const r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/chatgpt-config');if(r.ok)CG.url=String((await r.json()).url||'').replace(/\/+$/,'');}catch(e){}}
  if(!CG.url){CG.st=null;paintAiBtn();return null;}
  try{const r=await cgFetch('/status'+(models?'?models=1':''));CG.st=r.ok?await r.json():{error:r.status};}catch(e){CG.st={error:'offline'};}
  paintAiBtn(); return CG.st;
}
async function cgStream({system,messages,onText,signal}){
  let r;
  try{r=await cgFetch('/ask',{method:'POST',signal,body:JSON.stringify({instructions:system,messages:messages.map(m=>({role:m.role,content:String(m.content)}))})});}
  catch(e){if(e&&e.name==='AbortError')throw Object.assign(new Error('Stopped.'),{ai:true,aborted:true});if(e&&e.ai)throw e;throw Object.assign(new Error('Couldn’t reach the study server. Check your connection.'),{ai:true});}
  if(!r.ok){let j={};try{j=await r.json();}catch(e){}throw Object.assign(new Error(j.error||('The study server answered '+r.status+'.')),{ai:true});}
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', text='', end=null;
  const on=o=>{
    if(o.t==='delta'){text+=o.d;if(onText)onText(text);}
    else if(o.t==='done')end='done';
    else if(o.t==='error'){end='error';
      if(o.code==='reauth'||o.code==='not_connected'){if(CG.st)CG.st.state='reauth';paintAiBtn();}
      if(o.code==='limit'&&CG.st)CG.st.lastError='limit';
      throw Object.assign(new Error(o.message||'ChatGPT had a problem.'),{ai:true,code:o.code,text});}
  };
  try{
    for(;;){const {value,done}=await rd.read(); if(value)buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);if(l)on(JSON.parse(l));}
      if(done)break;}
    if(buf.trim())on(JSON.parse(buf.trim()));
  }catch(e){if(e&&e.ai)throw e;if(e&&e.name==='AbortError')throw Object.assign(new Error('Stopped.'),{ai:true,aborted:true,text});throw Object.assign(new Error('The answer was cut off. Try again.'),{ai:true,text});}
  if(end!=='done')throw Object.assign(new Error('The answer was cut off. Try again.'),{ai:true,text});
  return text;
}

/* one streamed request; onText(fullTextSoFar) as it arrives; returns the final text */
async function aiStream({system,messages,effort,onText,schema,signal}){
  if(PROV()==='chatgpt')return cgStream({system,messages,onText,signal});
  if(!SAMPLE)throw noSample();
  try{const r=await SAMPLE(sampleInput(system,messages),{signal,cache:false,modelTier:effort==='low'?'default':'complex',onText:onText?({text})=>onText(text):undefined});
    if(r.truncated&&schema)throw Object.assign(new Error('Claude’s answer was cut off. Ask for fewer items at a time.'),{ai:true});
    return r.text;}
  catch(e){if(e&&e.ai)throw e;throw sampleErr(e);}
}
async function aiJson(opts){
  const msgs=opts.messages.slice(); const last=msgs[msgs.length-1];
  msgs[msgs.length-1]={role:'user',content:last.content+'\n\nReply with only one JSON object that matches this JSON Schema exactly (every listed field present, no other fields):\n'+JSON.stringify(opts.schema)};
  if(PROV()==='chatgpt'){
    const t=await cgStream({system:opts.system,messages:msgs,signal:opts.signal});
    const s=t.replace(/^\s*```(?:json)?\s*/i,'').replace(/\s*```\s*$/,''), a=s.indexOf('{'), b=s.lastIndexOf('}');
    try{return JSON.parse(a>=0&&b>a?s.slice(a,b+1):s);}catch(e){throw Object.assign(new Error('ChatGPT’s answer was not in the expected format. Try again.'),{ai:true});}
  }
  if(!SAMPLE)throw noSample();
  try{return await SAMPLE.json(sampleInput(opts.system,msgs),{signal:opts.signal,cache:false,modelTier:'complex'});}
  catch(e){throw sampleErr(e);}
}

  '- "match" (drag and drop): 3–6 "statements" and 3–6 "choices"; "matches" gives the right choice text for each statement, in order (a choice may be used more than once).\n'+

/* cover every objective of one or more divisions: one request per exam section, then one review */
async function generateCoverage(divs,per,kind,fmt,topic,m,close,done){
  const jobs=[]; divs.forEach(d=>divOutline(d).forEach(sec=>{if(sec.objs.length)jobs.push({d,sec});}));
  const pack={title:(divs.length>1?'PA, PPD and PDD':divs[0])+' · every objective · '+AI_NAME(),points:[],cards:[],questions:[]}, failed=[];
  const acts=$('#genActs',m), msg=$('#genMsg',m);
  m._ctl=new AbortController();
  for(let i=0;i<jobs.length;i++){
    const {d,sec}=jobs[i];
    acts.innerHTML='<p class="small" style="margin:0">'+AI_NAME()+' is writing section '+(i+1)+' of '+jobs.length+': '+d+' · '+esc(sec.title.replace(/\s+—.*$/,''))+' · '+pack.questions.length+' questions so far</p><button type="button" class="btn" data-a="close">Stop</button>';
    const ex=styleExamples(null,d).map(q=>JSON.stringify(Object.assign({division:q.d,objective:q.o.split(' ')[1]||''},packOf(q)))).join('\n');
    const objs=sec.objs.map(o=>'- '+o.split(' ')[1]+': '+objTitle(o)).join('\n');
    const prompt='Write ARE '+d+' study material covering EVERY objective in the section "'+sec.title+'":\n'+objs+'\n\n'+
      'For each objective write '+(kind==='cards'?per+' flashcard'+(per>1?'s':'')+' and no questions':per+' practice question'+(per>1?'s':'')+(kind==='both'?' and 1 flashcard':' and no flashcards'))+
      '. Use division "'+d+'" and that objective\'s number (like "'+sec.objs[0].split(' ')[1]+'") for every item. Leave "points" empty.'+(topic?' Where it fits, lean toward: '+topic+'.':'')+'\n'+
      'Cards: a prompt and a complete answer (full lists where the exam tests lists).\n'+FORMAT_RULES+'\n'+
      (fmt==='mix'?'Use different formats across the section, and where an objective gets more than one question, write the same concept in two different formats (for example a multiple-choice scenario and a matching or fill-in-the-number question). Use "num" only for real calculations.':'Write every question in the "'+fmt+'" format.')+
      '\nMatch the style, depth and tone of these example questions from the student\'s bank (don\'t copy them):\n'+(ex||'(none)')+
      '\nTitle: "'+d+' '+sec.title.replace(/\s+—.*$/,'').slice(0,50)+'".';
    try{const j=await aiJson({system:AI_SYS,messages:[{role:'user',content:prompt}],effort:'medium',maxTokens:32000,schema:PACK_SCHEMA,signal:m._ctl.signal});
      (j.cards||[]).forEach(x=>pack.cards.push(Object.assign({},x,{division:d})));(j.questions||[]).forEach(x=>pack.questions.push(Object.assign({},x,{division:d})));}
    catch(e){if(e&&e.aborted){if(!pack.questions.length&&!pack.cards.length)return;break;}failed.push(d+' · '+sec.title.replace(/\s+—.*$/,'')+': '+(e.message||e));}
  }
  // which objectives ended up without a question (or card)
  const have=new Set(pack.questions.concat(pack.cards).map(x=>String(x.division).toUpperCase()+' '+((String(x.objective).match(/\d+\.\d+/)||[''])[0])));
  const missing=jobs.flatMap(j=>j.sec.objs).filter(o=>!have.has(o));
  if(!pack.questions.length&&!pack.cards.length){msg.innerHTML='<div class="aerr">Nothing came back. '+esc(failed[0]||'Try again.')+'</div>';acts.innerHTML='<button type="submit" class="btn pri">Try again</button><button type="button" class="btn" data-a="close">Cancel</button>';return;}
  close(); openImportWith(JSON.stringify(pack),done);
  const note=(failed.length?'<b>Not written:</b> '+failed.map(esc).join('; ')+'. ':'')+(missing.length?'<b>No question yet for:</b> '+missing.join(', ')+'. Generate those objectives on their own to fill the gaps.':'');
  if(note){const mm=$('#modal');if(mm)mm.insertAdjacentHTML('afterbegin','<div class="impv" style="margin-bottom:10px"><p class="small" style="margin:0">'+note+'</p></div>');}
  else toast('Every objective is covered · review and import');
}

/* example questions for the AI to imitate: the objective's own first, then the division, one of each format where possible */
function styleExamples(obj,div){
  const pool=ITEMS.filter(q=>!q.mine&&(obj?q.o===obj:div?q.d===div:true)), more=ITEMS.filter(q=>!q.mine&&div&&q.d===div&&!pool.includes(q));
  const any=ITEMS.filter(q=>!q.mine);   // a format the division lacks is shown from another division, for its shape
  const out=[]; ['mc','cata','num','match'].forEach(ty=>{const q=pool.find(x=>x.t===ty)||more.find(x=>x.t===ty)||any.find(x=>x.t===ty);if(q)out.push(q);});
  return out.slice(0,4);
}

/* ---------- 3b. learn it: after a miss, similar questions until two in a row are right ----------
   Each round asks about the same concept in a new situation and, where it fits, a different format.
   With ChatGPT or Claude in the page the questions are written fresh; otherwise other bank questions on the objective
   are used. Similar questions are scored but don't enter the mistake log; the missed question itself still comes back
   on its 1-, 3- and 7-day schedule until it is fixed. */
const LOOP_NEED=2;
const loopOf=id=>{S.loops=S.loops||{};return S.loops[id]=S.loops[id]||{streak:0,tries:0,done:false};};
function learnLoop(host,it,o){
  o=o||{};
  if(!host||!it)return;
  if(o.auto&&!aiReady()&&!bankSimilar(it,[]).length)return;   // nothing to offer: stay quiet after a miss
  let box=host.querySelector(':scope > .loop'); if(box)box.remove();
  box=document.createElement('div'); box.className='loop'; host.appendChild(box);
  const st=loopOf(it.id); st.streak=0; st.done=false; st.started=Date.now(); save();
  const seen=[it.id]; let round=0, ctl=null, ahead=null;
  const head=()=>'<div class="loophd"><b>Learn it</b><span class="small">'+esc(it.o)+' · '+(st.streak?st.streak+' of '+LOOP_NEED+' right in a row':LOOP_NEED+' right in a row to finish')+'</span><button type="button" class="lnk" data-loop="stop">Stop</button></div>';
  box.onclick=e=>{const b=e.target.closest('[data-loop]');if(!b)return;
    if(b.dataset.loop==='stop'){if(ctl)ctl.abort();box.remove();}
    if(b.dataset.loop==='next')next();
    if(b.dataset.loop==='connect')openClaudeSettings();};
  const fetchOne=r=>{const c=new AbortController();const p=similarQuestion(it,r,seen,c.signal);return {c,p};};
  async function next(){
    round++;
    box.innerHTML=head()+'<p class="small loopwait">Writing a similar question'+(aiReady()?' with '+AI_NAME():'')+'…</p>';
    const job=ahead||fetchOne(round); ahead=null; ctl=job.c;
    let q; try{q=await job.p;}catch(err){if(err&&err.aborted)return;box.innerHTML=head()+'<div class="aerr">'+esc(err.message||String(err))+'</div><div class="row"><button type="button" class="btn sm" data-loop="next">Try again</button></div>';round--;return;}
    if(!q){box.innerHTML=head()+'<p class="small">No more questions on '+esc(it.o)+' in the bank. <button type="button" class="lnk" data-loop="connect">Connect ChatGPT</button> (or use the claude.ai link) to get new ones written for you.</p>';return;}
    seen.push(q.id);
    box.innerHTML=head()+'<p class="small loopnote">Similar question '+round+(q.mine?' · written for you':' · from the bank')+(q.t!==it.t?' · '+qTypeName(q).toLowerCase():'')+'</p>';
    const qe=itemEl(q,q.id,{live:true,fresh:true,loop:it.id,onResult:ok=>{
      st.tries++; st.streak=ok?st.streak+1:0; st.last=Date.now();
      if(st.streak>=LOOP_NEED){st.done=true;st.doneAt=Date.now();}
      save(); box.querySelector('.loophd').outerHTML=head();
      const m=S.mist[it.id];
      box.insertAdjacentHTML('beforeend',st.done?'<div class="learned good"><strong>Learned for now.</strong> '+LOOP_NEED+' similar questions right in a row.'+(m&&!m.fixed?' The original comes back '+whenStr(m.due)+' to make sure it sticks.':'')+'</div>':
        '<div class="row loopnext"><button type="button" class="btn sm pri" data-loop="next">Next similar question</button><span class="small">'+(ok?'Good. One more like it.':'Not yet. Here comes another one on the same idea.')+'</span></div>');
      if(!st.done&&aiReady())ahead=fetchOne(round+1);   // write the next one while the explanation is read
    }});
    qe.id='loop-'+q.id; box.appendChild(qe);
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  next();
}
/* other bank questions on the same objective, not yet answered right, least recently seen first */
function bankSimilar(it,seen){
  return ITEMS.filter(q=>q.o===it.o&&!seen.includes(q.id)&&q.id!==it.id&&!(S.ans[q.id]&&S.ans[q.id].ok)).sort((a,b)=>((S.ans[a.id]||{}).at||0)-((S.ans[b.id]||{}).at||0));
}
const FORMAT_CYCLE=['mc','cata','num','match'];
async function similarQuestion(it,round,seen,signal){
  if(!aiReady()){const q=bankSimilar(it,seen)[0];return q||null;}
  const a=S.ans[it.id], prefer=FORMAT_CYCLE[(FORMAT_CYCLE.indexOf(it.t)+round)%4];
  const made=Object.values((S.custom&&S.custom.items)||{}).filter(x=>x.src===it.id).map(x=>strip(x.s).slice(0,160));
  const prompt='The student missed this practice question ('+it.o+', '+objTitle(it.o)+'):\n'+JSON.stringify(packOf(it))+
    '\nTheir answer: '+ansText(it,a?a.sel:[])+'\n\n'+
    'Write ONE new question that tests the same concept and the same trap, in a different situation (another building type, client or numbers), so they can show they really understand it. '+
    'Prefer the "'+prefer+'" format; if that format doesn\'t suit this concept, use another one. Keep the style of the original.\n'+FORMAT_RULES+
    '\nUse division "'+it.d+'" and objective "'+(it.o.split(' ')[1]||'')+'".'+(made.length?'\nDon\'t repeat these earlier similar questions:\n- '+made.join('\n- '):'');
  const j=await aiJson({system:AI_SYS,messages:[{role:'user',content:prompt}],effort:'medium',maxTokens:8000,schema:Q_SCHEMA,signal});
  const probs=[], p=packQuestion(Object.assign({},j,{division:it.d,objective:it.o}),'The similar question',probs);
  if(!p)throw Object.assign(new Error((probs[0]||'The similar question came back incomplete')+' Try again.'),{ai:true});
  const id=newUid(); customSet('items',id,Object.assign(itemFromPack(p),{at:Date.now(),src:it.id,gen:'similar'}));
  return ITEM(id);
}

/* ---------- tools Claude can use on this page ---------- */
const L=i=>String.fromCharCode(65+i);
/* a question as the tools show it, for every type, and the student's reply turned back into an answer */
function qView(q){
  const v={question_id:q.id,objective:q.o,type:qTypeName(q).toLowerCase(),question:strip(q.s)};
  if(q.t==='num')Object.assign(v,{answer_format:'a number'+(q.unit?' in '+q.unit:''),correct:numText(q,q.ans),tolerance:+q.tol||0});
  else if(q.t==='match')Object.assign(v,{statements:q.items.map((x,k)=>(k+1)+'. '+strip(x)),choices:q.opts.map((x,k)=>L(k)+'. '+x),correct:q.c.map((k,i)=>(i+1)+' → '+L(k))});
  else Object.assign(v,{options:q.opts.map((x,k)=>L(k)+'. '+x),correct:q.c.map(L)});
  v.explanation=strip(q.e); return v;
}
function selFrom(it,choices){
  choices=(choices||[]).map(x=>String(x).trim());
  if(it.t==='num'){if(numIn(choices[0])==null)throw new Error('For this question, choices is the number the student gave, e.g. ["400"].');return [choices[0]];}
  if(it.t==='match'){const s=choices.map(x=>x.toUpperCase().charCodeAt(0)-65);if(s.length!==it.items.length||s.some(k=>!(k>=0&&k<it.opts.length)))throw new Error('For this matching question, choices is one choice letter per statement, in statement order, e.g. ['+it.items.map(()=>'"A"').join(',')+'].');return s;}
  const s=[...new Set(choices.map(x=>x.toUpperCase().charCodeAt(0)-65).filter(k=>k>=0&&k<it.opts.length))];
  if(!s.length)throw new Error('choices must be option letters like ["B"].'); return s;
}
function toolRating(id,r){
  const c=CARDS.find(x=>x.id===id); if(!c)throw new Error('No flashcard with card_id '+id+'.');
  const s=S.cards[id]||{b:0,n:0,due:0}, now=Date.now(), had=!!S.cards[id];
  if(r===1){S.cardMiss[id]=(S.cardMiss[id]||0)+1;s.b=0;s.due=now+INT[0];}
  else if(r===2){s.b=Math.max(1,Math.min(s.b,2));s.due=now+DAY;}
  else{s.b=Math.min(5,(had?s.b:1)+1);s.due=now+INT[s.b];}
  s.n=(s.n||0)+1; s.r=r; S.cards[id]=s; logAct(); save();
  return 'next due '+whenStr(s.due);
}

/* ---------- sending ---------- */
async function runTool(name,input,trow){
  const t=CHAT_TOOLS.find(x=>x.name===name); const ctx={};
  trow.note=t&&t.note?t.note(input||{}):'';
  try{if(!t)throw new Error('Unknown tool '+name);const r=await t.run(input||{},ctx);trow.done=true;trow.result=r;if(t.undoable&&ctx.ids){trow.undo=t.undoable;trow.ids=ctx.ids;}
    if(['add_flashcards','add_practice_question','add_study_point','record_answer','rate_flashcard','tick_plan_task'].includes(name)&&['today','mine','cards','practice','mistakes','plan'].includes(curPage)&&name!=='open_page'){/* refresh numbers quietly */ if(curPage==='today'||curPage==='mine'||curPage==='plan')go(curPage,{keepScroll:true});}
    return r;}
  catch(e){trow.done=true;trow.error=String(e&&e.message||e);throw e;}
}
async function sendChatMsg(){
  const inp=$('#chIn'); let raw=inp.value.trim(); if(!raw||chatBusy)return;
  $('#chSlash').hidden=true; inp.value='';
  if(!CUR)newChat();
  const prompt=expandSlash(raw), ctx=ctxOn?ctxNow().text:'';
  const content=(ctx?'[What I am looking at: '+ctx+']\n\n':'')+prompt;
  CUR.view.push({role:'user',text:raw}); const am={role:'assistant',text:'',tools:[],pending:true}; CUR.view.push(am);
  if(!CUR.title)CUR.title=raw.slice(0,60); CUR.at=Date.now();
  paintChatLog(); chatBusy=new AbortController(); $('#chSend').textContent='Stop';
  const paint=()=>{const last=$('#chLog').lastElementChild;if(last){last.outerHTML='<div class="cm assistant">'+am.tools.map(toolRow).join('')+(am.text?mdRich(am.text):'<span class="small chthink">Thinking…</span>')+'</div>';$('#chLog').scrollTop=$('#chLog').scrollHeight;}};
  try{

    if(PROV()==='chatgpt')await chatViaChatGPT(content,am,paint,ag); else await chatViaPlan(content,am,paint,ag);
  }catch(e){am.error=e&&e.aborted?'':String(e&&e.message||'Something went wrong.');if(!am.text&&!am.tools.length&&!e.aborted)inp.value=raw;}

/* claude.ai-plan route: sample() runs the tool rounds and calls these page functions */
async function chatViaPlan(content,am,paint,ag){
  ag=ag||{sys:'',sources:''}; if(ag.sources)content=ag.sources+'\n\n'+content;
  if(!SAMPLE)throw new Error('Claude is not available in this view.');
  let canTools=false; try{const lim=await SAMPLE.limits();canTools=!!lim.tools;}catch(e){}
  const turns=CUR.view.slice(0,-2).filter(m=>m.text).slice(-16).map(m=>({role:m.role,content:m.role==='user'?m.text:m.text.slice(0,4000)}));
  const input=[{role:'user',content:'Instructions for this conversation: '+CHAT_SYS()+ag.sys+(canTools?'':'\n(Tools are not available in this view: answer from the context given.)')}].concat(turns).concat([{role:'user',content}]);
  const opts={signal:chatBusy.signal,onText:({text})=>{am.text=text;paint();}};
  if(canTools)opts.tools=CHAT_TOOLS.map(t=>({name:t.name,description:t.description,inputSchema:t.schema,
    execute:async(inp)=>{const tr={id:'t'+Math.random().toString(36).slice(2,8),name:t.name};am.tools.push(tr);paint();try{const r=await runTool(t.name,inp,tr);paint();return r;}catch(e){paint();throw e;}}}));
  else opts.cache=false;
  try{const r=await SAMPLE(input,opts);am.text=r.text;}
  catch(e){if(e&&e.text)am.text=e.text;throw sampleErr(e);}
}
/* ChatGPT route (website): answers stream from aws/chatgpt.js on the person's ChatGPT plan. It has no page tools,
   so it gets a snapshot of the student's status with each message instead. */
async function chatViaChatGPT(content,am,paint,ag){
  ag=ag||{sys:'',sources:''}; if(ag.sources)content=ag.sources+'\n\n'+content;
  const snap={};
  ['study_status','weak_spots'].forEach(n=>{try{snap[n]=CHAT_TOOLS.find(t=>t.name===n).run({},{});}catch(e){}});
  const sys=AI_SYS+'\n\nYou are the study tutor inside the student’s ARE Study System web page, answering on their own ChatGPT plan. You can’t change their data from here: their answers in this chat are not recorded, so for scored practice send them to the Practice, Flashcards or Mistakes pages. You may still quiz them with your own questions, one at a time, waiting for their answer before explaining. Keep replies short unless asked for more. Today is '+ds(new Date())+'.\n\nThe student’s current status (JSON): '+JSON.stringify(snap).slice(0,6000)+ag.sys;
  const turns=CUR.view.slice(0,-2).filter(m=>m.text).slice(-16).map(m=>({role:m.role,content:m.role==='user'?m.text:m.text.slice(0,4000)}));
  try{am.text=await cgStream({system:sys,messages:turns.concat([{role:'user',content}]),signal:chatBusy.signal,onText:t=>{am.text=t;paint();}});}
  catch(e){if(e&&e.text)am.text=e.text;throw e;}
}

   Library: each person uploads their own documents (PDF, Word, text). The browser extracts the text, cuts it into
   passages and uploads them to the account (aws/connector.js, /library); the AI searches them to answer, quiz and
   draft cards and questions. Agents: named instructions plus which documents to use, kept in S.agents, picked in
   the chat panel. The Claude connector can read both too. */
const LIB={docs:null,used:0,limit:15e6,busy:'',err:''};
const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs', PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs';
const MAMMOTH_URL='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.13.0/mammoth.browser.min.js';
const LIB_TYPES='.pdf,.docx,.txt,.md,.markdown,.html,.htm,.csv';
async function libApi(path,opts){
  const t=await idToken(); if(!t)throw new Error('Sign in to the study website again.');
  let r;
  try{r=await fetch(AC.apiUrl.replace(/\/+$/,'')+path,Object.assign({},opts,{headers:{authorization:'Bearer '+t,'content-type':'application/json'}}));}
  catch(e){throw new Error('Couldn’t reach the library service. Check your connection; if this keeps happening, the AWS stack may need the My library update (aws/SETUP.md, “My library and my agents”).');}
  let j={}; try{j=await r.json();}catch(e){}
  if(r.status===404&&j.error==='not found')throw new Error('My library isn’t switched on yet: the site admin needs to update the AWS stack with the latest aws/are-accounts.yaml (see aws/SETUP.md, “My library and my agents”).');
  if(!r.ok)throw new Error(j.error||('The study server answered '+r.status+'.'));
  return j;
}
async function libLoad(){try{const j=await libApi('/library');LIB.docs=j.docs||[];LIB.used=j.used||0;LIB.limit=j.limit||LIB.limit;LIB.err='';}catch(e){LIB.err=e.message;if(!LIB.docs)LIB.docs=null;}return LIB.docs;}
async function docText(id,topic){
  if(topic){const j=await libApi('/library/search?q='+encodeURIComponent(topic)+'&docs='+encodeURIComponent(id)+'&k=12');return j.results.map(x=>(x.page?'[p. '+x.page+'] ':'')+x.text).join('\n\n');}
  const j=await libApi('/library/chunks?id='+encodeURIComponent(id)+'&from=0&n=24');return j.chunks.map(x=>(x.p?'[p. '+x.p+'] ':'')+x.t).join('\n\n');
}

/* ---------- reading files in the browser ---------- */
let PDFJS=null;
async function pdfLib(){
  if(PDFJS)return PDFJS;
  const lib=await import(PDFJS_URL);
  // browsers refuse a worker script from another site, so pdf.js runs on the page instead (its built-in fallback);
  // pages are read one at a time, so the page stays responsive between them
  globalThis.pdfjsWorker=await import(PDFJS_WORKER);
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  return PDFJS=lib;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Could not load '+src));document.head.appendChild(s);});}
async function readFile(file,onProg){
  const ext=(file.name.match(/\.([a-z0-9]+)$/i)||['',''])[1].toLowerCase();
  if(ext==='pdf'){
    const lib=await pdfLib(), doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, pages=[];
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i), tc=await pg.getTextContent();pages.push({p:i,text:tc.items.map(it=>(it.str||'')+(it.hasEOL?'\n':' ')).join('')});if(onProg)onProg(i/doc.numPages);}
    return {type:'pdf',pages,count:doc.numPages};
  }
  if(ext==='docx'){
    if(!window.mammoth)await loadScript(MAMMOTH_URL);
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {type:'docx',pages:[{p:null,text:r.value}],count:null};
  }
  if(['html','htm'].includes(ext)){const d=new DOMParser().parseFromString(await file.text(),'text/html');return {type:'html',pages:[{p:null,text:d.body?d.body.innerText||d.body.textContent:''}],count:null};}
  if(['txt','md','markdown','csv'].includes(ext))return {type:ext,pages:[{p:null,text:await file.text()}],count:null};
  throw new Error('Can’t read .'+ext+' files. Use PDF, Word (.docx), text or Markdown.');
}
/* upload the original to S3 with its signed link (XHR, for progress); the signed size must match the file */
function putFile(url,file,onProg){
  return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',url);
    x.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(e.loaded/e.total);};
    x.onload=()=>x.status>=200&&x.status<300?ok():no(new Error('the file store answered '+x.status));
    x.onerror=()=>no(new Error('couldn’t reach the file store'));x.send(file);});
}
async function openOriginal(d){
  const w=window.open('','_blank');   // opened now, while the click counts, so pop-up blockers allow it
  try{const j=await libApi('/library/file?id='+encodeURIComponent(d.id));if(w){w.opener=null;w.location.href=j.url;}else location.href=j.url;}
  catch(e){if(w)w.close();toast(e.message);}
}
/* passages of up to ~1,400 characters that never cross a page, so every passage keeps its page number */
function chunkPages(pages){
  const out=[], MAX=1400;
  pages.forEach(pg=>{
    const paras=String(pg.text||'').replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
    let cur='';
    const push=()=>{if(cur.trim())out.push({t:cur.trim(),p:pg.p});cur='';};
    paras.forEach(para=>{
      if(para.length>MAX){push();(para.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[para]).forEach(s=>{if((cur+s).length>MAX)push();if(s.length>MAX){for(let i=0;i<s.length;i+=MAX)out.push({t:s.slice(i,i+MAX).trim(),p:pg.p});}else cur+=s;});push();}
      else if(cur&&(cur.length+para.length+1)>MAX){push();cur=para;}
      else cur+=(cur?'\n':'')+para;
    });
    push();
  });
  return out.filter(c=>c.t.length>1);
}
async function libUpload(files,box){
  for(const file of files){
    try{
      if(file.size>60e6)throw new Error(file.name+' is larger than 60 MB.');
      LIB.busy='Reading '+file.name+'…'; paintLibrary(box);
      let r;
      try{r=await readFile(file,f=>{LIB.busy='Reading '+file.name+'… '+Math.round(f*100)+'%';const s=$('#libBusy');if(s)s.textContent=LIB.busy;});}
      catch(e){if(!/^Can’t read/.test(e.message))throw e;r={type:(file.name.match(/\.([a-z0-9]+)$/i)||['','file'])[1].toLowerCase().slice(0,10),pages:[],count:null};}   // other kinds of file are kept as files only
      const chunks=chunkPages(r.pages), chars=chunks.reduce((n,c)=>n+c.t.length,0);
      const thin=r.type==='pdf'&&r.count>2&&chars/r.count<150;
      const parts=[]; let cur=[], size=0;
      chunks.forEach(c=>{const s=JSON.stringify(c).length;if(cur.length&&size+s>240000){parts.push(cur);cur=[];size=0;}cur.push(c);size+=s;}); if(cur.length)parts.push(cur);
      if(!parts.length)parts.push([]);
      if(parts.length>80)throw new Error(file.name+' is too long to add. Split it into smaller files.');
      const id='d-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
      const busy=t=>{LIB.busy=t;const s=$('#libBusy');if(s)s.textContent=t;};
      // 1. the original file, straight to the private file store
      let kept=false, why='';
      try{const u=await libApi('/library/file-url',{method:'POST',body:JSON.stringify({id,name:file.name,size:file.size})});
        await putFile(u.url,file,f=>busy('Saving the original of '+file.name+'… '+Math.round(f*100)+'%')); kept=true;}
      catch(e){why=e.message||String(e);}
      if(!chars&&!kept)throw new Error(file.name+' has no text the site can read, and the original couldn’t be saved ('+why+'). If it’s a scanned PDF, it needs text recognition (OCR) first.');
      // 2. the text, in parts
      for(let i=0;i<parts.length;i++){
        busy('Saving the text of '+file.name+'… '+Math.round(i/parts.length*100)+'%');
        await libApi('/library/upload',{method:'POST',body:JSON.stringify({id,name:file.name,type:r.type,pages:r.count,chars,chunkCount:chunks.length,part:i,parts:parts.length,chunks:parts[i],file:kept?{type:file.type||''}:null})});
      }
      toast('Added '+file.name+(chars?'':' · file only, no searchable text')+(thin&&chars?' · some pages had little text (scanned?)':''));
      if(!chars)LIB.err=file.name+' was saved so you can open it, but it has no text the AI can read (probably scanned pages). Text recognition (OCR) would make it searchable.';
      else if(thin)LIB.err=file.name+': some pages had very little text. If parts are scanned images, those parts can’t be searched.';
      if(!kept&&chars)LIB.err=(LIB.err?LIB.err+' ':'')+file.name+': the text was saved, but not the original file ('+why+').';
    }catch(e){LIB.err=e.message||String(e);}
  }
  LIB.busy=''; await libLoad(); paintLibrary(box); paintAgents($('#agBox'));
}
const mb=n=>n>=1e6?(n/1e6).toFixed(n>=1e8?0:1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
const kb=n=>n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' K':String(n);
function paintLibrary(box){
  box=box||$('#libBox'); if(!box)return;
  const head='<h2 class="s">My library <span class="pill">'+(LIB.docs?LIB.docs.filter(d=>d.done).length:'·')+'</span></h2>';
  if(!AUTH_ON){box.innerHTML=head+'<p class="small" style="color:var(--ink-3)">Uploading documents works on the study website, signed in to your account.</p>';return;}
  if(LIB.docs===null&&!LIB.err){box.innerHTML=head+'<p class="small">Loading your documents…</p>';libLoad().then(()=>paintLibrary(box));return;}
  const docs=(LIB.docs||[]).slice().sort((a,b)=>b.at-a.at);
  box.innerHTML=head+'<p class="small">Upload your own books, notes and handouts (PDF, Word, text). The AI reads them to answer your questions, quiz you, and draft cards and questions, and cites the page. The original file is kept too, so you can open it on any device. Only you can see them.</p>'+
    '<div class="libdrop" id="libDrop"><button type="button" class="btn pri" data-lib="pick"'+(LIB.busy?' disabled':'')+'>Upload documents</button><span class="small">or drop files here · PDF, .docx, .txt, .md are read by the AI; other files are kept to open</span><input type="file" id="libFile" multiple accept="'+LIB_TYPES+',image/*,.pptx,.xlsx" hidden></div>'+
    (LIB.busy?'<p class="small" id="libBusy">'+esc(LIB.busy)+'</p>':'')+(LIB.err?'<div class="aerr">'+esc(LIB.err)+' <button type="button" class="lnk" data-lib="clearerr">OK</button></div>':'')+
    (docs.length?docs.map(d=>'<div class="mrow"><span class="obj">'+esc((d.type||'doc').toUpperCase())+'</span><span class="mt">'+esc(d.name)+' <span style="color:var(--ink-3)">· '+(d.pages?d.pages+' pages · ':'')+(d.chars?kb(d.chars)+' characters':'no searchable text')+(d.file?' · '+mb(d.file.size)+' file':' · text only')+(d.done?'':' · upload unfinished')+'</span></span><span class="mb">'+
      (d.file?'<button type="button" class="lnk" data-libopen="'+esc(d.id)+'">Open</button>':'')+
      (d.done&&d.chars?'<button type="button" class="lnk" data-libask="'+esc(d.id)+'">Ask about it</button><button type="button" class="lnk" data-libgen="'+esc(d.id)+'">Make cards &amp; questions</button>':'')+'<button type="button" class="lnk" data-libdel="'+esc(d.id)+'">Delete</button></span></div>').join(''):'<p class="small" style="color:var(--ink-3)">No documents yet.</p>')+
    (docs.length?'<p class="small" style="color:var(--ink-3)">Using '+kb(LIB.used)+' of '+kb(LIB.limit)+' characters.</p>':'');
  const inp=$('#libFile',box), drop=$('#libDrop',box);
  inp.onchange=()=>{if(inp.files.length)libUpload([...inp.files],box);};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('on');}; drop.ondragleave=()=>drop.classList.remove('on');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');if(!LIB.busy&&e.dataTransfer.files.length)libUpload([...e.dataTransfer.files],box);};
  box.onclick=async e=>{
    const t=e.target.closest('[data-lib],[data-libask],[data-libgen],[data-libdel],[data-libdelyes],[data-libopen]'); if(!t)return;
    const doc=id=>(LIB.docs||[]).find(d=>d.id===id);
    if(t.dataset.libopen){const d=doc(t.dataset.libopen);if(d)openOriginal(d);return;}
    if(t.dataset.lib==='pick')inp.click();
    if(t.dataset.lib==='clearerr'){LIB.err='';paintLibrary(box);}
    if(t.dataset.libask){const d=doc(t.dataset.libask);if(d)chatAboutDoc(d);}
    if(t.dataset.libgen){const d=doc(t.dataset.libgen);if(d)openGenerate({doc:{id:d.id,name:d.name}},()=>go('mine',{keepScroll:true}));}
    if(t.dataset.libdel){const d=doc(t.dataset.libdel);t.parentNode.innerHTML='<span class="small">Delete “'+esc(d.name)+'”?</span> <button type="button" class="lnk" data-libdelyes="'+esc(d.id)+'">Delete</button><button type="button" class="lnk" data-lib="cancel">Keep</button>';}
    if(t.dataset.lib==='cancel')paintLibrary(box);
    if(t.dataset.libdelyes){try{await libApi('/library/doc?id='+encodeURIComponent(t.dataset.libdelyes),{method:'DELETE'});
      Object.values(S.agents||{}).forEach(a=>{if(Array.isArray(a.docs))a.docs=a.docs.filter(x=>x!==t.dataset.libdelyes);});save();toast('Deleted');}catch(err){LIB.err=err.message;}
      await libLoad();paintLibrary(box);paintAgents($('#agBox'));}
  };
}
