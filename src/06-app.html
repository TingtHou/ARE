   An entry with a base id overrides or hides that item; new entries use "u…" ids. */

function rebuildMaterial(){
  const C=(S&&S.custom)||{}, cc=C.cards||{}, ci=C.items||{};
  const CK=['d','o','q','a','qraw','araw'], IK=['d','o','t','s','opts','c','e','sraw','eraw','ans','tol','unit','items'];
  const pickk=(o,ks)=>{const r={};ks.forEach(k=>{if(o[k]!=null)r[k]=o[k];});return r;};

  Object.keys(cc).filter(k=>!BASE_CARDS.some(b=>b.id===k)&&!cc[k].hidden&&cc[k].q&&cc[k].a).forEach(k=>CARDS.push(Object.assign({o:'—',d:'My cards'},pickk(cc[k],CK),{id:k,mine:true})));

  Object.keys(ci).filter(k=>!BASE_ITEMS.some(b=>b.id===k)&&!ci[k].hidden).forEach(k=>ITEMS.push(Object.assign({t:'mc',e:''},pickk(ci[k],IK),{id:k,mine:true})));

/* small markup: blank line = paragraph, "- " bullets, "1. " numbered, **bold**, *italic* */
function inlineMd(s){return esc(s).replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,'$1<em>$2</em>');}
function md2html(t){
  return String(t||'').replace(/\r/g,'').split(/\n\s*\n/).map(b=>{
    const ls=b.split('\n').filter(x=>x.trim()); if(!ls.length)return '';
    if(ls.every(l=>/^\s*[-•]\s+/.test(l)))return '<ul>'+ls.map(l=>'<li>'+inlineMd(l.replace(/^\s*[-•]\s+/,''))+'</li>').join('')+'</ul>';
    if(ls.every(l=>/^\s*\d+[.)]\s+/.test(l)))return '<ol>'+ls.map(l=>'<li>'+inlineMd(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>';
    return '<p>'+ls.map(inlineMd).join('<br>')+'</p>';
  }).join('');
}
function html2md(h){
  const d=document.createElement('div'); d.innerHTML=h||''; const out=[];
  const inl=n=>{let s='';n.childNodes.forEach(c=>{if(c.nodeType===3){s+=c.textContent;return;}if(c.nodeType!==1)return;const t=c.tagName,x=inl(c);
    if(t==='STRONG'||t==='B')s+='**'+x+'**';else if(t==='EM'||t==='I')s+='*'+x+'*';else if(t==='BR')s+='\n';else if(t==='SUB'||t==='SUP')s+='<'+t.toLowerCase()+'>'+x+'</'+t.toLowerCase()+'>';else s+=x;});return s;};
  d.childNodes.forEach(n=>{
    if(n.nodeType===3){if(n.textContent.trim())out.push(n.textContent.trim());return;}
    if(n.nodeType!==1)return;
    const tb=n.tagName==='TABLE'?n:$('table',n);
    if(n.tagName==='UL'||n.tagName==='OL')out.push($$('li',n).map((li,i)=>(n.tagName==='UL'?'- ':(i+1)+'. ')+inl(li).trim()).join('\n'));
    else if(n.tagName==='FIGURE'){const im=$('img',n);if(im)out.push('![' +(im.getAttribute('alt')||'Figure')+']('+im.getAttribute('src')+')');}
    else if(tb){const rows=$$('tr',tb).map(r=>'| '+$$('th,td',r).map(c=>inl(c).trim().replace(/\|/g,'/')).join(' | ')+' |');
      if(rows.length)out.push((n.tagName==='DETAILS'?'Figure as text:\n':'')+[rows[0],rows[0].replace(/[^|]+/g,'---')].concat(rows.slice(1)).join('\n'));}
    else out.push(inl(n).trim());
  });
  return out.join('\n\n');
}
async function loadNotes(){
  const got=await Promise.all(NOTE_PAGES.map(id=>fetch('material/notes/'+id+'.html',{cache:'no-cache'}).then(r=>r.ok?r.text():null).catch(()=>null)));
  NOTE_PAGES.forEach((id,i)=>{
    const t=document.createElement('template'); t.id='tpl-'+id;
    t.innerHTML=got[i]!=null?got[i]:'<h1 class="t">This page did not load</h1><p class="lede">material/notes/'+id+'.html could not be read. If you opened the file straight from your computer, open the published link instead; browsers block a local page from reading its own folder.</p>';
    if(got[i]==null)MATERR.push('material/notes/'+id+'.html did not load');
    document.body.appendChild(t);
  });
}
const numIn=v=>{const n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,''));return isFinite(n)?n:null;};
const itemOk=(it,sel)=>{sel=sel||[];
  if(it.t==='num'){const v=numIn(sel[0]);return v!=null&&Math.abs(v-parseFloat(it.ans))<=(+it.tol||0)+1e-9;}
  if(it.t==='match')return sel.length===it.c.length&&it.c.every((k,i)=>+sel[i]===k);
  return sel.length===it.c.length&&sel.every(i=>it.c.includes(i));};
const answered=(it,s)=>{s=s||[];return it.t==='num'?numIn(s[0])!=null:it.t==='match'?s.some(v=>+v>=0):s.length>0;};
const qTypeName=it=>({cata:'Check all that apply',num:'Fill in the number',match:'Drag and drop · match'})[it.t]||'Multiple choice';
const numText=(it,v)=>String(v)+(it.unit?(it.unit==='dollars'?' dollars':' '+it.unit):'');
/* what was answered, in words: options for mc/cata, the number, or each statement with its choice */
function ansText(it,sel){
  sel=sel||[];
  if(it.t==='num')return sel.length&&String(sel[0]).trim()!==''?numText(it,sel[0]):'(no answer)';
  if(it.t==='match')return sel.length?it.items.map((x,i)=>'“'+strip(x).slice(0,60)+(strip(x).length>60?'…':'')+'” → '+(sel[i]!=null&&+sel[i]>=0&&it.opts[sel[i]]!=null?it.opts[sel[i]]:'—')).join('; '):'(no answer)';
  return sel.length?sel.map(k=>it.opts[k]).join('; '):'(no answer)';
}
const rightText=it=>it.t==='num'?numText(it,it.ans):ansText(it,it.c);
/* the whole question as plain text, for search and for the AI */
const qPlain=it=>it.t==='num'?'(type a number'+(it.unit?' in '+it.unit:'')+')':it.t==='match'?'Statements: '+it.items.map((x,i)=>(i+1)+'. '+strip(x)).join(' ')+' Choices: '+it.opts.map((x,i)=>String.fromCharCode(65+i)+'. '+x).join(' '):it.opts.map((x,i)=>String.fromCharCode(65+i)+'. '+x).join(' ');

/* backfill: any wrong answer without a log entry becomes a mistake due now */
function normalize(){
  S.mist=S.mist||{}; S.cardMiss=S.cardMiss||{};

  const legacy={}; BASE_CARDS.forEach(c=>{legacy[c.d+'|'+c.q.slice(0,60)]=c.id;});

}

function setSync(t){const el=$('#sync');el.classList.toggle('on',synced);$('span',el).textContent=t||(synced?'Synced':'This device');}
/* Autosave: every change is written to this browser at once; the account copy follows ~1 s later.
   Unsent changes are retried (30 s, then up to every 5 min), sent as soon as the connection
   returns, and sent immediately when the tab is hidden or closed. */
let dirty=false, pushing=false, retryT=null, retryGap=30000;
let SYNCERR=null;/* keep the last failed sync call so the account dialog can say exactly what went wrong */function noteSyncErr(method,status,text){  SYNCERR={at:Date.now(),method,status,text:String(text||'').slice(0,300)};  try{console.warn('ARE sync failed',SYNCERR);}catch(_){}  const e=new Error('sync '+status);e.sync=true;return e;}function syncErrText(){  if(!SYNCERR)return '';const s=SYNCERR;  const why=s.status===0?'The browser could not reach the progress service (blocked or no connection).':s.status===-1?'The sign-in could not be refreshed. Sign out and sign in again.':s.status===401||s.status===403?'The progress service did not accept your sign-in ('+s.status+').':s.status>=500?'The progress service had an error ('+s.status+').':'The progress service answered '+s.status+'.';  return why+' '+s.method+' at '+new Date(s.at).toLocaleTimeString()+(s.text?' — '+s.text:'');}
function save(){
  S.at=Date.now(); lsSave(); dirty=true;
  clearTimeout(saveT);
  saveT=setTimeout(push,900);
}
const canPush=()=>AUTH_ON?!!SESSION:!!(db&&uid);
async function push(opts){
  clearTimeout(saveT); clearTimeout(retryT);
  if(!dirty)return;
  if(!canPush()){setSync();return;}
  if(pushing){saveT=setTimeout(push,900);return;}
  pushing=true; const at=S.at, body=JSON.stringify(S);
  try{
    if(AUTH_ON){
      const t=await idToken(); if(!t)throw noteSyncErr('PUT',-1,'could not refresh the sign-in');
      const r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/progress',{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body,keepalive:!!(opts&&opts.leaving)&&body.length<60000});
      if(!r.ok){const txt=await r.text().catch(()=>'');throw noteSyncErr('PUT',r.status,txt);}
    } else {
      await db.doc(dbPath(PROF.cur)).set({v:2,data:S});
    }
    if(S.at===at)dirty=false;           // a newer change made meanwhile stays queued
    synced=true; retryGap=30000;
    if(!(opts&&opts.leaving)){setSync('Saved');setTimeout(()=>setSync(),1800);}
  }catch(e){
    if(AUTH_ON&&!e.sync)noteSyncErr('PUT',0,String(e&&e.message||e)); synced=false; setSync(AUTH_ON?'Offline · saved here':'This device only');
    retryT=setTimeout(push,retryGap); retryGap=Math.min(retryGap*2,300000);
  }finally{pushing=false; if(dirty&&S.at!==at)saveT=setTimeout(push,900);}
}
window.addEventListener('online',()=>{if(dirty)push();});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(dirty)push({leaving:true});}
  else if(!dirty&&canPush()&&document.getElementById('shell')&&!$('#shell').hidden)pullRemote(); // back to the tab: pick up work from other devices

function loadLocal(){S=blankState();const l=lsLoad();if(l&&l.v===2)S=Object.assign(S,l);normalize();}
/* pull the signed-in account's copy of the current profile, keep whichever is newer */
async function pullRemote(){
  if(AUTH_ON){
    if(!SESSION||SESSION.offline){synced=false;setSync('Offline · saved here');return;}
    try{
      const rem=await api('GET');
      if(rem&&rem.v===2&&(rem.at||0)>(S.at||0)){S=Object.assign(blankState(),rem);normalize();lsSave();route(true);}
      else if(S.at&&(!rem||!rem.at||rem.at<S.at)){dirty=true;push();}
      synced=true; setSync();
      if(!rem&&!S.at&&legacyProfiles().length)openAccount('Welcome. This browser has study progress from before accounts — you can bring it into your account below.');
    }catch(e){synced=false;setSync('Offline · saved here');}
    return;
  }
  if(!db||!uid)return;

    const snap=await db.doc(dbPath(PROF.cur)).get();

    else if(S.at&&(!rem||!rem.data||!rem.data.at||rem.data.at<S.at)){dirty=true;push();}
    synced=true; setSync();
  }catch(e){synced=false;setSync('This device only');}
}
async function boot(){
  if(AUTH_ON){
    $('#shell').hidden=true;
    buildNav(); await loadNotes();
    const ok=await resumeSession();
    if(ok)enterApp(); else showAuth('signin');
    return;
  }
  profLoad(); loadLocal();
  buildNav(); paintProf();
  await loadNotes();
  route(); paintPreview();
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d; uid=id;
    await pullRemote();
  }catch(e){synced=false;setSync('This device only');}
}

/* ---------- plan helpers ---------- */
function curWeek(){const t=midnight(new Date());if(!PLAN.length||t<pdate(PLAN[0].from))return 0;for(const w of PLAN){if(t<=pdate(w.to))return w.w;}return PLAN.length+1;}
const taskId=(w,i)=>(PLAN===BASE_PLAN?'w':'cw')+w+'t'+i;   // own-plan ticks are kept apart from standard-plan ticks
const isExamTask=t=>/^(SATURDAY|TUESDAY|THURSDAY)/.test(t);
function planTotals(){let t=0;PLAN.forEach(w=>t+=w.t.length);const re=PLAN===BASE_PLAN?/^w\d/:/^cw\d/;return {total:t,done:Object.keys(S.plan).filter(k=>re.test(k)).length};}

/* ---------- card helpers ---------- */
function cardPool(){
  const d=S.deck;
  if(!d)return CARDS;
  if(d.startsWith('div:')){const v=d.slice(4);return CARDS.filter(c=>cdiv(c)===v);}
  return CARDS.filter(c=>c.d===d);
}
function cstate(c){return S.cards[ckey(c)]||null;}
function cardCounts(list){
  const now=Date.now();let nw=0,due=0,strong=0,learn=0;
  list.forEach(c=>{const s=cstate(c);if(!s){nw++;return;}if(s.due<=now)due++;if(s.b>=3)strong++;else learn++;});
  return {n:list.length,nw,due,strong,learn};
}

/* Last 28 days in the sidebar: a 4-week calendar, Monday first, today outlined */
function paintRailHeat(){
  const el=$('#railHeat'); if(!el)return;
  const t=midnight(new Date()), key=d=>ds(d), n=d=>S.log[key(d)]||0;
  // grid ends on this week's Sunday so columns are weekdays; days after today stay blank
  const endSun=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(6-(t.getDay()+6)%7));
  const first=new Date(endSun.getFullYear(),endSun.getMonth(),endSun.getDate()-27);
  let cells='',total=0,active=0;
  for(let i=0;i<28;i++){
    const d=new Date(first.getFullYear(),first.getMonth(),first.getDate()+i), fut=d>t, c=fut?0:n(d);
    if(!fut){total+=c;if(c)active++;}
    cells+='<i class="'+(fut?'':c?(c<10?'l1':c<30?'l2':'l3'):'')+(+d===+t?' t':'')+'"'+(fut?' style="opacity:.35"':'')+' title="'+fmtDate(d)+': '+(fut?'—':c+' '+(c===1?'action':'actions'))+'"></i>';
  }
  let streak=0; for(let i=n(t)?0:1;i<400&&n(new Date(t.getFullYear(),t.getMonth(),t.getDate()-i));i++)streak++;
  el.innerHTML='<h4>Last 28 days</h4><div class="rhdow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="rhgrid">'+cells+'</div>'+
    '<div class="rhsum">'+(streak?'<b>'+streak+'-day streak</b>':'<b>No streak yet</b> — study today to start one')+'<br>'+active+' active day'+(active===1?'':'s')+' · '+total+' study action'+(total===1?'':'s')+'</div>';
}

/* exam dates: the plan's date unless this person set their own; sorted so "next" follows the real order */
function myExams(){
  const o=S.examDates||{};
  return EXAMS.map(e=>{const own=o[e.d]&&!isNaN(pdate(o[e.d]))?pdate(o[e.d]):null,dt=own||e.date;
    return Object.assign({},e,{date:dt,plan:e.date,label:fmtDate(dt),edited:!!own});}).sort((a,b)=>a.date-b.date);
}
function stat(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>';}

/* objective titles from the objective map */
let OBJT=null;
function objTitle(o){
  if(!OBJT){OBJT={};const tpl=$('#tpl-objectives');let div=null;
    $$('h2.s,tr',tpl.content).forEach(el=>{if(el.tagName==='H2'){const p=$('.pill',el);div=p?p.textContent.trim():null;return;}const td=$$('td',el);if(td.length===3&&div)OBJT[div+' '+td[0].textContent.trim()]=td[1].textContent.replace(/(Narrowed|Clarified) Apr 2026/,'').trim();});}
  return OBJT[o]||(o==='—'?'Source corrections':o);
}

/* ================= DIVISION: everything for one division on one page (#div-pa … #div-pjm) ================= */
/* sections and objectives of a division, read from the objective map */
function divOutline(d){
  const tpl=$('#tpl-objectives'), out=[]; let on=false, sec=null;
  if(!tpl)return out;
  $$('h2.s,tr',tpl.content).forEach(el=>{
    if(el.tagName==='H2'){const p=$('.pill',el);on=!!p&&p.textContent.trim()===d;sec=null;return;}
    if(!on)return;
    const td=$$('td',el);
    if(td.length===1){sec={title:td[0].textContent.replace(/\s+/g,' ').trim(),objs:[]};out.push(sec);return;}
    if(td.length===3){if(!sec){sec={title:'',objs:[]};out.push(sec);}sec.objs.push(d+' '+td[0].textContent.trim());}
  });
  return out;
}
function initDivision(d){
  const t=midnight(new Date()), e=myExams().find(x=>x.d===d)||{n:d,items:'',date:t};
  const cards=CARDS.filter(c=>cdiv(c)===d), cc=cardCounts(cards), its=ITEMS.filter(i=>i.d===d);
  let ans=0,ok=0; its.forEach(i=>{const a=S.ans[i.id];if(a){ans++;if(a.ok)ok++;}});
  const open=Object.keys(S.mist).filter(i=>{const it=ITEM(i);return it&&it.d===d&&!S.mist[i].fixed;}), due=mistDue().filter(i=>ITEM(i).d===d);
  const ready=Math.round(((cc.n?cc.strong/cc.n:0)*0.5+(its.length?ok/its.length:0)*0.5)*100);
  const days=Math.round((midnight(e.date)-t)/DAY), pass=!!S.passed[d];
  const pts=myPoints().filter(p=>p.div===d), myC=cards.filter(c=>c.mine).length, myQ=its.filter(q=>q.mine).length;
  const wkRe=new RegExp('\\b'+d+'\\b'), cw=curWeek(), weeks=PLAN.filter(w=>wkRe.test([w.g,w.exam||''].concat(w.t).join(' ')));
  const row=o=>{
    const oc=cards.filter(c=>c.o===o), oi=its.filter(i=>i.o===o), occ=cardCounts(oc);
    let a=0,k=0,miss=0; oi.forEach(i=>{const s=S.ans[i.id];if(s){a++;if(s.ok)k++;else miss++;}});
    const shaky=oc.filter(c=>{const s=cstate(c);return s&&s.b<=1;}).length, np=pts.filter(p=>p.obj===o.split(' ')[1]).length;
    const flag=miss||shaky?' weak':'';
    return '<div class="dvrow'+flag+'"><span class="obj">'+esc(o)+'</span><span class="dvt"><b>'+esc(objTitle(o))+'</b><span class="small">'+
      [oc.length?occ.strong+'/'+oc.length+' cards strong':'no cards',oi.length?a+'/'+oi.length+' questions answered'+(a?' · '+k+' right':''):'no questions',miss?miss+' missed':'',shaky?shaky+' shaky':'',np?np+' of my points':''].filter(Boolean).join(' · ')+'</span></span>'+
      '<span class="mb"><button type="button" class="lnk" data-onotes="'+esc(o)+'">Notes</button>'+(oc.length?'<button type="button" class="lnk" data-ocards="'+esc(o)+'">Cards</button>':'')+(oi.length?'<button type="button" class="lnk" data-oq="'+esc(o)+'">Questions</button>':'')+'</span></div>';
  };
  const outline=divOutline(d), listed=new Set(outline.flatMap(s=>s.objs));
  const extra=[...new Set(cards.map(c=>c.o).concat(its.map(i=>i.o)))].filter(o=>odiv(o)===d&&!listed.has(o)).sort();
  view.innerHTML='<div class="eyebrow">Division · '+esc(e.n)+'</div><h1 class="t"><span class="pill '+d.toLowerCase()+'" style="font-size:.55em;vertical-align:middle">'+d+'</span> '+esc(e.n)+'</h1>'+
    '<p class="lede">'+(pass?'Passed.':days<0?'The exam date has passed. Mark it passed on Today, or set a new date.':days+' day'+(days===1?'':'s')+' to the exam on '+esc(fmtDate(e.date,{weekday:'long',day:'numeric',month:'long'}))+'.')+(e.items?' '+e.items+' items.':'')+' Readiness '+ready+'%.</p>'+
    '<div class="row dvacts"><button type="button" class="btn pri" data-dact="cards">'+(cc.due?'Review '+cc.due+' due '+d+' card'+(cc.due===1?'':'s'):'Study '+d+' flashcards')+'</button><button type="button" class="btn" data-dact="practice">Practice '+d+' questions</button><button type="button" class="btn" data-dact="timed">Timed set of 10</button><button type="button" class="btn" data-dact="mistakes"'+(open.length?'':' disabled')+'>'+(due.length?due.length+' due mistake'+(due.length===1?'':'s'):open.length?open.length+' mistake'+(open.length===1?'':'s')+' scheduled':'No mistakes')+'</button><button type="button" class="btn" data-dact="notes">Read the '+d+' notes</button></div>'+
    '<div class="stats dvstats">'+stat(cc.due,'cards due')+stat(cc.nw,'new cards')+stat(cc.strong+'/'+cc.n,'cards strong')+stat(ans+'/'+its.length,'questions answered')+stat(ans?Math.round(ok/ans*100)+'%':'—','accuracy')+stat(open.length,'open mistakes')+'</div>'+
    '<h2 class="s">Objectives</h2><p class="small">Each objective with your cards and questions. Weak ones (missed questions or shaky cards) are marked.</p>'+
    outline.map(s=>(s.title?'<h3 class="dvsec">'+esc(s.title)+'</h3>':'')+s.objs.map(row).join('')).join('')+(extra.length?'<h3 class="dvsec">Other</h3>'+extra.map(row).join(''):'')+
    (weeks.length?'<h2 class="s">In the study plan</h2>'+weeks.map(w=>'<div class="dvrow'+(w.w===cw?' now':'')+'"><span class="obj">Wk '+w.w+'</span><span class="dvt"><b>'+esc(w.d)+(w.w===cw?' · this week':'')+'</b><span class="small">'+esc(w.g)+(w.exam?' · '+esc(w.exam):'')+'</span></span><span class="mb"><button type="button" class="lnk" data-dact="plan">Plan</button></span></div>').join(''):'')+
    '<h2 class="s">My material</h2><p class="small">'+pts.length+' point'+(pts.length===1?'':'s')+', '+myC+' card'+(myC===1?'':'s')+' and '+myQ+' question'+(myQ===1?'':'s')+' of your own for '+d+'. <a href="#mine">Open My material</a></p>';
  view.onclick=ev=>{
    const a=ev.target.closest('[data-dact]');
    if(a){const k=a.dataset.dact;
      if(k==='cards'){S.deck='div:'+d;S.fcMode=cc.due?'due':'all';save();go('cards');}
      if(k==='practice'){S.qdiv=d;S.qmode='all';save();go('practice');}
      if(k==='timed')go('practice',{timed:{div:d,n:10}});
      if(k==='mistakes'){if(due.length){S.qdiv=d;S.qmode='due';save();go('practice');}else go('mistakes');}
      if(k==='notes')go(d.toLowerCase());
      if(k==='plan')go('plan');
      return;}
    const n=ev.target.closest('[data-onotes]'); if(n){gotoObj(n.dataset.onotes);return;}
    const c=ev.target.closest('[data-ocards]'); if(c){go('cards',{obj:c.dataset.ocards});return;}
    const q=ev.target.closest('[data-oq]'); if(q)go('practice',{obj:q.dataset.oq});
  };
}
/* any PA / PPD / PDD label marked data-div opens its division page */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-div]'); if(!b||!DIVS.includes(b.dataset.div))return;
  // a card's own controls (exam date, "I passed") keep working, and so does a date being edited
  const ctl=e.target.closest('button,input,label,a,select,textarea'); if(ctl&&ctl!==b&&!ctl.hasAttribute('data-div'))return;
  if(b.querySelector('.exin'))return;
  e.preventDefault(); go('div-'+b.dataset.div.toLowerCase());
});

/* ================= NOTES ================= */
function initNotes(id){
  // on-this-page chips
  const hs=$$('h2.s',view);
  if(hs.length>2){
    const lede=$('.lede',view);
    const toc=document.createElement('div');toc.className='toc';
    toc.innerHTML=hs.map((h,i)=>'<button type="button" data-h="'+i+'">'+esc(h.textContent.replace(/\s*\d+–\d+%\s*$/,'').trim())+'</button>').join('');
    (lede||hs[0]).insertAdjacentElement(lede?'afterend':'beforebegin',toc);
    toc.addEventListener('click',e=>{const b=e.target.closest('button[data-h]');if(b)flashEl(hs[+b.dataset.h]);});
  }
  if(id==='overview')drawWeights();
  // make objective chips clickable to drill that objective
  $$('h3 .obj',view).forEach(ch=>{const o=ch.textContent.trim();if(CARDS.some(c=>c.o===o)||ITEMS.some(i=>i.o===o)){ch.classList.add('go');ch.title='Drill '+o;ch.addEventListener('click',()=>openObjDrill(o));}});
  // your own study points: under the matching objective heading, the rest in a box at the top
  const D=canonDiv(id);
  if(D){
    const pts=myPoints().filter(p=>p.div===D), loose=[];
    pts.forEach(p=>{
      const chip=p.obj&&$$('h3 .obj',view).find(c=>c.textContent.trim()===D+' '+p.obj);
      if(chip)chip.closest('h3').insertAdjacentHTML('afterend',pointHtml(p,true)); else loose.push(p);
    });
    const anchor=$('.toc',view)||$('.lede',view);
    if(anchor)anchor.insertAdjacentHTML('afterend','<div class="mybox"><div class="row" style="justify-content:space-between"><b>My points for '+D+'</b><button type="button" class="btn sm" data-padd="1">+ Add a point</button></div>'+
      (loose.length?loose.map(p=>pointHtml(p,true)).join(''):(pts.length?'':'<p class="small" style="margin:6px 0 0;color:var(--ink-2)">Add your own notes here. Give a point an objective (like '+D+' 4.3) and it appears under that heading.</p>'))+'</div>');
    view.onclick=e=>{
      const a=e.target.closest('[data-padd]'); if(a){pointEditor(null,{div:D},()=>go(id,{keepScroll:true}));return;}
      const ed=e.target.closest('[data-pedit]'); if(ed){const p=myPoints().find(x=>x.id===ed.dataset.pedit);if(p)pointEditor(p,null,()=>go(id,{keepScroll:true}));}
    };
    // an "add a point" shortcut on each objective heading
    $$('h3 .obj',view).forEach(ch=>{const m=ch.textContent.trim().match(/^(PA|PPD|PDD|PcM|PjM) (\d+\.\d+)$/);if(!m)return;const h=ch.closest('h3');if(h.querySelector('.addpt'))return;
      h.insertAdjacentHTML('beforeend','<button type="button" class="addpt" title="Add my point to '+m[0]+'" aria-label="Add my point to '+m[0]+'">+ point</button>');
      h.lastElementChild.onclick=()=>pointEditor(null,{div:m[1],obj:m[2]},()=>go(id,{keepScroll:true}));});
  }
}
function drawWeights(){
  Object.keys(WEIGHTS).forEach(k=>{
    const el=$('#wt-'+k,view); if(!el)return;
    const total=(k==='pa')?75:100;
    el.innerHTML=WEIGHTS[k].map(r=>{const lo=Math.round(total*r[1]/100),hi=Math.round(total*r[2]/100),pct=(r[2]/45)*100;
      return '<div class="row"><div>'+r[0]+'</div><div class="bar'+(r[3]?' hi':'')+'"><span style="width:'+Math.min(100,pct).toFixed(1)+'%"></span></div><div class="num">'+lo+'–'+hi+'</div></div>';}).join('')+
      '<div class="row" style="border-top:1px solid var(--rule);margin-top:6px;padding-top:8px"><div style="font-weight:600">Items in the division</div><div></div><div class="num" style="font-weight:600">'+total+'</div></div>';
  });
}
function flashEl(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl');}
function gotoObj(o){
  const d=odiv(o);
  if(!d){go('cards');return;}
  go(d.toLowerCase());
  const chip=$$('.obj',view).find(c=>c.textContent.trim()===o);
  if(chip){setTimeout(()=>flashEl(chip.closest('h3,h4,h2,p,div')||chip),60);return;}
  go('objectives');
  const row=$$('tr',view).find(tr=>{const td=$('td',tr);return td&&td.textContent.trim()===o.split(' ')[1]&&tr.closest('.tw').previousElementSibling&&tr.closest('.tw').previousElementSibling.textContent.includes(d);});
  if(row)setTimeout(()=>flashEl(row),60);
}
function openObjDrill(o){
  const cs=CARDS.filter(c=>c.o===o).length, qs=ITEMS.filter(i=>i.o===o).length;
  modal('<div class="lbl">'+esc(o)+'</div><div class="q">'+esc(objTitle(o))+'</div><p class="small">'+cs+' flashcard'+(cs===1?'':'s')+' and '+qs+' practice question'+(qs===1?'':'s')+' test this objective.</p><div class="row">'+
    (cs?'<button type="button" class="btn pri" data-a="c">Drill the cards</button>':'')+(qs?'<button type="button" class="btn" data-a="q">Show the questions</button>':'')+'<button type="button" class="btn" data-a="x">Close</button></div>',
    a=>{if(a==='c')go('cards',{obj:o});if(a==='q')go('practice',{obj:o});});
}

/* ================= MODAL ================= */
function modal(html,onAct){
  const m=$('#modal'),s=$('#scrim');m.innerHTML=html;m.hidden=false;s.hidden=false;
  const close=()=>{m.hidden=true;s.hidden=true;m.onclick=null;document.removeEventListener('keydown',kd);};
  const kd=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',kd);
  s.onclick=close;
  m.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;close();if(onAct)onAct(b.dataset.a);};
  const f=$('button',m);if(f)f.focus();
}

/* ================= ACCOUNTS (Amazon Cognito + progress API) =================
   On when config.js holds all four values and the page is not inside claude.ai
   (claude.ai has its own sign-in and sync). */
const AC=window.ARE_AUTH||{};
const AUTH_ON=!!(AC.region&&AC.userPoolId&&AC.clientId&&AC.apiUrl)&&!(window.claude&&window.claude.use);
const LSA='are_auth_v1';
let SESSION=null;
function jwtClaims(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return {};}}
const COGMSG={NotAuthorizedException:'Email or password is wrong.',UserNotFoundException:'Email or password is wrong.',UserNotConfirmedException:'Confirm your email first. Enter the code we sent you.',UsernameExistsException:'An account with this email already exists. Sign in instead.',CodeMismatchException:'That code is not right. Check the most recent email.',ExpiredCodeException:'That code has expired. Send a new one.',InvalidPasswordException:'Use at least 8 characters, including a lowercase letter and a number.',LimitExceededException:'Too many attempts. Wait a few minutes, then try again.',TooManyRequestsException:'Too many attempts. Wait a few minutes, then try again.',CodeDeliveryFailureException:'The email could not be sent. Check the address and try again.'};
async function cog(action,body){
  let r;
  try{r=await fetch('https://cognito-idp.'+AC.region+'.amazonaws.com/',{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+action},body:JSON.stringify(body)});}
  catch(e){const x=new Error('No connection. Check your internet and try again.');x.code='Network';throw x;}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const t=(j.__type||'').split('#').pop();const x=new Error(COGMSG[t]||(t==='InvalidParameterException'&&j.message)||'Something went wrong. Try again.');x.code=t;throw x;}
  return j;
}
function setSession(res,email){
  const c=jwtClaims(res.IdToken);
  SESSION={id:res.IdToken,refresh:res.RefreshToken||(SESSION&&SESSION.refresh),exp:Date.now()+(res.ExpiresIn||3600)*1000-120000,sub:c.sub,email:c.email||email||'',name:c.name||'',groups:[].concat(c['cognito:groups']||[])};
  try{localStorage.setItem(LSA,JSON.stringify({refresh:SESSION.refresh,email:SESSION.email,sub:SESSION.sub,name:SESSION.name}));}catch(e){}
}
function storedAuth(){try{return JSON.parse(localStorage.getItem(LSA)||'null');}catch(e){return null;}}
/* returns true, false (must sign in again) or 'offline' */
async function refreshSession(){
  const st=storedAuth(), rt=(SESSION&&SESSION.refresh)||(st&&st.refresh);
  if(!rt)return false;
  try{const j=await cog('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:AC.clientId,AuthParameters:{REFRESH_TOKEN:rt}});
    j.AuthenticationResult.RefreshToken=rt; setSession(j.AuthenticationResult,st&&st.email); return true;}
  catch(e){return e.code==='Network'?'offline':false;}
}
async function resumeSession(){
  const st=storedAuth(); if(!st||!st.refresh)return false;
  const r=await refreshSession();
  if(r===true)return true;
  if(r==='offline'&&st.sub){SESSION={refresh:st.refresh,sub:st.sub,email:st.email,name:st.name,exp:0,offline:true};return true;}
  try{localStorage.removeItem(LSA);}catch(e){}
  return false;
}
async function idToken(){
  if(!SESSION)return null;
  if(SESSION.offline||Date.now()>SESSION.exp){const r=await refreshSession();if(r!==true)return null;}
  return SESSION.id;
}
async function api(method,body){
  const t=await idToken(); if(!t)throw noteSyncErr(method,-1,'could not refresh the sign-in');
  let r;try{r=await fetch(AC.apiUrl.replace(/\/+$/,'')+'/progress',{method,headers:Object.assign({Authorization:'Bearer '+t},body?{'Content-Type':'application/json'}:{}),body});}catch(e){throw noteSyncErr(method,0,String(e&&e.message||e));}
  if(!r.ok){const txt=await r.text().catch(()=>'');throw noteSyncErr(method,r.status,txt);}
  return r.status===204?null:r.json();
}
function enterApp(){
  PROF={list:[{id:'u_'+SESSION.sub,name:SESSION.name||SESSION.email.split('@')[0]}],cur:'u_'+SESSION.sub};
  loadLocal(); paintProf();
  $('#authView').hidden=true; $('#shell').hidden=false;

}
async function signOut(){
  clearTimeout(saveT);
  if(SESSION&&!SESSION.offline&&S.at){try{await api('PUT',JSON.stringify(S));}catch(e){}}
  clearTimeout(retryT); dirty=false;
  try{localStorage.removeItem(lsKey(PROF.cur));localStorage.removeItem(LSA);}catch(e){}
  SESSION=null; S=blankState(); synced=false; setSync(); CG.st=null; paintAiBtn();
  $('#modal').hidden=true; $('#scrim').hidden=true;
  showAuth('signin',{msg:'Signed out. Your progress is saved in your account.'});

    if(a2==='leg'){const x=leg.find(y=>y.id===id);if(!x)return;S=Object.assign(blankState(),x.st);normalize();save();close();go(curPage||'today');toast('Progress from '+x.name+' added to your account');}
    if(a2==='exp'){const code='ARE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#pCode',m);ta.value=code;try{navigator.clipboard.writeText(code).then(()=>toast('Progress code copied'),()=>ta.select());}catch(e){ta.select();}}
    if(a2==='imp'){const raw=$('#pCode',m).value.trim();try{if(!raw.startsWith('ARE1.'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));if(!d||d.v!==2)throw 0;S=Object.assign(blankState(),d);normalize();save();close();go(curPage||'today');toast('Progress imported');}

let authMem={};
function showAuth(mode,o){
  o=o||{}; $('#shell').hidden=true; $('#authView').hidden=false;
  const f=(id,label,type,extra)=>'<label class="af" for="'+id+'"><span>'+label+'</span><input id="'+id+'" type="'+type+'" '+(extra||'')+'></label>';
  const E=esc(authMem.email||'');
  const V={
    signin:['Sign in','Pick up where you left off, on any device.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"')+f('aPass','Password','password','autocomplete="current-password" required'),'Sign in','<button type="button" class="lnk" data-m="signup">Create an account</button><button type="button" class="lnk" data-m="forgot">Forgot password?</button>'],
    signup:['Create your account','Your flashcards, answers, mistakes and plan follow you to every device.',f('aName','Your name','text','autocomplete="name" maxlength="40" required')+f('aEmail','Email','email','autocomplete="email" required value="'+E+'"')+f('aPass','Password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Create account','<button type="button" class="lnk" data-m="signin">I already have an account</button>'],
    confirm:['Check your email','We sent a 6-digit code to '+E+'. Enter it to confirm your account.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required'),'Confirm','<button type="button" class="lnk" data-m="resend">Send a new code</button><button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    forgot:['Reset your password','Enter your email and we will send you a code.',f('aEmail','Email','email','autocomplete="username" required value="'+E+'"'),'Send code','<button type="button" class="lnk" data-m="signin">Back to sign in</button>'],
    reset:['Choose a new password','Enter the code we emailed to '+E+' and your new password.',f('aCode','Code','text','inputmode="numeric" autocomplete="one-time-code" maxlength="8" required')+f('aPass','New password','password','autocomplete="new-password" minlength="8" required')+'<p class="ahint">At least 8 characters, with a lowercase letter and a number.</p>','Set password','<button type="button" class="lnk" data-m="signin">Back to sign in</button>']
  }[mode];
  $('#authBody').innerHTML='<h1>'+V[0]+'</h1><p class="asub">'+V[1]+'</p>'+(o.msg?'<div class="learned good">'+esc(o.msg)+'</div>':'')+'<div class="aerr" id="aErr" role="alert" hidden></div>'+
    '<form id="aForm" novalidate>'+V[2]+'<button type="submit" class="btn pri abtn" id="aGo">'+V[3]+'</button></form><div class="alinks">'+V[4]+'</div>';
  const first=$('#authBody input:not([value]),#authBody input[value=""]')||$('#authBody input'); if(first)first.focus();
  $('#authBody').onclick=async e=>{const b=e.target.closest('[data-m]');if(!b)return;
    if(b.dataset.m==='resend'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});showAuth('confirm',{msg:'A new code is on its way.'});}catch(x){authErr(x.message);}return;}
    showAuth(b.dataset.m);};
  $('#aForm').onsubmit=async e=>{
    e.preventDefault();
    const v=id=>{const el=$('#'+id);return el?el.value.trim():'';}, go1=$('#aGo');
    const need=$$('#aForm input').find(i=>!i.value.trim()); if(need){authErr('Fill in '+need.closest('label').querySelector('span').textContent.toLowerCase()+'.');need.focus();return;}
    go1.disabled=true; const label=go1.textContent; go1.textContent='Please wait…';
    try{
      if(mode==='signin'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;await doSignIn();return;}
      if(mode==='signup'){authMem.email=v('aEmail');authMem.pass=$('#aPass').value;
        await cog('SignUp',{ClientId:AC.clientId,Username:authMem.email,Password:authMem.pass,UserAttributes:[{Name:'email',Value:authMem.email},{Name:'name',Value:v('aName')}]});
        showAuth('confirm');return;}
      if(mode==='confirm'){await cog('ConfirmSignUp',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode')});
        if(authMem.pass){await doSignIn();}else showAuth('signin',{msg:'Email confirmed. Sign in to continue.'});return;}
      if(mode==='forgot'){authMem.email=v('aEmail');await cog('ForgotPassword',{ClientId:AC.clientId,Username:authMem.email});showAuth('reset');return;}
      if(mode==='reset'){authMem.pass=$('#aPass').value;await cog('ConfirmForgotPassword',{ClientId:AC.clientId,Username:authMem.email,ConfirmationCode:v('aCode'),Password:authMem.pass});await doSignIn();return;}
    }catch(x){
      if(x.code==='UserNotConfirmedException'){try{await cog('ResendConfirmationCode',{ClientId:AC.clientId,Username:authMem.email});}catch(_){}showAuth('confirm',{msg:'Your email is not confirmed yet. We sent a new code.'});return;}
      authErr(x.message); go1.disabled=false; go1.textContent=label;
    }
  };
}
function authErr(t){const el=$('#aErr');if(!el)return;el.textContent=t;el.hidden=false;}
async function doSignIn(){
  const j=await cog('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:AC.clientId,AuthParameters:{USERNAME:authMem.email,PASSWORD:authMem.pass}});
  if(!j.AuthenticationResult){const x=new Error('This account needs a step the site does not support yet ('+(j.ChallengeName||'unknown')+').');throw x;}
  setSession(j.AuthenticationResult,authMem.email); authMem.pass=''; enterApp();
}

const divSel=(id,val,withOther)=>'<select class="sel" id="'+id+'">'+DIVS.concat(withOther?['—']:[]).map(d=>'<option value="'+d+'"'+(d===val?' selected':'')+'>'+(d==='—'?'No division':d)+'</option>').join('')+'</select>';

/* ================= STUDY PACKS: import / export many points, cards and questions at once =================
   One JSON object (the format AI tools write most reliably):
   { "format":"are-study-pack", "version":1, "title":"…",
     "points":[{"division":"PA","objective":"4.3","text":"…"}],
     "cards":[{"deck":"…","division":"PPD","objective":"2.2","question":"…","answer":"…"}],
     "questions":[{"division":"PDD","objective":"3.2","type":"mc","question":"…","options":["…","…"],"correct":["…"],"explanation":"…"}] } */
const PACK_EXAMPLE={format:'are-study-pack',version:1,title:'PPD egress — my notes',
  points:[{division:'PPD',objective:'2.2',text:'Occupant load: **business = 150 SF gross** in the 2021 IBC (it was 100 in 2018).\n\n- round occupant load UP\n- check both the capacity and the 44 in minimum'}],
  cards:[{deck:'PPD · My egress cards',division:'PPD',objective:'2.2',question:'Minimum number of exits for 620 occupants on one storey',answer:'**3 exits.** 1–500 → 2 · 501–1,000 → 3 · over 1,000 → 4.'}],
  questions:[{division:'PPD',objective:'2.2',type:'mc',question:'A sprinklered Group B floor has an occupant load of 180. Which governs the stair width?',
    options:['180 × 0.2 in = 36 in','180 × 0.3 in = 54 in','The 44 in minimum stair width','The 36 in minimum for fewer than 50 occupants'],
    correct:['The 44 in minimum stair width'],explanation:'180 × 0.2 = 36 in is below the 44 in minimum for 50 or more occupants, so the minimum governs. 0.3 in applies only without sprinklers plus voice/alarm.'},
    {division:'PPD',objective:'2.2',type:'num',title:'Stair width from occupant load',question:'A sprinklered Group A floor has an occupant load of 300. Using 0.2 in. per occupant, what total stair width is required, in inches?',answer:60,tolerance:0,unit:'in.',explanation:'300 × 0.2 = 60 in. That is above the 44 in. minimum, so 60 in. governs.'},
    {division:'PPD',objective:'2.1',type:'match',title:'Occupancy groups',question:'Match each use to its IBC occupancy group.',statements:['A dentist office','A K–8 school','A retail store'],choices:['Group B','Group E','Group M'],matches:['Group B','Group E','Group M'],explanation:'Outpatient clinics and offices are B; schools through grade 12 are E; retail sales are M.'}]};
function aiPackPrompt(){
  return 'Turn my study notes into an ARE study pack for the ARE Study System.\n\n'+
  'Reply with ONE JSON object and nothing else, in exactly this shape:\n\n'+JSON.stringify(PACK_EXAMPLE,null,2)+'\n\n'+
  'Rules:\n'+
  '- "division" is one of '+DIVS.map(d=>'"'+d+'"').join(', ')+' ("General" is allowed for points).\n'+
  '- "objective" is the NCARB objective number such as "2.2", or "" if none fits.\n'+
  '- "points": short study notes worth rereading. "text" may use "- " bullets, "1. " steps, **bold**, and blank lines between paragraphs.\n'+
  '- "cards": flashcards. "question" is a prompt; "answer" is what to recall, complete lists where the exam tests lists.\n'+
  '- "questions": exam-style items in four formats: "mc", "cata", "num" and "match" (see the examples above). Write the same concept in more than one format where it fits.\n'+FORMAT_RULES+'\n'+
  '- Only use facts that are in my notes or that you are confident are current (2021 IBC, 2010 ADA Standards, ARE 5.0). Do not invent code section numbers.\n'+
  '- Leave out any list you have nothing for.\n\n'+

/* read a pack from text: tolerant of code fences and text around the JSON */
/* one question in study-pack form → a question item, any of the four types:
   mc / cata: options[], correct[] (option text, letter or number)
   num:       answer (number), tolerance (optional), unit (optional)
   match:     statements[], choices[], matches[] (the right choice for each statement: text, letter or number)
   plus division, objective, title (optional), question and explanation. Problems are reported in words. */
/* a question item as stored in My material (from a pack, a generator or a similar-question loop) */
function itemFromPack(q){
  const it={d:q.d,o:q.o,t:q.t,s:(q.title?'<p class="qtitle">'+esc(q.title)+'</p>':'')+(/\n/.test(q.s)?md2html(q.s):oneLine(q.s)),e:q.e?md2html(q.e).replace(/^<p>([\s\S]*)<\/p>$/,'$1'):'',sraw:q.s,eraw:q.e};
  if(q.title)it.title=q.title;
  if(q.t==='num')Object.assign(it,{ans:q.ans,tol:q.tol,unit:q.unit||''});
  else Object.assign(it,{opts:q.opts,c:q.c});
  if(q.t==='match')it.items=q.items;
  return it;
}
/* and back to study-pack form (export, and the examples the AI follows) */
function packOf(q){
  const out={type:q.t};
  const tt=q.title||((String(q.s).match(/<p class="qtitle">([\s\S]*?)<\/p>/)||[])[1]);
  if(tt)out.title=strip(tt);
  out.question=q.sraw!=null?q.sraw:html2md(String(q.s).replace(/<p class="qtitle">[\s\S]*?<\/p>/,''));
  if(q.t==='num')Object.assign(out,{answer:+q.ans,tolerance:+q.tol||0,unit:q.unit||''});
  else if(q.t==='match')Object.assign(out,{statements:q.items.map(strip),choices:q.opts.map(strip),matches:q.c.map(k=>strip(q.opts[k]))});
  else Object.assign(out,{options:q.opts.map(strip),correct:q.c.map(k=>strip(q.opts[k]))});
  out.explanation=q.eraw!=null?q.eraw:html2md(q.e);
  return out;
}
function packQuestion(q,label,problems){
  const arr=v=>Array.isArray(v)?v:[], str=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
  const divOf=(d,o)=>canonDiv(d)||odiv(o)||'';
  const objOf=o=>{const m=String(o||'').match(/(\d+\.\d+)/);return m?m[1]:'';};
  const s=str(q.question||q.stem||q.s), div=divOf(q.division||q.div,q.objective), obj=objOf(q.objective||q.obj), e=str(q.explanation||q.why||q.e), title=str(q.title);
  label=label+(s?' (“'+s.slice(0,40)+'…”)':'');
  const bad=m=>{problems.push(label+' '+m+' and was skipped.');return null;};
  if(!s)return bad('has no question text');
  if(!DIVS.includes(div))return bad('needs a division ('+DIVS.join(', ')+')');
  const pick=(list,w)=>{if(typeof w==='number')return w;const x=str(w);let k=list.findIndex(o=>o.toLowerCase()===x.toLowerCase());
    if(k<0&&/^[A-Za-z]$/.test(x))k=x.toUpperCase().charCodeAt(0)-65; if(k<0&&/^\d+$/.test(x))k=+x;
    if(k<0&&x.length>3)k=list.findIndex(o=>o.toLowerCase().startsWith(x.toLowerCase().slice(0,25))||x.toLowerCase().startsWith(o.toLowerCase().slice(0,25)));
    return k>=0&&k<list.length?k:-1;};
  let ty=String(q.type||'').toLowerCase();
  const base={d:div,o:obj?div+' '+obj:div,title,s,e};
  if(/num|fill|calc/.test(ty)||(q.answer!=null&&!arr(q.options||q.opts||q.choices).length&&!arr(q.statements).length)){
    const v=numIn(q.answer!=null?q.answer:q.correct); if(v==null)return bad('is a fill-in question without a numeric answer');
    const dec=(String(q.answer).replace(/[$,]/g,'').split('.')[1]||'').length, tol=numIn(q.tolerance);
    return Object.assign(base,{t:'num',ans:v,tol:tol!=null&&tol>=0?tol:+(0.5*Math.pow(10,-dec)).toPrecision(3),unit:str(q.unit).slice(0,30)});
  }
  if(/match|drag/.test(ty)||arr(q.statements||q.items).length){
    const items=arr(q.statements||q.items).map(str).filter(Boolean), opts=arr(q.choices||q.options||q.opts).map(str).filter(Boolean);
    const c=arr(q.matches||q.correct).map(w=>pick(opts,w));
    if(items.length<2||opts.length<2)return bad('is a matching question that needs at least two statements and two choices');
    if(c.length!==items.length||c.some(k=>k<0))return bad('needs one right choice (from its choices) for every statement');
    return Object.assign(base,{t:'match',items,opts,c});
  }
  const opts=arr(q.options||q.opts||q.choices).map(str).filter(Boolean);
  if(opts.length<2)return bad('needs at least two options');
  const want=arr(q.correct!=null?(Array.isArray(q.correct)?q.correct:[q.correct]):(q.answer!=null?[q.answer]:[])), c=[];
  want.forEach(w=>{const k=pick(opts,w);if(k>=0&&!c.includes(k))c.push(k);});
  if(!c.length)return bad('has no correct option that matches one of its options');
  ty=/cata|all|multi/.test(ty)?'cata':(ty==='mc'?'mc':(c.length>1?'cata':'mc'));
  if(ty==='mc'&&c.length>1){ty='cata';problems.push(label+' is marked multiple choice but has '+c.length+' correct options, so it was imported as check-all-that-apply.');}
  return Object.assign(base,{t:ty,opts,c});
}
function parsePack(text){
  let t=String(text||'').replace(/^﻿/,'').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence)t=fence[1].trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('No study pack found. The file should contain one JSON object that starts with { and ends with }.');
  let j; try{j=JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('This is not valid JSON ('+e.message+'). If an AI wrote it, ask it to "reply with only the JSON object".');}
  const P={title:String(j.title||'').trim().slice(0,80)||'Study pack',points:[],cards:[],questions:[],problems:[]};
  const arr=v=>Array.isArray(v)?v:[];
  const divOf=(d,o)=>{const c=canonDiv(d)||odiv(o);if(c)return c;const u=String(d||'').toUpperCase().trim();return u==='GENERAL'||u==='GEN'?'GEN':'';};
  const objOf=o=>{const m=String(o||'').match(/(\d+\.\d+)/);return m?m[1]:'';};
  const str=v=>typeof v==='string'?v.trim():(v==null?'':String(v).trim());
  arr(j.points||j.notes).forEach((p,i)=>{
    const text=str(typeof p==='string'?p:(p.text||p.note||p.content||p.point));
    if(!text){P.problems.push('Point '+(i+1)+' has no text and was skipped.');return;}
    const div=divOf(p.division||p.div,p.objective)||'GEN';
    P.points.push({div,obj:div==='GEN'?'':objOf(p.objective||p.obj),text:text.slice(0,4000)});
  });
  arr(j.cards||j.flashcards).forEach((c,i)=>{
    const q=str(c.question||c.front||c.q), an=str(c.answer||c.back||c.a);
    if(!q||!an){P.problems.push('Card '+(i+1)+' needs both a question and an answer and was skipped.');return;}
    const div=divOf(c.division||c.div,c.objective), obj=objOf(c.objective||c.obj);
    P.cards.push({d:(str(c.deck)||P.title).slice(0,60),o:div&&div!=='GEN'?(obj?div+' '+obj:div):'—',q,a:an});
  });
  arr(j.questions||j.items).forEach((q,i)=>{const it=packQuestion(q,'Question '+(i+1),P.problems);if(it)P.questions.push(it);});
  if(!P.points.length&&!P.cards.length&&!P.questions.length&&!P.problems.length)throw new Error('The pack has no "points", "cards" or "questions" lists.');
  return P;
}
/* compare against what this person already has, so re-importing doesn't duplicate */
function packDupes(P){
  const norm=s=>strip(String(s||'')).toLowerCase().replace(/\s+/g,' ').trim();
  const havePts=new Set(myPoints().map(p=>norm(md2html(p.text)))), haveQ=new Set(CARDS.map(c=>norm(c.q))), haveS=new Set(ITEMS.map(i=>norm(i.s)));
  P.points.forEach(p=>{p.dup=havePts.has(norm(md2html(p.text)));});
  P.cards.forEach(c=>{c.dup=haveQ.has(norm(inlineMd(c.q)));});
  P.questions.forEach(q=>{q.dup=haveS.has(norm(inlineMd(q.s)));});
}
function importPack(P){
  S.custom=S.custom||{}; ['cards','items','points','packs'].forEach(k=>{S.custom[k]=S.custom[k]||{};});
  const pid='k'+Date.now().toString(36), now=Date.now(); let n={points:0,cards:0,questions:0};
  P.points.filter(x=>!x.dup).forEach(p=>{S.custom.points[newUid()]={div:p.div,obj:p.obj,text:p.text,at:now+n.points,pack:pid};n.points++;});
  P.cards.filter(x=>!x.dup).forEach(c=>{S.custom.cards[newUid()]={d:c.d,o:c.o,q:oneLine(c.q),a:md2html(c.a),qraw:c.q,araw:c.a,at:now,pack:pid};n.cards++;});
  P.questions.filter(x=>!x.dup).forEach(q=>{S.custom.items[newUid()]=Object.assign(itemFromPack(q),{at:now,pack:pid});n.questions++;});
  S.custom.packs[pid]={title:P.title,at:now,counts:n};
  rebuildMaterial(); save();
  return n;
}
function removePack(pid){
  const C=S.custom||{};
  ['cards','items','points'].forEach(k=>{const o=C[k]||{};Object.keys(o).forEach(id=>{if(o[id].pack===pid)delete o[id];});});
  if(C.packs)delete C.packs[pid];
  rebuildMaterial(); save();
}
function exportPack(){
  const C=S.custom||{}, pts=myPoints(), mc=CARDS.filter(c=>c.mine), mq=ITEMS.filter(q=>q.mine);
  const so=o=>{const x=splitObj(o);return {division:x.div==='—'?'':x.div,objective:x.obj};};
  return {format:'are-study-pack',version:1,title:(curProf().name||'My')+' — study material '+ds(new Date()),
    points:pts.map(p=>({division:p.div==='GEN'?'General':p.div,objective:p.obj||'',text:p.text})),
    cards:mc.map(c=>Object.assign({deck:c.d},so(c.o),{question:c.qraw!=null?c.qraw:html2md(c.q),answer:c.araw!=null?c.araw:html2md(c.a)})),
    questions:mq.map(q=>Object.assign(so(q.o),packOf(q)))};
}

/* a dialog that stays open: onAct(action, modalEl, close) for [data-a] clicks, onSubmit(form, modalEl, close) for forms */
function modalForm(html,onAct,onSubmit){
  const m=$('#modal'),s=$('#scrim');m.innerHTML=html;m.hidden=false;s.hidden=false;
  const close=()=>{m.hidden=true;s.hidden=true;m.onclick=null;m.onsubmit=null;document.removeEventListener('keydown',kd);};
  const kd=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',kd);
  s.onclick=close;
  m.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&onAct)onAct(b.dataset.a,m,close);};
  m.onsubmit=e=>{e.preventDefault();if(onSubmit)onSubmit(e.target,m,close);};
}

function fpool(){return fkeys?CARDS.filter(c=>fkeys.includes(ckey(c))):fobj?CARDS.filter(c=>c.o===fobj):cardPool();}
function startSession(){
  const p=fpool(), now=Date.now();
  fsess=0;
  if(S.fcMode==='all'||fobj||fkeys){
    fq=shuffle(p.slice()).sort((a,b)=>{const x=cstate(a),y=cstate(b);return (x?x.b:-1)-(y?y.b:-1);});
  } else {
    const due=p.filter(c=>{const s=cstate(c);return s&&s.due<=now;}).sort((a,b)=>cstate(a).b-cstate(b).b||cstate(a).due-cstate(b).due);
    const nw=shuffle(p.filter(c=>!cstate(c))).slice(0,20);

function nextCard(){

function paintCard(){

  if(fshown)$('#fcStage').insertAdjacentHTML('beforeend','<div class="fcstat swipehint">Swipe the card left for Again, right for Good</div>');
  attachSwipe($('#flash'));

  if(fshown&&AI_POSSIBLE){$('#fcStage').insertAdjacentHTML('beforeend','<div class="fcai"><button type="button" class="lnk" id="fcAi">Explain this card with '+AI_NAME()+'</button></div>');$('#fcAi').onclick=()=>aiExplainCard(fcur,$('#fcStage'));}

  $('#fcStat').innerHTML='<span>'+(fq.length+1)+' left this session</span><span>'+fsess+' rated</span><span>'+c.strong+' strong · '+c.learn+' learning · '+c.nw+' new</span>';

/* touch: once the answer shows, swipe left = Again, right = Good; vertical drags scroll the page */
let swiped=false;
function attachSwipe(el){
  let sx=0,sy=0,dx=0,on=false,decided=false;
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;sx=e.clientX;sy=e.clientY;dx=0;on=true;decided=false;swiped=false;});
  el.addEventListener('pointermove',e=>{
    if(!on)return;const mx=e.clientX-sx,my=e.clientY-sy;
    if(!decided){if(Math.abs(mx)<8&&Math.abs(my)<8)return;decided=true;if(Math.abs(my)>Math.abs(mx)){on=false;return;}el.classList.add('drag');try{el.setPointerCapture(e.pointerId);}catch(_){}}
    dx=fshown?mx:mx*0.15;
    el.style.transform='translateX('+dx+'px) rotate('+(dx/30)+'deg)';
  });
  const end=()=>{
    if(!on)return;on=false;el.classList.remove('drag');
    const th=Math.min(110,(window.innerWidth||400)*0.26);
    if(fshown&&Math.abs(dx)>th){swiped=true;el.style.transform='translateX('+(dx<0?-1:1)*window.innerWidth+'px)';el.style.opacity='0';setTimeout(()=>rate(dx<0?1:3),160);return;}
    if(Math.abs(dx)>8)swiped=true;
    el.style.transform='';setTimeout(()=>{swiped=false;},50);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function goodLabel(s){const nb=s?Math.min(5,s.b+1):2;const d=Math.round(INT[nb]/DAY);return d+' day'+(d===1?'':'s');}
function reveal(){if(!fcur||fshown)return;fshown=true;paintCard();const r=$('.rate3 .r3');if(r)r.focus({preventScroll:true});}
function rate(r){
  if(!fcur||!fshown)return;
  const k=ckey(fcur), s=S.cards[k]||{b:0,n:0,due:0}, now=Date.now();
  if(r===1){S.cardMiss[k]=(S.cardMiss[k]||0)+1;s.b=0;s.due=now+INT[0];fq.splice(Math.min(3,fq.length),0,fcur);}
  else if(r===2){s.b=Math.max(1,Math.min(s.b,2));s.due=now+DAY;}
  else{s.b=Math.min(5,(S.cards[k]?s.b:1)+1);s.due=now+INT[s.b];}
  s.n=(s.n||0)+1; s.r=r; S.cards[k]=s;
  fsess++; logAct(); save(); nextCard();

/* one item card. mode.live: answers record immediately; mode.run: selection only, no reveal; mode.review: show result for given sel.
   sel is a list: option numbers (mc, cata), [the typed number] (num), or the chosen option for each statement (match) */
function itemEl(it,idx,mode){

  else if(it.t==='match'){const order=shuffle(it.items.map((x,i)=>i));   // shuffled, so the order of the statements gives nothing away
    body='<div class="qmatch">'+order.map(i=>'<div class="qmrow" data-mi="'+i+'"><div class="qmtxt">'+esc(it.items[i])+'</div><select class="sel qmsel" data-mi="'+i+'" aria-label="Your match for this statement"><option value="-1">Choose…</option>'+it.opts.map((o,k)=>'<option value="'+k+'">'+esc(o)+'</option>').join('')+'</select><div class="qmans" hidden></div></div>').join('')+'</div>';}
  else body=it.opts.map((o,i)=>'<button type="button" class="opt" data-i="'+i+'">'+esc(o)+'</button>').join('');
  el.innerHTML='<div class="meta"><span class="pill '+it.d.toLowerCase()+'">'+it.d+'</span><span>'+esc(it.o)+'</span><span>·</span><span>'+qTypeName(it)+'</span>'+(it.mine?'<span class="chip c-out">Yours</span>':it.edited?'<span class="chip c-rot">Edited</span>':'')+(mode.onSel||!editable?'':'<button type="button" class="lnk" data-act="edit" style="margin-left:auto;font-size:11px">Edit</button>')+'</div>'+
    '<div class="stem">'+it.s+'</div>'+body+'<div class="foot"></div><div class="exp" hidden></div>';
  const foot=$('.foot',el);
  let sel=(mode.sel||[]).slice();

  const complete=s=>it.t==='num'?numIn(s[0])!=null:it.t==='match'?s.length===it.items.length&&s.every(v=>v>=0):s.length>0;

    else if(it.t==='match')it.items.forEach((x,i)=>{const sl=$('.qmsel[data-mi="'+i+'"]',el),row=sl.closest('.qmrow'),v=s[i]!=null?+s[i]:-1,good=v===it.c[i];
      sl.value=String(v);sl.disabled=true;row.classList.add(good?'right':'wrong');if(!good){const ans=$('.qmans',row);ans.hidden=false;ans.textContent='Answer: '+it.opts[it.c[i]];}});
    else $$('.opt',el).forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove('on');if(it.c.includes(i))b.classList.add('right');else if(s.includes(i))b.classList.add('wrong');});

    foot.innerHTML='<button type="button" class="lnk" data-act="reread">Reread '+esc(it.o)+'</button>'+(mode.live&&!mode.drill?'<button type="button" class="lnk" data-act="retry">Try again</button>':'')+(!ok&&AI_POSSIBLE?'<button type="button" class="lnk" data-act="aiexp">Explain with '+AI_NAME()+'</button>':'')+((!ok||mode.drill)&&CG_DISCUSS?'<button type="button" class="lnk" data-act="cgdisc">Discuss in ChatGPT</button>':'')+(!ok&&!mode.loop&&mode.live?'<button type="button" class="lnk" data-act="loop">Learn it with similar questions</button>':'');

      if(a.dataset.act==='reread')gotoObj(it.o);
      if(a.dataset.act==='cgdisc'){discussInChatGPT(it.id,S.ans[idx]&&S.ans[idx].ok);return;}
      if(a.dataset.act==='loop'){learnLoop(el,it);return;}
      if(a.dataset.act==='aiexp'){aiExplainItem(it,(S.ans[idx]&&S.ans[idx].sel)||mode.sel||[],el,S.mist[idx]&&!S.mist[idx].fixed?idx:null);return;}
      if(a.dataset.act==='edit'){itemEditor(it,()=>{const nw=ITEM(it.id);if(nw)el.replaceWith(itemEl(nw,nw.id,mode));else el.remove();});return;}
      if(a.dataset.act==='retry'){el.replaceWith(itemEl(it,idx,Object.assign({},mode,{fresh:true})));}
      if(a.dataset.act==='submit')submit();
      return;
    }
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const i=+b.dataset.i;
    if(it.t==='mc'){sel=[i];}else{sel=sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i);}
    if(mode.live&&it.t==='mc'){const r=record(idx,sel,mode.loop?{practice:true}:null);showResult(sel,r);refreshProg();if(mode.onResult)mode.onResult(itemOk(it,sel));else afterMiss(it,sel);return;}

}
/* record an answer and learn from it; returns {cls,msg} describing what the system did */
function record(idx,sel,o){
  const it=ITEM(idx), ok=itemOk(it,sel), now=Date.now();
  S.ans[idx]={sel:sel.slice(),ok:ok,at:now};
  let out=null;
  const m=S.mist[idx];
  if(o&&o.practice){logAct();save();return null;}   // a similar question in a learning loop: scored, not logged as a mistake
  if(!ok){
    const e=m||{n:0,note:''};
    e.n++; e.sel=sel.slice(); e.at=now; e.stage=0; e.due=now+MGAP[0]; e.fixed=false;
    S.mist[idx]=e;
    const q=queueObjCards(it.o);
    out={cls:'',msg:'<strong>Logged in your mistakes.</strong> This question comes back tomorrow'+(q?', and '+q+' '+esc(it.o)+' flashcard'+(q===1?' is':'s are')+' now in today\'s review':'')+'.'+(e.n>1?' You have missed it '+e.n+' times — add a note on the Mistakes page about what keeps tripping you.':'')};
  } else if(m&&!m.fixed){
    if(now>=m.due-6*36e5){ // on schedule (within 6 h of due): advance
      m.stage++;
      if(m.stage>=MGAP.length){m.fixed=true;m.fixedAt=now;out={cls:'good',msg:'<strong>Fixed.</strong> Right three times on schedule — this one has stuck.'};}
      else{m.due=now+MGAP[m.stage];out={cls:'good',msg:'<strong>Right on schedule</strong> ('+m.stage+' of 3). It comes back in '+Math.round(MGAP[m.stage]/DAY)+' days to make sure.'};}
    } else out={cls:'good',msg:'Right — but this was an early retry, so the schedule stays the same. It is due '+whenStr(m.due)+'.'};
  }
  logAct(); save();
  return out;
}
/* pull this objective's cards into today's review */
function queueObjCards(o){
  if(!o||o==='—')return 0;
  const now=Date.now(); let n=0;
  CARDS.filter(c=>c.o===o).forEach(c=>{const k=ckey(c),s=S.cards[k];
    if(!s){S.cards[k]={b:0,n:0,due:now,q:1};n++;}
    else if(s.due>now){s.due=now;s.b=Math.min(s.b,1);n++;}});

}
function whenStr(t){const d=Math.round((midnight(new Date(t))-midnight(new Date()))/DAY);return d<=0?'today':d===1?'tomorrow':'in '+d+' days';}
function mistDue(){const now=Date.now();return Object.keys(S.mist).filter(i=>{const m=S.mist[i];return !m.fixed&&m.due<=now&&ITEM(i);});}

/* timed run */
function startRun(div,n){
  let pool=ITEMS.map(it=>it.id).filter(i=>!div||ITEM(i).d===div);
  // prefer unanswered and missed items first
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  if(n)pool=pool.slice(0,n);
  startRunIdx(pool,div?'Timed set · '+div:'Timed set',div);
}
function startRunIdx(ids,label,div){
  const pool=shuffle(ids.slice());
  run={div:div||'',label:label,idx:pool,sel:{},cur:0,secs:Math.round(pool.length*2.4*60),start:Date.now(),done:false};
  paintRun();
  stopTimer();
  tmr=setInterval(()=>{const left=runLeft();const t=$('#runT');if(t){t.textContent=fmt(left);t.classList.toggle('low',left<120);}if(left<=0)finishRun();},1000);
}
function rank(i){const m=S.mist[i];if(m&&!m.fixed&&m.due<=Date.now())return 0;const a=S.ans[i];return !a?1:(a.ok?3:2);}
function runLeft(){return Math.max(0,run.secs-Math.floor((Date.now()-run.start)/1000));}
function fmt(s){return Math.floor(s/60)+':'+pad(s%60);}
function paintRun(){
  const area=$('#qzArea'); if(!area)return;

  area.innerHTML='<div class="qzctl"><div class="runbar"><div><span class="lbl">'+esc(run.label)+'</span><div class="timer" id="runT">'+fmt(runLeft())+'</div></div>'+
    '<div class="row"><button type="button" class="btn sm" id="runPrev"'+(run.cur?'':' disabled')+'>Previous</button><button type="button" class="btn sm" id="runNext">'+(run.cur<run.idx.length-1?'Next':'Review answers')+'</button><button type="button" class="btn sm pri" id="runEnd">Finish and score</button></div></div>'+
    '<div class="dots" id="runDots">'+run.idx.map((x,k)=>'<button type="button" data-k="'+k+'" class="'+(answered(ITEM(x),run.sel[x])?'ans':'')+(k===run.cur?' cur':'')+'" aria-label="Item '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div></div><div id="runItem"></div>';
  $('#runItem').appendChild(itemEl(it,i,{sel:run.sel[i]||[],onSel:s=>{run.sel[i]=s;const d=$$('#runDots button')[run.cur];if(d)d.classList.toggle('ans',answered(it,s));}}));
  $('#runPrev').onclick=()=>{run.cur--;paintRun();};

    else finishRun();
  };
  $('#runDots').onclick=e=>{const b=e.target.closest('button[data-k]');if(b){run.cur=+b.dataset.k;paintRun();}};

function finishRun(){
  if(!run||run.done)return; run.done=true; stopTimer();
  const used=Math.min(run.secs,Math.floor((Date.now()-run.start)/1000));
  let ok=0, logged=0, fixedN=0; const byObj={};
  run.idx.forEach(i=>{const s=run.sel[i]||[];const good=itemOk(ITEM(i),s);if(good)ok++;
    if(answered(ITEM(i),s)){const r=record(i,s);if(!good)logged++;else if(r&&S.mist[i]&&S.mist[i].fixed&&r.msg.indexOf('Fixed')>=0)fixedN++;}else{S.ans[i]={sel:[],ok:false,at:Date.now()};}
    if(!good)byObj[ITEM(i).o]=(byObj[ITEM(i).o]||0)+1;});
  save();
  const pct=Math.round(ok/run.idx.length*100);
  const area=$('#qzArea');
  area.innerHTML='<div class="qzctl"><div class="score"><b>'+ok+'/'+run.idx.length+'</b><span class="lbl">'+pct+'% correct · '+fmt(used)+' used of '+fmt(run.secs)+'</span></div>'+
    ((logged||fixedN)?'<div class="learned'+(logged?'':' good')+'" style="margin:0">'+(logged?logged+' wrong answer'+(logged===1?'':'s')+' logged on the Mistakes page; each comes back tomorrow and its objective\'s cards are in today\'s review. ':'')+(fixedN?fixedN+' earlier mistake'+(fixedN===1?'':'s')+' now fixed.':'')+'</div>':'')+
    (Object.keys(byObj).length?'<div class="row"><span class="lbl">Reread</span>'+Object.keys(byObj).map(o=>'<button type="button" class="btn sm" data-obj="'+esc(o)+'">'+esc(o)+(byObj[o]>1?' ×'+byObj[o]:'')+'</button>').join('')+'</div>':'<p class="small" style="margin:0">Clean sweep. Try a larger set or a different division.</p>')+
    '<div class="row"><button type="button" class="btn pri" id="runAgain">New timed set</button><button type="button" class="btn" id="runList">Back to the question bank</button></div></div><div id="runRev"></div>';
  run.idx.forEach(i=>$('#runRev').appendChild(itemEl(ITEM(i),i,{review:true,sel:run.sel[i]||[]})));
  const r=run; run=null;

let IDX=null;
function buildIndex(){
  IDX=[];
  CARDS.forEach((c,i)=>IDX.push({k:'Card · '+c.d,t:strip(c.q),x:strip(c.a),type:'card',ref:i}));
  ITEMS.forEach(it=>IDX.push({k:'Question · '+it.o,t:strip(it.s),x:qPlain(it),type:'item',ref:it.id}));
  myPoints().forEach(p=>{const t=strip(md2html(p.text));IDX.push({k:'My point · '+ptLabel(p),t:t.slice(0,140),x:t,type:'point',ref:p.id});});
  NOTE_PAGES.forEach(pid=>{
    const tpl=$('#tpl-'+pid); if(!tpl)return;
    const frag=tpl.content, pname=PAGES.find(p=>p.id===pid).n;
    const heads=$$('h1,h2,h3,h4',frag);
    heads.forEach((h,hi)=>{
      let txt='',n=h.nextElementSibling;
      while(n&&!/^H[1-4]$/.test(n.tagName)){txt+=' '+n.textContent;n=n.nextElementSibling;}
      IDX.push({k:'Notes · '+pname,t:h.textContent.replace(/\s+/g,' ').trim(),x:txt.replace(/\s+/g,' ').trim(),type:'head',page:pid,ref:hi});
    });
    $$('tr',frag).forEach((tr,ri)=>{const td=$$('td',tr);if(td.length<2)return;const cap=tr.closest('table');
      IDX.push({k:(pid==='numbers'?'Number':'Table')+' · '+pname,t:td[0].textContent.trim(),x:td.slice(1).map(x=>x.textContent.trim()).join(' · '),type:'row',page:pid,ref:ri});});
  });
  IDX.forEach(r=>{r.lt=r.t.toLowerCase();r.lx=r.x.toLowerCase();});
}
function hi(s,terms){let h=esc(s);terms.forEach(t=>{if(t.length<2)return;h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');});return h;}
function snippet(x,terms){const lx=x.toLowerCase();let p=-1;terms.some(t=>{p=lx.indexOf(t);return p>=0;});if(p<0)return x.slice(0,140);const s=Math.max(0,p-50);return (s?'…':'')+x.slice(s,s+160);}
function search(q){
  if(!IDX)buildIndex();
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length)return [];
  const out=[];
  IDX.forEach(r=>{let sc=0;for(const t of terms){const inT=r.lt.includes(t),inX=r.lx.includes(t);if(!inT&&!inX)return;sc+=inT?3:1;}
    if(r.lt.includes(q.toLowerCase()))sc+=4; if(r.type==='row')sc+=1; out.push([sc,r]);});
  return out.sort((a,b)=>b[0]-a[0]).slice(0,30).map(x=>x[1]);
}

function openResult(r){
  if(r.type==='card'){const c=CARDS[r.ref];const s=cstate(c);
    modal('<div class="lbl">'+esc(c.o)+' · '+esc(c.d)+(s?' · '+BOXNAME[s.b]:' · new')+'</div><div class="q">'+c.q+'</div><div class="a">'+c.a+'</div><div class="row"><button type="button" class="btn pri" data-a="deck">Study this deck</button>'+(odiv(c.o)?'<button type="button" class="btn" data-a="notes">Read the notes</button>':'')+'<button type="button" class="btn" data-a="x">Close</button></div>',
      a=>{if(a==='deck'){S.deck=c.d;S.fcMode='all';save();go('cards');}if(a==='notes')gotoObj(c.o);});return;}
  if(r.type==='item'){S.qdiv='';S.qmode='all';go('practice',{focus:r.ref});return;}
  if(r.type==='point'){go('mine',{focus:r.ref});return;}
  go(r.page);
  const el=r.type==='head'?$$('h1,h2,h3,h4',view)[r.ref]:$$('tr',view)[r.ref];
  setTimeout(()=>flashEl(el),60);
}
